/* One owner for the scrim: every read path calls busyOn/busyOff in a finally,
   so a failed read cannot leave the page covered. */
const busyEl = () => document.getElementById("busy");
/* On the landing view the opening is the page's own motion; a scrim over it
   reads as an error state. The read reports itself in the map's own footnote
   instead, and the full overlay is kept for reads started from inside a
   country, where nothing else on screen says anything is happening. */
let BUSY_QUIET = false;
/* A read started from the landing view lights the dots beside its buttons
   and drops the load prompt; a read from inside a country shows the busy
   overlay, which has its own dot grid. Both toggles here are class and
   attribute changes, so no re-render is needed;
   both are class and attribute toggles, so no re-render is needed. */
let WORKING = false;
function setWorking(on){
  WORKING = !!on;
  document.querySelectorAll(".workdots").forEach(d => d.hidden = !WORKING);
  const w = document.querySelector(".mapfull");
  if(w) w.classList.toggle("working", WORKING);
}
const ovlNote = t => { const n = document.getElementById("ovlNote"); if(n) n.textContent = t; };
function busyOn(title, note){
  setWorking(true);
  if(S.tab === "home"){ BUSY_QUIET = true; ovlNote(note || title || "Reading…"); return; }
  BUSY_QUIET = false;
  const b = busyEl();
  document.getElementById("busyTitle").textContent = title || "Reading results";
  document.getElementById("busyNote").textContent = note || "";
  b.hidden = false;
  requestAnimationFrame(()=>b.classList.add("on"));
}
function busySay(note){
  if(BUSY_QUIET){ ovlNote(note); return; }
  const n=document.getElementById("busyNote"); if(n) n.textContent = note;
}
function busyOff(){
  setWorking(false);
  if(BUSY_QUIET){ BUSY_QUIET = false; return; }   // the next render restores the footnote
  const b = busyEl();
  b.classList.remove("on");
  setTimeout(()=>{ if(!b.classList.contains("on")) b.hidden = true; }, 260);
}

/* ============================ opening =================================
   Step 0 is a scatter of small points over the whole screen. Each one then
   travels to a cell of land, west to east, so the world assembles as a dot
   matrix; the real map fades in behind them; then the country markers light
   in turn, north to south. The results parse while this plays.

   The dot layer outlives the opening: it stays as texture over the landing
   map and scatters away from the pointer, settling back when it passes. The
   canvas never takes the pointer — the map's own markers stay clickable. */
let INTRO_PLAYED = false;
/* A render while the opening is playing replaces the canvas the animation is
   drawing on, and the opening starts again from the scatter — which is what a
   background read looked like from the outside. The landing view holds its
   render until the opening is done, and takes it then. */
let INTRO_RUNNING = false, HOME_RERENDER = false;
const MAPW_LL = 960, MAPH_LL = 480;

/* Land cells in lon/lat, rasterised once from the same outline the map draws.
   A third of a map unit is finer than the dots, so the matrix reads as land
   rather than as a grid. */
let LANDCELLS = null;
function landCells(){
  if(LANDCELLS) return LANDCELLS;
  const s = 3, step = 1;   // one dot per raster cell: a dense matrix, not a grid
  const off = document.createElement("canvas");
  off.width = Math.round(MAPW_LL/s); off.height = Math.round(MAPH_LL/s);
  const o = off.getContext("2d", {willReadFrequently:true});
  o.setTransform(1/s,0,0,1/s,0,0);
  o.fillStyle = "#fff"; o.fill(new Path2D(LAND));
  const px = o.getImageData(0,0,off.width,off.height).data;
  const out = [];
  for(let gy=0; gy<off.height; gy+=step)
    for(let gx=0; gx<off.width; gx+=step)
      if(px[(gy*off.width+gx)*4+3] > 90)
        out.push([(gx*s)/MAPW_LL*360 - 180, 90 - (gy*s)/MAPH_LL*180]);
  LANDCELLS = out;
  return out;
}

const DOTS = {raf:0, dots:[], t0:0, ctx:null, cv:null, ctm:null,
              mx:-1e5, my:-1e5, live:false, phase:0, idle:0};
/* Timing, in ms from the first frame. */
const DT = {travel:900, map:2100, light:2900, step:95, ring:560};

/* The map's own transform is the source of truth for where a coordinate sits
   on screen, so the dots land on the coastline to the pixel however the
   viewport is shaped. */
function dotCTM(){
  const svg = document.getElementById("worldMap");
  if(!svg || !svg.getScreenCTM) return null;
  const m = svg.getScreenCTM();
  return m ? {a:m.a, d:m.d, e:m.e, f:m.f} : null;
}
const dotXY = (m, lon, lat) =>
  [m.a*((lon+180)/360*MAPW_LL) + m.e, m.d*((90-lat)/180*MAPH_LL) + m.f];

function dotsLayout(){
  const cv = DOTS.cv; if(!cv) return false;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  cv.style.width = w+"px"; cv.style.height = h+"px";
  DOTS.ctx.setTransform(dpr,0,0,dpr,0,0);
  DOTS.w = w; DOTS.h = h;
  DOTS.ctm = dotCTM();
  if(!DOTS.ctm) return false;
  for(const p of DOTS.dots){
    const [x,y] = dotXY(DOTS.ctm, p.lon, p.lat);
    p.tx = x; p.ty = y;
  }
  return true;
}

function mountDots(skipIntro){
  const cv = document.getElementById("globe");
  const wrap = document.querySelector(".mapfull");
  cancelAnimationFrame(DOTS.raf);
  if(!cv || !wrap) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    INTRO_PLAYED = true; cv.remove();
    wrap.classList.remove("intro","pinsoff"); markReady(); return;
  }
  DOTS.cv = cv; DOTS.ctx = cv.getContext("2d");
  const m = dotCTM();
  if(!m){ requestAnimationFrame(()=>mountDots(skipIntro)); return; }

  DOTS.dots = landCells().map(([lon,lat])=>{
    const [tx,ty] = dotXY(m, lon, lat);
    return {lon, lat, tx, ty, ox:0, oy:0,
      sx: Math.random()*innerWidth, sy: Math.random()*innerHeight,
      d: 120 + ((lon+180)/360)*620 + Math.random()*260,
      r: 0.42 + Math.random()*0.5, tw: Math.random()*Math.PI*2};
  });
  dotsLayout();

  INTRO_RUNNING = !skipIntro;
  if(skipIntro){                       // a re-render must not replay it
    DOTS.phase = 3;
    for(const p of DOTS.dots){ p.sx = p.tx; p.sy = p.ty; p.d = -1e5; }
    wrap.classList.remove("intro","pinsoff"); markReady();
  }else{
    DOTS.phase = 0;
    wrap.classList.add("intro","pinsoff");
    wrap.classList.remove("lighting");
  }
  DOTS.t0 = performance.now();
  DOTS.live = true; DOTS.idle = 0;
  DOTS.raf = requestAnimationFrame(dotsFrame);
}

/* The opening is over: the load prompt may now appear. */
function markReady(){
  const w = document.querySelector(".mapfull");
  if(w){ w.classList.add("ready"); placeLoadArrow(); }
}
/* The prompt's pointer sits over the button it is asking for. */
function placeLoadArrow(){
  const c = document.getElementById("loadCall");
  const b = document.querySelector(".ovl.callme");
  if(!c || !b) return;
  const cr = c.getBoundingClientRect(), br = b.getBoundingClientRect();
  if(cr.width) c.style.setProperty("--ax", Math.max(14, br.left + br.width/2 - cr.left) + "px");
}

/* The opening can be cut short; the dot layer stays either way. */
function dotsSkip(){
  if(DOTS.phase >= 3) return;
  INTRO_RUNNING = false;
  if(HOME_RERENDER){ HOME_RERENDER = false; setTimeout(render, 0); }
  for(const p of DOTS.dots){ p.sx = p.tx; p.sy = p.ty; p.d = -1e5; }
  DOTS.t0 = performance.now() - (DT.light + 13*DT.step + DT.ring);
}

function dotsFrame(now){
  const ctx = DOTS.ctx, el = now - DOTS.t0;
  if(!ctx || !DOTS.ctm || !DOTS.cv.isConnected){ DOTS.live = false; return; }
  const wrap = document.querySelector(".mapfull");
  ctx.clearRect(0,0,DOTS.w,DOTS.h);

  /* stage changes, once each */
  if(wrap && DOTS.phase === 0 && el > DT.map){
    wrap.classList.remove("intro"); DOTS.phase = 1;      // the map itself arrives
  }
  if(wrap && DOTS.phase === 1 && el > DT.light){
    wrap.classList.remove("pinsoff"); wrap.classList.add("lighting"); DOTS.phase = 2;
  }
  if(DOTS.phase === 2 && el > DT.light + 13*DT.step + DT.ring){
    INTRO_PLAYED = true; DOTS.phase = 3; INTRO_RUNNING = false; markReady();
    if(HOME_RERENDER){ HOME_RERENDER = false; setTimeout(render, 0); }
  }

  const settled = DOTS.phase >= 2;
  const dim = settled ? 0.42 : 1;

  /* Four thousand points a frame is only cheap if it is not four thousand
     draw calls: alpha is quantised into a few buckets and each bucket is one
     path, so the whole field costs six fills. */
  const NB = 6, buckets = [];
  for(let i=0;i<NB;i++) buckets.push(new Path2D());
  const R = 135, R2 = R*R;                                // the pointer's reach
  let moving = false;
  for(const p of DOTS.dots){
    const k = p.d < -1e4 ? 1 : ease3((el - p.d)/DT.travel);
    let x = p.sx + (p.tx - p.sx)*k, y = p.sy + (p.ty - p.sy)*k;
    /* A displacement field rather than free bodies: each dot is pushed to a
       target offset and eased toward it, so the pocket opens where the pointer
       rests and closes exactly on the grid when it leaves. No accumulated
       velocity, so nothing drifts out of place. */
    if(k >= 1){
      let gx = 0, gy = 0;
      const dx = x - DOTS.mx, dy = y - DOTS.my, d2 = dx*dx + dy*dy;
      if(d2 < R2 && d2 > 0.01){
        const d = Math.sqrt(d2), f = 1 - d/R;
        gx = (dx/d) * f*f * 34; gy = (dy/d) * f*f * 34;
      }
      if(gx || gy || p.ox || p.oy){
        p.ox += (gx - p.ox)*0.18;
        p.oy += (gy - p.oy)*0.18;
        if(Math.abs(p.ox) + Math.abs(p.oy) > 0.12) moving = true;
        else { p.ox = 0; p.oy = 0; }
        x += p.ox; y += p.oy;
      }
    }else moving = true;
    /* The field twinkles while it assembles and goes quiet once it has: a
       still field costs nothing to hold, since the loop then sleeps. */
    const tw = settled ? 0.62 + 0.38*Math.sin(p.tw) : 0.55 + 0.45*Math.sin(el/420 + p.tw);
    const lift = Math.min(1, (Math.abs(p.ox) + Math.abs(p.oy))/24);   // stirred dots brighten
    const a = Math.min(1, (k < 0.02 ? 0.35*tw : (0.35 + 0.65*k)*tw) * dim * (1 + 1.6*lift));
    const b = Math.min(NB-1, (a*NB)|0);
    const r = p.r*(1 + 0.5*(1-k));
    buckets[b].moveTo(x+r, y);
    buckets[b].arc(x, y, r, 0, Math.PI*2);
  }
  ctx.fillStyle = css("--pin");
  for(let i=0;i<NB;i++){ ctx.globalAlpha = (i+0.5)/NB; ctx.fill(buckets[i]); }
  ctx.globalAlpha = 1;

  /* One ring per country as its marker lights, drawn on the marker itself. */
  if(DOTS.phase === 2){
    const order = Object.keys(GEO).sort((a,b)=> GEO[b][0] - GEO[a][0]);
    ctx.strokeStyle = css("--pin-glow"); ctx.lineWidth = 1;
    order.forEach((n,i)=>{
      const a = (el - (DT.light + i*DT.step)) / DT.ring;
      if(a <= 0 || a >= 1) return;
      const [x,y] = dotXY(DOTS.ctm, GEO[n][1], GEO[n][0]);
      ctx.globalAlpha = (1-a)*0.55;
      ctx.beginPath(); ctx.arc(x, y, 3 + 20*a, 0, Math.PI*2); ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  /* Once everything has settled the loop sleeps, and the pointer wakes it. */
  DOTS.idle = moving || DOTS.phase < 3 ? 0 : DOTS.idle + 1;
  if(DOTS.idle > 30){ DOTS.live = false; return; }
  DOTS.raf = requestAnimationFrame(dotsFrame);
}
const ease3 = t => t<0 ? 0 : t>1 ? 1 : 1-Math.pow(1-t,3);
function dotsWake(){
  if(DOTS.live || !DOTS.cv || !DOTS.ctx || !DOTS.cv.isConnected) return;
  DOTS.live = true; DOTS.idle = 0;
  DOTS.raf = requestAnimationFrame(dotsFrame);
}
addEventListener("pointermove", e=>{ DOTS.mx = e.clientX; DOTS.my = e.clientY; dotsWake(); }, {passive:true});
addEventListener("pointerleave", ()=>{ DOTS.mx = DOTS.my = -1e5; }, {passive:true});
addEventListener("resize", ()=>{ if(DOTS.cv && DOTS.cv.isConnected){ dotsLayout(); dotsWake(); } });
addEventListener("keydown", e=>{ if(e.key==="Escape"||e.key===" "||e.key==="Enter") dotsSkip(); });
addEventListener("click", ()=>{ if(DOTS.phase < 3) dotsSkip(); }, true);

/* The marker the reader clicked travels to the centre, the name resolves out
   of it, and the pivot hands over to the page that was built underneath while
   it played. Rendering happens at the turn, so the wait is hidden inside the
   motion rather than added to it. */
function countryHandoff(name, pin, done){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ done(); return; }
  const r = pin && pin.getBoundingClientRect ? pin.getBoundingClientRect() : null;
  const el = document.createElement("div");
  el.className = "cxo";
  const fx = r ? (r.left + r.width/2 - innerWidth/2) : 0;
  const fy = r ? (r.top + r.height/2 - innerHeight/2) : 0;
  el.innerHTML = `<i style="--fx:${fx.toFixed(0)}px;--fy:${fy.toFixed(0)}px"></i><b>${esc(name)}</b>`;
  document.body.appendChild(el);
  setTimeout(done, 300);                 // the page is built behind the name
  setTimeout(()=>el.remove(), 980);
}

/* One observer for the life of the page. Cards are marked for entry as they
   are built and released the first time they are seen, so a tab switch plays
   the cards that are already on screen and scrolling plays the rest. */
let CARD_IO = null, CPICK_WIRED = false;
function animateCards(root){
  if(!root || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cards = root.querySelectorAll(".card, .tiles");
  if(!cards.length) return;
  if(!CARD_IO && "IntersectionObserver" in window){
    CARD_IO = new IntersectionObserver(es=>{
      for(const e of es) if(e.isIntersecting){ e.target.classList.add("in"); CARD_IO.unobserve(e.target); }
    }, {rootMargin:"0px 0px -8% 0px", threshold:0.02});
  }
  cards.forEach((el,i)=>{
    el.classList.add("rise");
    el.style.setProperty("--ci", Math.min(i, 6));
    el.querySelectorAll(".dring").forEach((d,j)=>d.style.setProperty("--di", Math.min(j,3)));
    el.querySelectorAll(":scope > .tile").forEach((t,j)=>t.style.setProperty("--ti", Math.min(j,7)));
    if(CARD_IO) CARD_IO.observe(el);
    else el.classList.add("in");
  });
  /* Without this the first paint can carry the end state and nothing moves. */
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(!CARD_IO) return;
    for(const el of cards){
      const r = el.getBoundingClientRect();
      if(r.top < innerHeight && r.bottom > 0) el.classList.add("in");
    }
  }));
}


/* ============================ comments ==============================
   Reviewers write against a chart, or against the country as a whole. The
   store is keyed country -> section, and every save goes three places: memory,
   this browser's localStorage, and a markdown file under the results root, so
   a comment survives a reload, a different machine, and whoever reads next.
   The markdown is the record; localStorage is only a cache for the case where
   the folder cannot be written. */
const CMT_RE = /^([A-Za-z]{3})_comments\.md$/i;
let CMT_DIR = "_comments";        // config/dashboard.md, comments_folder
let CMT = {};
try{ CMT = JSON.parse(localStorage.getItem("osd-comments") || "{}") || {}; }catch(e){ CMT = {}; }
const cmtSave = () => { try{ localStorage.setItem("osd-comments", JSON.stringify(CMT)); }catch(e){} };
const cmtFor = (country, sec) => ((CMT[country] || {})[sec] || []);
const CMT_COUNTRY = "Country review";

function cmtStamp(d){
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function cmtAdd(country, sec, text){
  const t = String(text||"").trim();
  if(!t) return false;
  ((CMT[country] ||= {})[sec] ||= []).push({when: cmtStamp(new Date()), text: t});
  cmtSave(); return true;
}
function cmtDel(country, sec, i){
  const a = (CMT[country]||{})[sec]; if(!a) return;
  a.splice(i,1); if(!a.length) delete CMT[country][sec];
  cmtSave();
}

/* ---- the markdown file -------------------------------------------------- */
function cmtToMd(country){
  const iso = (NAME2ISO[String(country||"").toLowerCase()]||"").toUpperCase();
  const secs = CMT[country] || {};
  const order = Object.keys(secs).sort((a,b)=> a===CMT_COUNTRY ? -1 : b===CMT_COUNTRY ? 1 : a.localeCompare(b));
  let out = `# ${country} (${iso}) — dashboard comments\n\n`;
  out += `<!-- Written by ${TITLE}. One "## " heading per chart;\n`;
  out += `     one "- YYYY-MM-DD HH:MM — text" per comment. Continuation lines\n`;
  out += `     are indented by two spaces. Edit by hand if you prefer; the dash\n`;
  out += `     reads this file back on Refresh. -->\n\n`;
  for(const sec of order){
    out += `## ${sec}\n\n`;
    for(const c of secs[sec]){
      const body = String(c.text).split(/\r?\n/).map((l,i)=> i ? "  "+l : l).join("\n");
      out += `- ${c.when} — ${body}\n`;
    }
    out += `\n`;
  }
  return out;
}
function cmtFromMd(text){
  const out = {}; let sec = null, cur = null;
  for(const raw of String(text).split(/\r?\n/)){
    const h = /^##\s+(.*?)\s*$/.exec(raw);
    if(h){ sec = h[1]; out[sec] ||= []; cur = null; continue; }
    if(!sec) continue;
    const b = /^-\s+(\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2})?)\s+(?:—|-{1,2})\s*(.*)$/.exec(raw);
    if(b){ cur = {when:b[1], text:b[2]}; out[sec].push(cur); continue; }
    if(cur && /^\s{2,}\S/.test(raw)){ cur.text += "\n" + raw.replace(/^\s{2}/,""); continue; }
    if(!raw.trim()) cur = null;
  }
  for(const k of Object.keys(out)) if(!out[k].length) delete out[k];
  return out;
}

/* Writing needs read-write on the folder the reader already linked. The ask
   happens on the first save, not on load, so simply opening the dash never
   prompts for write access. */
async function cmtWrite(country){
  if(!ROOT || !ROOT.getDirectoryHandle) return {ok:false, why:"no folder linked"};
  try{
    let perm = await ROOT.queryPermission({mode:"readwrite"});
    if(perm !== "granted") perm = await ROOT.requestPermission({mode:"readwrite"});
    if(perm !== "granted") return {ok:false, why:"write access declined"};
    const dir = await ROOT.getDirectoryHandle(CMT_DIR, {create:true});
    const iso = (NAME2ISO[String(country||"").toLowerCase()]||"XXX").toUpperCase();
    const fh = await dir.getFileHandle(iso + "_comments.md", {create:true});
    const w = await fh.createWritable();
    await w.write(cmtToMd(country));
    await w.close();
    return {ok:true, where:`${CMT_DIR}/${iso}_comments.md`};
  }catch(err){ return {ok:false, why:(err && err.message) || "could not write"}; }
}
/* No folder, or the browser has no File System Access: hand over the file. */
function cmtDownload(country){
  const iso = (NAME2ISO[String(country||"").toLowerCase()]||"XXX").toUpperCase();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([cmtToMd(country)], {type:"text/markdown"}));
  a.download = iso + "_comments.md";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

const CMT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M20.5 11.3a7.7 7.7 0 0 1-8.3 7.7 8.8 8.8 0 0 1-2.5-.4L4.5 20.4l1.5-4.4a7.6 7.6 0 0 1-1.5-4.6 7.7 7.7 0 0 1 8-7.7 7.7 7.7 0 0 1 8 7.6z"/></svg>';

/* One panel per section, built on demand under its heading. */
function cmtPanel(country, sec, host, btn){
  let box = host.nextElementSibling;
  if(box && box.classList && box.classList.contains("cmt")) return box;
  box = document.createElement("div");
  box.className = "cmt"; box.hidden = true;
  host.insertAdjacentElement("afterend", box);
  const paint = () => {
    const list = cmtFor(country, sec);
    box.innerHTML =
      (list.length ? `<ul>` + list.map((c,i)=>
        `<li><span class="del" data-i="${i}" title="Delete">&times;</span>`
        + `<span class="when">${esc(c.when)}</span>${esc(c.text)}</li>`).join("") + `</ul>` : "")
      + `<textarea placeholder="${sec===CMT_COUNTRY
          ? 'A note on this country as a whole…' : 'A note on this chart…'}"></textarea>`
      + `<div class="row"><button class="sv">Save comment</button>`
      + `<button class="cx">Close</button><span class="st"></span></div>`;
    const ta = box.querySelector("textarea");
    const st = box.querySelector(".st");
    box.querySelectorAll(".del").forEach(d=>d.onclick=async ()=>{
      cmtDel(country, sec, +d.dataset.i); paint(); cmtMark(btn, country, sec);
      const r = await cmtWrite(country);
      st.className = "st " + (r.ok ? "ok" : "err");
      st.textContent = r.ok ? "saved to " + r.where : "removed here — " + r.why;
    });
    box.querySelector(".cx").onclick = ()=>{ box.hidden = true; btn.setAttribute("aria-expanded","false"); };
    box.querySelector(".sv").onclick = async ()=>{
      if(!cmtAdd(country, sec, ta.value)){ st.className="st err"; st.textContent="nothing to save"; return; }
      paint(); cmtMark(btn, country, sec);
      const s2 = box.querySelector(".st");
      s2.className = "st"; s2.textContent = "saving…";
      const r = await cmtWrite(country);
      if(r.ok){ s2.className = "st ok"; s2.textContent = "saved to " + r.where; }
      else {
        s2.className = "st err";
        s2.innerHTML = esc("kept in this browser — " + r.why) +
          ` · <a href="#" class="dl" style="color:var(--accent)">download the file</a>`;
        const dl = s2.querySelector(".dl");
        if(dl) dl.onclick = e=>{ e.preventDefault(); cmtDownload(country); };
      }
    };
    ta.focus();
  };
  box._paint = paint;
  return box;
}
function cmtMark(btn, country, sec){
  const n = cmtFor(country, sec).length;
  btn.classList.toggle("has", n>0);
  const b = btn.querySelector(".n");
  if(n>0){ if(b) b.textContent = n;
           else btn.insertAdjacentHTML("beforeend", `<span class="n">${n}</span>`); }
  else if(b) b.remove();
}
/* Hang a button off a heading. */
function cmtAttach(h, country, sec){
  /* .cmtb, not .cbtn: the export button shares the .cbtn styling, and guarding
     on the shared class suppressed this one wherever both are attached. */
  if(h.querySelector(".cbtn.cmtb")) return;
  h.insertAdjacentHTML("beforeend",
    `<button class="cbtn cmtb" aria-expanded="false" aria-label="Comment">`
    + CMT_ICON + `<span class="gl">Comment</span></button>`);
  const btn = h.querySelector(".cbtn.cmtb");
  cmtMark(btn, country, sec);
  btn.onclick = ()=>{
    const box = cmtPanel(country, sec, h, btn);
    const open = box.hidden;
    box.hidden = !open;
    btn.setAttribute("aria-expanded", open);
    if(open) box._paint();
  };
}


/* ---- chart export -------------------------------------------------------
   The charts are inline SVG, so an export is a faithful copy of the mark
   geometry rather than a screenshot: the clone is given explicit presentation
   attributes (the live tree paints from CSS custom properties, which do not
   survive serialisation), then rasterised at EXPORT_SCALE times the layout
   size. Whatever the chart shows at the moment the button is pressed — the
   scenario, the unit, Area or Bars, and the legend selection — is what lands
   in the file. */
const EXPORT_SCALE = 3;                 /* ~288 dpi across a 90 mm column */
const EXPORT_FONT  = "'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif";
const EXPORT_MONO  = "'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace";
const PNG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M12 3.6v10.2"/><path d="M8.2 10.2 12 14l3.8-3.8"/>'
  + '<path d="M4.4 15.6v2.6a2.2 2.2 0 0 0 2.2 2.2h10.8a2.2 2.2 0 0 0 2.2-2.2v-2.6"/></svg>';

/* Presentation properties that decide how a mark reads. Anything left at its
   initial value is skipped so the serialised file stays small. */
const XPROPS = ["fill","fill-opacity","fill-rule","stroke","stroke-width","stroke-opacity",
  "stroke-dasharray","stroke-dashoffset","stroke-linecap","stroke-linejoin","stroke-miterlimit",
  "opacity","font-family","font-size","font-weight","font-style","letter-spacing",
  "text-anchor","dominant-baseline","paint-order","mix-blend-mode","transform","transform-origin"];
const XDEFAULT = {"fill-opacity":"1","stroke-opacity":"1","opacity":"1","stroke-dashoffset":"0px",
  "stroke-linejoin":"miter","stroke-miterlimit":"4","fill-rule":"nonzero","font-style":"normal",
  "letter-spacing":"normal","mix-blend-mode":"normal","transform":"none","paint-order":"normal",
  "dominant-baseline":"auto","stroke-dasharray":"none"};

function xFreeze(live, copy){
  const cs = getComputedStyle(live);
  let css = "";
  for(const k of XPROPS){
    const v = cs.getPropertyValue(k).trim();
    if(!v || v === XDEFAULT[k]) continue;
    if(k === "stroke-width" && v === "1px" && cs.stroke === "none") continue;
    css += k + ":" + (k.startsWith("font-family") ? EXPORT_FONT : v) + ";";
  }
  /* An entrance animation can leave a mark mid-flight. The export wants the
     settled state, not the frame the click happened to land on. */
  css = css.replace(/transform:[^;]+;/, m => /matrix|scale|translate|rotate/.test(m) &&
        live.closest("[data-anim-done]") === null ? "" : m);
  if(css) copy.setAttribute("style", css);
  copy.removeAttribute("class");
  const lk = [...live.children], ck = [...copy.children];
  for(let i = 0; i < lk.length && i < ck.length; i++) xFreeze(lk[i], ck[i]);
}

function xEsc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* The legend as it stands: an isolated or hidden series is left out, so the
   exported figure's key matches the marks actually drawn. */
function xLegend(card){
  return [...card.querySelectorAll(".legend .lgb")]
    .filter(b => !b.classList.contains("off"))
    .map(b => ({ label: b.textContent.trim(),
                 color: getComputedStyle(b.querySelector("i")).backgroundColor }));
}

function xName(country, scen, plot){
  const c = v => String(v || "").replace(/[–—]/g, "-")
                   .replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  return [EXPORT_PREFIX, c(country), c(scen), c(plot)].filter(Boolean).join("_") + ".png";
}

/* Build a standalone SVG: title strip, legend, then the chart itself. */
/* The heading carries its own 24x24 icon SVGs. The chart is the first SVG that
   is not inside a heading or a button. */
function xChart(card){
  return [...card.querySelectorAll("svg")]
    .find(g => !g.closest("h3") && !g.closest("button")) || null;
}

function xCompose(card, title, sub, note){
  const live = xChart(card);
  if(!live) return null;
  const vb = (live.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
  if(vb.length !== 4 || !(vb[2] > 0)) return null;
  const box  = live.getBoundingClientRect();
  const W    = Math.max(box.width  || 0, 520);
  const chH  = Math.max(box.height || 0, 300);
  const cs   = getComputedStyle(card);
  const bg   = cs.backgroundColor === "rgba(0, 0, 0, 0)" ? css("--bg") : cs.backgroundColor;
  const ink  = css("--ink"), ink2 = css("--ink-2"), ink3 = css("--ink-3"), line = css("--line");

  const keys = xLegend(card);
  const PAD = 22, TITLE_H = sub ? 50 : 34;
  const perRow = Math.max(1, Math.floor((W - 2*PAD) / 168));
  const rows   = keys.length ? Math.ceil(keys.length / perRow) : 0;
  const LEG_H  = rows ? rows * 19 + 8 : 0;
  const NOTE_H = note ? 34 : 0;
  const H = PAD + TITLE_H + LEG_H + chH + NOTE_H + PAD;

  const copy = live.cloneNode(true);
  copy.removeAttribute("style"); copy.removeAttribute("id");
  xFreeze(live, copy);
  copy.setAttribute("width", W); copy.setAttribute("height", chH);
  copy.setAttribute("x", PAD * 0); copy.setAttribute("y", 0);

  let y = PAD + 18;
  let out = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" `
    + `viewBox="0 0 ${W} ${H}" font-family="${EXPORT_FONT}">`
    + `<rect width="${W}" height="${H}" fill="${bg}"/>`
    + `<text x="${PAD}" y="${y}" font-size="15" font-weight="650" fill="${ink}">${xEsc(title)}</text>`;
  if(sub){ y += 17; out += `<text x="${PAD}" y="${y}" font-size="11.5" font-family="${EXPORT_MONO}" `
    + `letter-spacing="0.04em" fill="${ink3}">${xEsc(sub)}</text>`; }

  let ly = PAD + TITLE_H;
  keys.forEach((k, i) => {
    const r = Math.floor(i / perRow), c = i % perRow;
    const lx = PAD + c * 168, ty = ly + r * 19;
    out += `<rect x="${lx}" y="${ty - 7}" width="9" height="9" rx="2.5" fill="${k.color}"/>`
         + `<text x="${lx + 14}" y="${ty + 1}" font-size="11.5" fill="${ink2}">${xEsc(k.label)}</text>`;
  });

  out += `<g transform="translate(0,${PAD + TITLE_H + LEG_H})">`
       + new XMLSerializer().serializeToString(copy) + `</g>`;
  if(note){
    out += `<line x1="${PAD}" x2="${W - PAD}" y1="${H - PAD - 20}" y2="${H - PAD - 20}" `
         + `stroke="${line}" stroke-width="1"/>`
         + `<text x="${PAD}" y="${H - PAD - 6}" font-size="10" fill="${ink3}">${xEsc(note)}</text>`;
  }
  return { svg: out + `</svg>`, w: W, h: H };
}

async function xExport(card, title){
  const sc   = S.scen[S.sel];
  const scen = (sc && sc.name) || S.sel || "";
  const sub  = [S.selC, scen].filter(Boolean).join("  ·  ");
  const note = TITLE + " · " + (S.selC || "") + " · " + scen
             + " · exported " + cmtStamp(new Date());
  const built = xCompose(card, title, sub, note);
  if(!built) throw new Error("this card has no chart to export");

  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(built.svg);
  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res;
    img.onerror = () => rej(new Error("the chart could not be rasterised"));
    img.src = url;
  });
  const cv = document.createElement("canvas");
  cv.width  = Math.round(built.w * EXPORT_SCALE);
  cv.height = Math.round(built.h * EXPORT_SCALE);
  const ctx = cv.getContext("2d");
  ctx.setTransform(EXPORT_SCALE, 0, 0, EXPORT_SCALE, 0, 0);
  ctx.drawImage(img, 0, 0, built.w, built.h);
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  if(!blob) throw new Error("the browser returned no image data");

  const name = xName(S.selC, scen, title);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return name;
}

function xAttach(h, title){
  if(h.querySelector(".xbtn")) return;
  const card = h.closest(".card");
  if(!card || !xChart(card)) return;                 /* tables have nothing to raster */
  h.insertAdjacentHTML("beforeend",
    `<button class="cbtn xbtn" aria-label="Export PNG">` + PNG_ICON
    + `<span class="gl">Export PNG</span></button>`);
  const btn = h.querySelector(".xbtn"), lab = btn.querySelector(".gl");
  btn.onclick = async () => {
    btn.className = "cbtn xbtn"; lab.textContent = "Rendering…";
    try{
      const name = await xExport(card, title);
      btn.classList.add("ok"); lab.textContent = "Saved " + name;
    }catch(err){
      btn.classList.add("bad"); lab.textContent = "Export failed — " + err.message;
    }
    setTimeout(() => { btn.className = "cbtn xbtn"; lab.textContent = "Export PNG"; }, 4200);
  };
}

function wireTT(){
  document.querySelectorAll("[data-tt]").forEach(el=>{
    el.addEventListener("mousemove",e=>showTT(el.getAttribute("data-tt"),e.clientX,e.clientY));
    el.addEventListener("mouseleave",hideTT);
  });
}

/* units + theme */

document.getElementById("shareSeg").addEventListener("click",e=>{

  S.pwr=b.dataset.p; S.pwrLock=true;   // an explicit choice outranks the per-country default
  render();
});
document.getElementById("formSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  S.form=b.dataset.f;
  document.querySelectorAll("#formSeg button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  render();
});

/* ---- theme and presentation, icon only ---- */
const ICON = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z"/></svg>',
  expand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  shrink:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
};
const themeBtn = document.getElementById("themeBtn"), fsBtn = document.getElementById("fsBtn");
const isDark = () => (document.documentElement.getAttribute("data-theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
function paintChrome(){
  // the icon shows the state you would switch TO, which is the convention people expect
  themeBtn.innerHTML = isDark() ? ICON.sun : ICON.moon;
  themeBtn.title = isDark() ? "Switch to light" : "Switch to dark";
  const full = !!document.fullscreenElement;
  fsBtn.innerHTML = full ? ICON.shrink : ICON.expand;
  fsBtn.title = full ? "Leave presentation mode" : "Presentation mode";
}
themeBtn.onclick = ()=>{
  document.documentElement.setAttribute("data-theme", isDark() ? "light" : "dark");
  try{ localStorage.setItem("osd-theme", document.documentElement.getAttribute("data-theme")); }catch(e){}
  render();
};
fsBtn.onclick = async ()=>{
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(e){ fsBtn.title = "This browser blocked full screen"; }
};
document.addEventListener("fullscreenchange", paintChrome);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintChrome);

try{ const t=localStorage.getItem("osd-theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}

const sampleRead = loadSample();
render();
/* After the sample: a folder that is still linked replaces it, never the reverse. */
sampleRead.finally(restoreLink);
