<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OSeMOSYS Result Dash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f6f4; --surface:#fcfcfb; --surface-2:#f0f0ed; --line:#dedcd6; --line-soft:#e9e7e1;
  --ink:#1c1c1a; --ink-2:#55544e; --ink-3:#83817a;
  --accent:#1f68bc; --accent-soft:#e6eef8;
  --good:#138840; --warn:#a8720c; --crit:#aa323d;
  /* Interface colours. Family and fuel colours are not set here: they come
     from config/technologies.md and are written as --fam-N / --fuel-N. */
  --c1:#3A3A3A; --c2:#7030A0; --c3:#D1D1D1; --c4:#C00000; --c5:#00B0F0;
  --c6:#F2CFEE; --c6b:#D86ECC; --c7:#FFC000; --c8:#92D050; --c9:#F2AA84;
  --c0:#83817a; --cs:#E97132; --c5b:#6FC9EE;   /* pumped hydro: hydro, lightened */
  --cwa:#3B7D23; --cge:#996600;   /* waste, geothermal */
  --cbk:#e11d48;                  /* backstop: unserved demand, alarm red */
  /* The map marker is the one saturated colour on the page: a country with
     results should read as live. */
  --pin:#0a6bff; --pin-glow:#2f8bff;
  /* One highlight per heading button, so the three are told apart by colour
     rather than by position. Information keeps the page accent. */
  --hl-x:#0f9f72; --hl-c:#8b45d6;
  --grid:#e4e2dc; --shadow:0 1px 2px rgba(28,28,26,.06),0 4px 14px rgba(28,28,26,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060607; --surface:#0d0d0f; --surface-2:#141417; --line:#26262b; --line-soft:#1c1c20;
  --ink:#ecebe8; --ink-2:#a5a39c; --ink-3:#6f6d68;
  --accent:#5a9ee0; --accent-soft:#102133;
  --good:#3ea865; --warn:#d0a03a; --crit:#d76a72;
  /* The same scheme, with the lightness of the darkest and the most washed-out
     entries lifted so they survive a near-black background. Hue and identity
     are unchanged: coal is still the dark grey of the pair, gas the light one. */
  --c1:#8C8C8C; --c2:#9B55C7; --c3:#D1D1D1; --c4:#E03A3A; --c5:#00B0F0;
  --c6:#F2CFEE; --c6b:#D86ECC; --c7:#FFC000; --c8:#92D050; --c9:#F2AA84;
  --c0:#7d7a72; --cs:#E97132; --c5b:#6FC9EE;   /* pumped hydro: hydro, lightened */
  --cwa:#5BA83A; --cge:#C98A10;   /* waste, geothermal */
  --cbk:#fb4d70;                  /* backstop: unserved demand, alarm red */
  --pin:#35b7ff; --pin-glow:#6fd3ff;
  --hl-x:#2fd79b; --hl-c:#b47cf0;
  --grid:#232327; --shadow:0 1px 2px rgba(0,0,0,.6),0 4px 16px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#060607; --surface:#0d0d0f; --surface-2:#141417; --line:#26262b; --line-soft:#1c1c20;
  --ink:#ecebe8; --ink-2:#a5a39c; --ink-3:#6f6d68;
  --accent:#5a9ee0; --accent-soft:#102133;
  --good:#3ea865; --warn:#d0a03a; --crit:#d76a72;
  /* The same scheme, with the lightness of the darkest and the most washed-out
     entries lifted so they survive a near-black background. Hue and identity
     are unchanged: coal is still the dark grey of the pair, gas the light one. */
  --c1:#8C8C8C; --c2:#9B55C7; --c3:#D1D1D1; --c4:#E03A3A; --c5:#00B0F0;
  --c6:#F2CFEE; --c6b:#D86ECC; --c7:#FFC000; --c8:#92D050; --c9:#F2AA84;
  --c0:#7d7a72; --cs:#E97132; --c5b:#6FC9EE;   /* pumped hydro: hydro, lightened */
  --cwa:#5BA83A; --cge:#C98A10;   /* waste, geothermal */
  --cbk:#fb4d70;                  /* backstop: unserved demand, alarm red */
  --pin:#35b7ff; --pin-glow:#6fd3ff;
  --hl-x:#2fd79b; --hl-c:#b47cf0;
  --grid:#232327; --shadow:0 1px 2px rgba(0,0,0,.6),0 4px 16px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---- comments -------------------------------------------------------------
   A reviewer's margin. Every chart carries one, the Overview carries one for
   the country as a whole, and what is written lands in a markdown file beside
   the results so the next reader sees it too. */
.cbtn{--hl:var(--pin);margin-left:5px;position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:6px;vertical-align:middle;color:var(--ink-3);
  border:1px solid var(--line);background:var(--surface);cursor:pointer;
  transition:color .16s,border-color .16s,box-shadow .18s}
.cbtn svg{width:11px;height:11px;display:block}
.cbtn.cmtb{--hl:var(--hl-c)}
.cbtn.xbtn{--hl:var(--hl-x)}
.cbtn:hover,.cbtn[aria-expanded="true"]{color:var(--hl);
  border-color:color-mix(in srgb,var(--hl) 50%,var(--line));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--hl) 12%,transparent)}
.cbtn:hover svg{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--hl) 70%,transparent))}
.cbtn:hover .gl{color:var(--hl);border-color:color-mix(in srgb,var(--hl) 40%,var(--line))}
.cbtn .gl{position:absolute;top:calc(100% + 6px);left:-2px;white-space:nowrap;
  font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:7px;
  pointer-events:none;z-index:20;background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink-2);box-shadow:var(--shadow);opacity:0;visibility:hidden;
  transform:translateY(-3px);transition:opacity .14s,transform .18s,visibility .14s}
.cbtn:hover .gl,.cbtn:focus-visible .gl{opacity:1;visibility:visible;transform:none}
.cbtn.has{color:var(--hl);border-color:color-mix(in srgb,var(--hl) 45%,var(--line));
  background:color-mix(in srgb,var(--hl) 9%,var(--surface))}
.cbtn .n{position:absolute;top:-5px;right:-5px;min-width:13px;height:13px;border-radius:7px;
  background:var(--hl);color:#fff;font:700 9px/13px 'IBM Plex Sans',sans-serif;text-align:center;
  padding:0 3px}
.xbtn.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.xbtn.bad{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.cmt{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.cmt[hidden]{display:none}
.cmt ul{list-style:none;margin:0 0 9px;padding:0;display:flex;flex-direction:column;gap:7px}
.cmt li{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;
  padding:7px 10px;font-size:12.5px;color:var(--ink-2);white-space:pre-wrap}
.cmt li .when{display:block;font:500 10.5px 'IBM Plex Mono',ui-monospace,monospace;
  color:var(--ink-3);letter-spacing:.03em;margin-bottom:3px}
.cmt li .del{float:right;font-size:11px;color:var(--ink-3);cursor:pointer;padding:0 2px}
.cmt li .del:hover{color:var(--crit)}
.cmt textarea{width:100%;min-height:62px;resize:vertical;font:inherit;font-size:12.5px;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;outline:none}
.cmt textarea:focus{border-color:var(--accent)}
.cmt .row{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
.cmt .row .note{margin:0}
.cmt .sv{font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;
  background:var(--accent);color:#fff;border:1px solid var(--accent)}
.cmt .sv:hover{filter:brightness(1.08)}
.cmt .cx{font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);
  background:transparent;border:1px solid var(--line)}
.cmt .cx:hover{border-color:var(--accent);color:var(--ink)}
.cmt .st{font-size:11.5px;color:var(--ink-3)}
.cmt .st.ok{color:var(--good)} .cmt .st.err{color:var(--crit)}

/* ---- scrollbars ----------------------------------------------------------
   A hairline that stays out of the way until it is touched. The thumb is drawn
   inside a wider transparent gutter, so the bar is 5px of ink in a 11px target
   and remains easy to grab. In dark mode the thumb takes the accent and a glow
   on hover, the same lit-not-filled idiom the rest of the chrome uses. */
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
*::-webkit-scrollbar{width:11px;height:11px;background:transparent}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-corner{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;
  border:3px solid transparent;background-clip:padding-box;
  transition:background-color .18s ease}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:padding-box}
*::-webkit-scrollbar-thumb:active{background:var(--accent);background-clip:padding-box}
:root[data-theme="dark"] *{scrollbar-color:#2e2e34 transparent}
:root[data-theme="dark"] *::-webkit-scrollbar-thumb{background:#2e2e34;background-clip:padding-box}
:root[data-theme="dark"] *::-webkit-scrollbar-thumb:hover{
  background:var(--pin);background-clip:padding-box;
  box-shadow:0 0 6px color-mix(in srgb,var(--pin) 75%,transparent),
             0 0 13px color-mix(in srgb,var(--pin) 45%,transparent)}
:root[data-theme="dark"] *::-webkit-scrollbar-thumb:active{
  background:var(--pin-glow);background-clip:padding-box;
  box-shadow:0 0 7px var(--pin),0 0 16px color-mix(in srgb,var(--pin) 55%,transparent)}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) *{scrollbar-color:#2e2e34 transparent}
  :root:not([data-theme="light"]) *::-webkit-scrollbar-thumb{background:#2e2e34;background-clip:padding-box}
  :root:not([data-theme="light"]) *::-webkit-scrollbar-thumb:hover{
    background:var(--pin);background-clip:padding-box;
    box-shadow:0 0 6px color-mix(in srgb,var(--pin) 75%,transparent),
               0 0 13px color-mix(in srgb,var(--pin) 45%,transparent)}}

.shell{display:grid;grid-template-columns:288px minmax(0,1fr);gap:0;min-height:100%}
@media(max-width:940px){.shell{grid-template-columns:1fr}}

/* ---- rail ---- */
/* The rail is reference material for whatever plot is on screen, so it holds
   position while the main column scrolls. It scrolls internally only when its
   own content is taller than the viewport. */
/* The rail is supporting material, so it sits on the page background with a
   hairline rather than presenting itself as a panel. */
.rail{background:var(--bg);border-right:1px solid var(--line-soft);
  padding:16px 15px 20px;display:flex;flex-direction:column;gap:14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain}
.rail::-webkit-scrollbar{width:9px}
@media(max-width:940px){.rail{border-right:0;border-bottom:1px solid var(--line);padding-bottom:20px;
  position:static;height:auto;overflow:visible}}

/* Decorative country silhouette, foot of the rail. Natural Earth 1:50m
   outlines, reprojected per country and simplified; a locator, not a survey. */
.rail-art{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;user-select:none}
.rail-art svg{width:auto;max-width:132px;max-height:118px;overflow:visible;
  filter:drop-shadow(0 1px 4px color-mix(in srgb,var(--accent) 22%,transparent))}
.rail-art path{fill:color-mix(in srgb,var(--accent) 14%,transparent);
  stroke:color-mix(in srgb,var(--accent) 55%,transparent);stroke-width:1.1;stroke-linejoin:round}
.rail-art .cn{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
@media(max-width:940px){.rail-art{display:none}}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand h1{font-size:16px}
.brand .tag{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  border:1px solid var(--line);border-radius:3px;padding:1px 5px}
.rail-sec{display:flex;flex-direction:column;gap:7px}
.rail-sec>.lbl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600;opacity:.8}
/* The folder instructions are reference, not status: two lines until hovered. */
#linkNote{max-height:2.9em;overflow:hidden;transition:max-height .25s ease}
.rail-sec:hover #linkNote{max-height:24em}
.rail .dossier{background:transparent;border-color:var(--line-soft)}
.rail .brand h1{font-size:15px}


.sclist{display:flex;flex-direction:column;gap:3px}
.sc{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;text-align:left;width:100%;
  border:1px solid transparent}
.sc:hover{background:var(--surface-2)}
.sc[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.sc .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--c0)}
.sc.ref .dot{background:var(--c4)} .sc.nze .dot{background:var(--c8)}
.sc .nm{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .sub{font-size:10.5px;color:var(--ink-3)}

/* dossier */
.dossier{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px;
  display:flex;flex-direction:column;gap:9px}
.dossier .dt{font-size:13.5px;font-weight:600}
.dossier .dd{font-size:12px;color:var(--ink-2);line-height:1.45}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.pill.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pill.wn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
/* "Undiscounted" is flagged wherever it appears, because every cost figure on
   the Costs tab except the objective is a face-value sum, and that is the
   first thing a reader comparing runs needs to know. */
.undisc{display:inline-block;padding:0 6px;margin:0 1px;border-radius:5px;font-weight:700;
  font-size:.92em;letter-spacing:.04em;text-transform:uppercase;line-height:1.5;
  color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
h3 .undisc{font-size:10px;margin-left:8px;vertical-align:2px}
.tile .undisc{font-size:10px}
.pill.cr{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}

/* ---- main ---- */
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
@media(max-width:600px){.bar{padding:9px 16px}}
.barrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%}
/* The scenario switch and the view tabs share one idiom: a flat label whose
   current item carries a glowing underline, so each bar reads as a rule rather
   than a row of boxes. The glow takes the scenario family colour. */
/* ---- country switch ------------------------------------------------------
   The button wears the country's own outline, so the control looks like the
   thing it selects, and the panel shows every country at once: a grid is
   one glance and one click, where a long list is a read. */
.cpick{position:relative}
.cpick-b{display:inline-flex;align-items:center;gap:9px;padding:5px 11px 5px 7px;border-radius:11px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;
  transition:border-color .16s,transform .16s,box-shadow .16s}
.cpick-b:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));transform:translateY(-1px);
  box-shadow:0 5px 15px -9px rgba(0,0,0,.55)}
.cpick-b[aria-expanded="true"]{border-color:var(--accent)}
.cpick-b .art{width:24px;height:20px;color:var(--pin);display:block;flex:none}
.cpick-b .art path{fill:currentColor;opacity:.92}
.cpick-b .nm{font-size:13px;font-weight:600;letter-spacing:-.005em;color:var(--ink);white-space:nowrap}
.cpick-b .cv{opacity:.5;transition:transform .22s cubic-bezier(.3,0,.2,1)}
.cpick-b[aria-expanded="true"] .cv{transform:rotate(180deg)}
.cpick-p{position:absolute;left:0;top:calc(100% + 7px);z-index:30;width:min(556px,86vw);
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;
  box-shadow:0 24px 52px -24px rgba(0,0,0,.66);display:grid;gap:4px;
  grid-template-columns:repeat(auto-fill,minmax(124px,1fr));
  opacity:0;transform:translateY(-6px) scale(.985);pointer-events:none;
  transition:opacity .17s ease,transform .22s cubic-bezier(.3,0,.2,1)}
.cpick-p.open{opacity:1;transform:none;pointer-events:auto}
.cpick-i{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;cursor:pointer;
  text-align:left;color:var(--ink-2);background:transparent;
  transition:background .14s,color .14s}
.cpick-i:hover,.cpick-i:focus-visible{background:var(--surface-2);color:var(--ink);outline:none}
.cpick-i.on{background:color-mix(in srgb,var(--pin) 13%,transparent);color:var(--ink);font-weight:600}
.cpick-i .art{width:19px;height:17px;flex:none;color:var(--ink-3);transition:color .14s}
.cpick-i .art path{fill:currentColor}
.cpick-i.on .art,.cpick-i:hover .art{color:var(--pin)}
.cpick-i .lab{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpick-i .led{width:5px;height:5px;border-radius:50%;background:var(--pin);margin-left:auto;flex:none;
  box-shadow:0 0 6px var(--pin-glow)}
.cpick-i.off .led{background:var(--line);box-shadow:none}
@media(max-width:620px){.cpick-p{width:min(320px,88vw)}}
.sclist-h{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* One card per case, the discount rates inside it. The card carries the case
   colour; the rate that is open carries the glow. */
.sccard{display:inline-flex;align-items:center;gap:2px;padding:2px 4px 2px 2px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  transition:border-color .16s,background .16s}
.sccard.here{border-color:color-mix(in srgb,var(--glow) 38%,var(--line));
  background:color-mix(in srgb,var(--glow) 5%,var(--surface-2))}
.sccard.ref{--glow:var(--c4)} .sccard.nze{--glow:var(--c8)}
.cs-n{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 7px;border-radius:8px;
  font:600 12.5px/1 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink-2);white-space:nowrap;
  cursor:pointer;background:transparent}
.cs-n:hover{color:var(--ink)}
.sccard.here .cs-n{color:var(--ink)}
.cs-n .dot{width:7px;height:7px;border-radius:50%;background:var(--glow);flex:0 0 7px}
.cs-drs{display:inline-flex;gap:1px}
.drb{position:relative;padding:3px 7px 4px;border-radius:7px;cursor:pointer;background:transparent;
  font:500 11.5px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.03em;color:var(--ink-3)}
.drb:hover{color:var(--ink)}
.drb.on{color:var(--ink);font-weight:600;
  background:color-mix(in srgb,var(--glow) 18%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--glow) 45%,transparent)}
/* Dotted, so the baseline marker is not confused with the selection. */
.drb.base{text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:2px;
  text-decoration-color:var(--ink-3)}
.drb.bk::before{content:"";position:absolute;top:1px;right:1px;width:5px;height:5px;border-radius:50%;
  background:var(--cbk);box-shadow:0 0 5px var(--cbk)}
/* The tech response view reads every rate at once, so choosing one means
   nothing there and the buttons say so rather than disappearing. */
.sclist-h.drlock .drb{color:var(--ink-3);opacity:.42;cursor:default;background:transparent;
  box-shadow:none;text-decoration:none}
.sclist-h.drlock .drb:hover{color:var(--ink-3)}
.sclist-h.drlock .cs-drs{filter:grayscale(1)}
.scb{position:relative;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 5px;
  font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;--glow:var(--accent)}
.scb:hover{color:var(--ink)}
.scb::after{content:"";position:absolute;left:7px;right:7px;bottom:0;height:2px;border-radius:2px;
  background:transparent}
.scb[aria-current="true"]{color:var(--ink);font-weight:600}
.scb[aria-current="true"]::after{background:var(--glow);

  paint-order:stroke;stroke:var(--surface);stroke-width:2.5px;stroke-linejoin:round}

.tt{position:fixed;pointer-events:none;z-index:99;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;max-width:260px;opacity:0;
  transition:opacity .1s}
.tt.on{opacity:1}
.tt .tt-h{font-weight:600;margin-bottom:4px;font-size:12px}
.tt .tt-r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tt .tt-r i{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.tt .tt-r b{font-weight:600;font-family:"IBM Plex Mono",monospace}
/* Country hover card: a few figures and the mix, nothing that needs scrolling. */
.tt{max-width:300px}
.tt .tt-p{display:flex;justify-content:space-between;gap:14px;font-size:11.5px;margin:1px 0}
.tt .tt-p span{color:var(--ink-3)}
.tt .tt-p b{font-weight:600;font-family:"IBM Plex Mono",monospace;color:var(--ink)}
.tt .tt-mix{display:flex;height:7px;border-radius:3px;overflow:hidden;margin:7px 0 4px}
.tt .tt-mix i{display:block;height:100%}
.tt .tt-mixl{display:flex;flex-wrap:wrap;gap:2px 9px;font-size:10px;color:var(--ink-3)}
.tt .tt-mixl span{display:inline-flex;align-items:center;gap:4px}
.tt .tt-mixl i{width:7px;height:7px;border-radius:2px}
.tt .tt-l{margin-top:6px;padding-top:5px;border-top:1px solid var(--line-soft);
  font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 9px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--ink-3);font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  position:sticky;top:0;background:var(--surface)}
.scroll{overflow-x:auto;max-height:460px;overflow-y:auto;border:1px solid var(--line-soft);border-radius:8px}

.find{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;
  border:1px solid var(--line-soft);background:var(--surface-2)}
.find .sev{width:3px;align-self:stretch;border-radius:2px;flex:0 0 3px}
.find.cr .sev{background:var(--crit)} .find.wn .sev{background:var(--warn)} .find.ok .sev{background:var(--good)}
.find .ft{font-weight:600;font-size:12.5px;margin-bottom:2px}
.find .fb{font-size:12px;color:var(--ink-2);line-height:1.45}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;
  background:var(--surface);color:var(--ink-2)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.ico{display:inline-flex;align-items:center;justify-content:center;padding:0;
  width:28px;height:26px;flex:0 0 28px}
.btn.ico svg{width:15px;height:15px;display:block}
/* ---- glowing icon action -------------------------------------------------
   The two folder actions are icons that name themselves on hover. The mark is
   lit rather than filled, in keeping with the rest of the chrome, and the
   label is a tooltip of our own so it arrives at once instead of after the
   browser's delay. The accessible name lives on the button, so the control is
   still "Connect results root" to a screen reader and to keyboard focus. */
.gico{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:28px;flex:0 0 30px;padding:0;border-radius:8px;
  color:var(--ink-3);background:var(--surface);border:1px solid var(--line);
  transition:color .16s ease,border-color .16s ease,box-shadow .18s ease,transform .16s ease}
.gico svg{width:16px;height:16px;display:block;
  transition:filter .18s ease,transform .3s cubic-bezier(.3,0,.2,1)}
.gico:hover:not(:disabled),.gico:focus-visible:not(:disabled){
  color:var(--pin);border-color:color-mix(in srgb,var(--pin) 50%,var(--line));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--pin) 10%,transparent);transform:translateY(-1px)}
.gico:hover:not(:disabled) svg,.gico:focus-visible:not(:disabled) svg{
  filter:drop-shadow(0 0 5px color-mix(in srgb,var(--pin) 75%,transparent))
         drop-shadow(0 0 11px color-mix(in srgb,var(--pin) 45%,transparent))}
#refreshBtn.gico:hover:not(:disabled) svg{transform:rotate(145deg)}
.gico:active:not(:disabled){transform:translateY(0)}
.gico:disabled{opacity:.38;cursor:default}
/* The name, on hover, below the mark. */
.gico .gl{position:absolute;top:calc(100% + 7px);left:-2px;transform:translate(0,-3px);
  white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.02em;
  padding:3px 8px;border-radius:7px;pointer-events:none;z-index:20;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
  box-shadow:var(--shadow);opacity:0;visibility:hidden;
  transition:opacity .14s ease,transform .18s cubic-bezier(.3,0,.2,1),visibility .14s}
.gico:hover .gl,.gico:focus-visible .gl{opacity:1;visibility:visible;transform:translate(0,0)}
.gico:disabled .gl{display:none}
/* On the landing map the controls sit at the foot, so the label goes above. */
.mapctl .gico .gl{top:auto;bottom:calc(100% + 7px);transform:translate(0,3px)}
.mapctl .gico:hover .gl{transform:translate(0,0)}
.mapctl .gico{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(6px)}
@media(prefers-reduced-motion:reduce){
  .gico,.gico svg,.gico .gl{transition:none}
  #refreshBtn.gico:hover:not(:disabled) svg{transform:none}}
/* Still a native select — it opens instantly and needs no script — dressed
   with a chevron and the type treatment the rest of the bar uses. */
.sel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:7px;
  padding:5px 30px 5px 11px;font-size:13px;font-weight:600;letter-spacing:-.01em;
  background:var(--surface);color:var(--ink);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
                   linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  transition:border-color .15s,box-shadow .15s}
.sel:hover{border-color:var(--accent)}
.sel:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel option{font-weight:500;font-size:13px}
.banner{display:flex;gap:9px;align-items:center;padding:8px 12px;border-radius:8px;font-size:12.5px;
  background:var(--accent-soft);color:var(--ink-2);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
/* Unserved demand is not a result to read past, so it is announced in the one
   colour nothing else uses, above every chart and beside the scenario name. */
.bkmark path{fill:var(--cbk)}
.bkmark text{fill:#fff;font-size:6.5px;font-weight:700;font-family:"IBM Plex Sans",sans-serif}
.bkmark{cursor:help}
@media(prefers-reduced-motion:no-preference){
  .bkmark{animation:bkpulse 1.8s ease-in-out infinite}
  @keyframes bkpulse{0%,100%{opacity:1}50%{opacity:.45}}}
.alarm{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:9px;font-size:13px;
  background:color-mix(in srgb,var(--cbk) 12%,var(--surface));color:var(--ink);
  border:1px solid color-mix(in srgb,var(--cbk) 55%,transparent);border-left:4px solid var(--cbk);
  box-shadow:0 2px 10px color-mix(in srgb,var(--cbk) 18%,transparent)}
.alarm .ic{flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:var(--cbk);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1}
.alarm b{color:var(--cbk)}
.rmk-f{border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
.alarm .det{color:var(--ink-2);font-size:12.5px}
/* The read reports itself in the same idiom as the opening: a field of points
   that fills and empties on a diagonal, so a refresh reads as the map being
   redrawn rather than as a spinner from somewhere else. */
/* ---- mix donuts ----------------------------------------------------------
   Four years across, twice: what the fleet is built of, and what it actually
   produced. The two rows share a scale of nothing — each ring is its own
   100 % — so they are read as composition, never as volume. The outer years
   are fixed, because a comparison needs the same ends every time; the two
   middle years are the reader's to choose. */
/* ---- chart entrances -----------------------------------------------------
   A card wipes its plot in from the left, which for a time axis is the
   direction the data runs, and rings scale up instead — a left-to-right wipe
   on a circle reads as a glitch. Both are one compositor property and run once
   per card, when the card is first scrolled into view or when a tab switch
   puts it there. Cards stay visible if the observer never fires. */
.rise{opacity:0;transform:translateY(7px)}
.rise.in{opacity:1;transform:none;
  transition:opacity .34s ease,transform .34s cubic-bezier(.32,0,.24,1);
  transition-delay:calc(var(--ci,0) * 45ms)}
/* The axes, the grid and the labels are already in place; it is the data that
   arrives. Columns grow out of the baseline, lines draw along themselves, areas
   rise, and a ring fills round from twelve o'clock — each mark animating its own
   geometry rather than a clip over the whole picture. */
.rise.in .mk-bar{transform-box:fill-box;transform-origin:50% 100%;
  animation:mkbar .5s cubic-bezier(.22,.7,.3,1) both;
  animation-delay:calc(var(--ci,0) * 45ms + var(--bi,0) * 14ms + 60ms)}
.rise.in .mk-area{animation:mkarea .55s cubic-bezier(.3,0,.2,1) both;
  transform-box:fill-box;transform-origin:50% 100%;
  animation-delay:calc(var(--ci,0) * 45ms + 60ms)}
.rise.in .mk-line{animation:mkline .8s cubic-bezier(.35,0,.15,1) both;
  animation-delay:calc(var(--ci,0) * 45ms + 90ms)}
.rise.in .mk-dash{animation:mkfade .5s ease both;
  animation-delay:calc(var(--ci,0) * 45ms + 420ms)}
.rise.in .mk-tor{transform-box:view-box;transform-origin:var(--ox,0) 0;
  animation:mktor .46s cubic-bezier(.22,.7,.3,1) both;
  animation-delay:calc(var(--ci,0) * 45ms + var(--bi,0) * 26ms + 60ms)}
.rise.in .dring .seg{animation:mkseg .62s cubic-bezier(.3,0,.18,1) both;
  animation-delay:calc(var(--ci,0) * 45ms + var(--di,0) * 70ms + var(--si,0) * 34ms + 60ms)}
.rise.in .tile{animation:crise .42s ease both;animation-delay:calc(var(--ti,0) * 42ms)}
@keyframes mkbar{from{transform:scaleY(0);opacity:.35}to{transform:none;opacity:1}}
@keyframes mkarea{from{transform:scaleY(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes mkline{from{stroke-dasharray:1;stroke-dashoffset:1}
  to{stroke-dasharray:1;stroke-dashoffset:0}}
@keyframes mkfade{from{opacity:0}to{opacity:1}}
@keyframes mktor{from{transform:scaleX(0)}to{transform:none}}
@keyframes mkseg{from{stroke-dasharray:0 var(--C,214)}
  to{stroke-dasharray:var(--len) var(--rest)}}
@keyframes crise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .rise,.rise.in{opacity:1;transform:none;transition:none}
  .rise.in .mk-bar,.rise.in .mk-area,.rise.in .mk-line,.rise.in .mk-dash,
  .rise.in .mk-tor,.rise.in .dring .seg,.rise.in .tile{animation:none}}

/* ---- technology response to the discount rate ----------------------------
   The runs differ only in the rate they were solved at, so these charts put
   the rate on the axis and let the families sort themselves by how much they
   answer to it. */
.trbar{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 2px}
.trbar label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.trbar select{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:3px 8px;cursor:pointer}
.trbar select:hover{border-color:var(--accent)}
.trbar .trcase{font:600 12px 'IBM Plex Mono',ui-monospace,monospace;color:var(--ink-2);letter-spacing:.04em}
.trbar .rates{font:500 11.5px 'IBM Plex Mono',ui-monospace,monospace;color:var(--ink-3);margin-left:auto}
.trbar .rates b{color:var(--ink-2);font-weight:600}
.trsm{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:9px}
.trsm .p{border:1px solid var(--line-soft);border-radius:10px;padding:7px 7px 3px;background:var(--surface-2)}
.trsm .p.flat{opacity:.55}
.trv{font:500 10px 'IBM Plex Mono',ui-monospace,monospace;fill:var(--ink-3)}
.trt{font-size:10.5px;font-weight:600;fill:var(--ink-2)}
.mixrow{grid-column:1/-1;margin:0 0 2px}
.mixrow h3{margin:0 0 2px}
.mixrow h3 .hl{color:var(--pin);font-weight:700;letter-spacing:.01em}
.donuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
@media(max-width:820px){.donuts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dcell{display:flex;flex-direction:column;align-items:center;gap:5px}
.dcell svg{display:block;width:100%;max-width:168px;height:auto}
.dcell .dy{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:5px;min-height:22px}
.dcell select{font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 6px;cursor:pointer}
.dcell select:hover{border-color:var(--accent)}
.dcell .lock{border:1px dashed var(--line);border-radius:7px;padding:2px 8px;color:var(--ink-3)}
.dring .yr{font-weight:700;letter-spacing:-.02em;fill:var(--ink)}
.dring .sub{font-size:5.4px;letter-spacing:.14em;fill:var(--ink-3);font-weight:600}
.dring .seg{transition:opacity .2s,stroke-width .2s}
.dring .seg.minor,.dring .mk{cursor:default}
.dring .seg.dim{opacity:.17}
.dring .seg.pick{stroke-width:17;filter:drop-shadow(0 0 5px currentColor)}
.dring .mk line,.dring .mk circle{transition:opacity .15s}
.dring .mkl{font-weight:600;letter-spacing:.01em;paint-order:stroke;
  stroke:var(--surface);stroke-width:1.6px;stroke-linejoin:round}
.dring .mk.on .mkl{font-weight:700}
.dcell svg{overflow:visible;margin-top:12px}
.busy-dots{display:grid;grid-template-columns:repeat(16,5px);grid-auto-rows:5px;gap:5px;
  justify-content:center;margin:2px 0 12px}
.busy-dots i{width:5px;height:5px;border-radius:50%;background:var(--pin);
  animation:busydot 1.5s ease-in-out infinite both}
@keyframes busydot{
  0%,100%{opacity:.14;transform:scale(.55)}
  45%{opacity:1;transform:scale(1);box-shadow:0 0 7px var(--pin-glow)}}
@media(prefers-reduced-motion:reduce){.busy-dots i{animation:none;opacity:.5}}
.scb.bk{position:relative}
.scb.bk::before{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;
  background:var(--cbk);box-shadow:0 0 5px var(--cbk)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
/* ============================ constants ============================ */
const PJ2TWh = 1/3.6;                 // 1 PJ = 0.2778 TWh
/* ---- configuration --------------------------------------------------------
   Every table the charts use is filled by applyConfig() from the markdown
   files in config/. They start empty: nothing about a particular study is
   written into this file. They are mutated in place, never replaced, so a
   reference taken anywhere else stays valid.
     FAMS          families, in drawing order
     STORE_FAMS    the power half of a store: kept out of every supply total
     IMPORT_FAMS   counted in supply, left out of capacity-factor views
     BACKSTOP_FAM  unserved demand: never supply, never an investment
     TECH2FAM      model technology code -> family                        */
const FAMS = [];
const STORE_FAMS = new Set();
const IMPORT_FAMS = new Set();
let BACKSTOP_FAM = "\u0000none";
const FAMVAR = {};                     // family -> CSS custom property
const TECH2FAM = {};
const GENFAMS = [];                    // FAMS without the stores
const FUEL2 = {};                      // fuel-supply technology -> fuel
const FUELORDER = [];
const FUELVAR = {};
const EF_LABEL = {};                   // technologies whose emission is charted
const RENEW = new Set();
const FOSSIL = new Set();
const VRE = [];                        // variable renewables, for the solar-and-wind share
const VRE_SET = new Set();
/* Two-mode store technologies: the mode that delivers to the grid. */
const DISCHARGE_MODE = {};
const STO_FAM = {};                    // storage technology -> its power family
const STG_LABEL = {};                  // storage technology -> chart label
let DEMAND_TECH = null, EXPORT_TECH = null;
/* The base case every other run is compared against: config/scenarios.md. */
let BASELINE = null;
const scLabel = k => k===BASELINE ? `<tspan text-decoration="underline">${esc(k)}</tspan>` : esc(k);
let CAU = 31.536;                      // GW -> PJ per year; config/dashboard.md
let TITLE = "OSeMOSYS Result Dash", EXPORT_PREFIX = "OSD";

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const famColor = f => css(FAMVAR[f] || "--c0") || css("--c0");
/* Every figure carries thousands separators: 1000 is read as 1,000. The
   decimals asked for are kept, and a trailing .0 is still dropped. */
const fmt = (v,d=1) => {
  if(v==null || !isFinite(v)) return "–";
  const dec = Math.abs(v) >= 1e4 ? 0 : d;
  const t = v.toFixed(dec);
  const out = dec ? t.replace(/\.?0+$/,"") : t;
  const [i, f] = out.split(".");
  return i.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (f ? "."+f : "");
};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================ state ============================ */
// S.C maps country -> {caseName, years, scen, order, meta, runs}
// S.years / S.scen / S.order / S.caseName are live references to the selected country.
const S = { C:{}, selC:null, caseName:"", years:[], scen:{}, order:[],
            sel:null, tab:"home", unit:"PJ", form:"bars", sample:false,
            homePanel:null, iso:null, hidden:new Set(), pwr:"GW", pwrLock:false, share:false, more:false,
            donY:[2030,2040], trYear:null, trBlock:"cap",
            hintOff:(()=>{ try{ return sessionStorage.getItem("osd-hint")==="off"; }catch(e){ return false; } })() };

/* Country code -> name, and back: config/countries.md. */
const ISO = {};
const NAME2ISO = {};

function newCountry(name, caseName){
  return {name, caseName:caseName||name, years:[], scen:{}, order:[], meta:{}, runs:{}};
}
function useCountry(name){
