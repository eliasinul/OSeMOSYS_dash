}
/* ---- scenarios -------------------------------------------------------------
   A results file does not record what it was solved for, so the meaning of
   each scenario code comes from config/scenarios.md: the case (storyline) it
   belongs to, the variant (here a discount rate) it was solved at, and the
   rate itself. A country rate overrides the scenario rate for one variant. */
const SCEN = {};                 // code -> {case, variant, rate (%), desc}
const CASES = {};                // case -> {style, cap, desc}
const VARIANTS = [];             // display order inside a case card
const VARLABEL = {};
const DR_OVERRIDE = {};          // country name -> {variant: rate %}
function splitScen(k){
  const s = SCEN[String(k||"").toUpperCase()];
  return s ? {case:s.case, variant:s.variant} : null;
}
function drFor(country, scenKey){
  const s = SCEN[String(scenKey||"").toUpperCase()];
  if(!s) return null;
  const o = (DR_OVERRIDE[country]||{})[s.variant];
  if(o != null) return o/100;
  return s.rate != null ? s.rate/100 : null;
}
/* Where a rate came from, for the scenario card. */
function drSrcFor(country, scenKey){
  const s = SCEN[String(scenKey||"").toUpperCase()];
  if(!s) return null;
  return (DR_OVERRIDE[country]||{})[s.variant] != null ? "country" : "scenario";
}

/* ---- annualised capital charge -------------------------------------------
   The overnight cost of a plant does not depend on the discount rate; the
   cost of financing it does. Each investment is therefore turned into an
   equal yearly payment over the plant's life with the capital recovery
   factor, so that the same plant costs more each year at a higher rate.

   Two kinds of investment are costed, both from the first cost year:
     new build  - what the model chose to build: CapitalInvestment and
                  CapitalInvestmentStorage from the results file;
     pipeline   - committed capacity still to be commissioned, from the
                  Committed pipeline table of config/investment.md: MW x
                  capex in the commissioning year.
   Lives, the pipeline and its capex are not in the results file; they come
   from config/investment.md, and the arithmetic is done here. */
const INV = {};                  // country -> {life:{code:years}, pipe:[...]}
let INV_SRC = null;
function invReset(){ for(const k of Object.keys(INV)) delete INV[k]; INV_SRC = null; }

/* Capital recovery factor: the share of an investment repaid each year so
   that n equal payments at rate r have a present value equal to it. */
function CRF(r, n){
  if(!(n > 0)) return null;
  if(!(r > 0)) return 1/n;
  const g = Math.pow(1 + r, n);
  return r * g / (g - 1);
}

/* Annual capital payments by family, over the full horizon, for one run at
   rate r. Vintages before the cost window are sunk and not costed; payments
   run for the plant's life from its first year and stop at the last model
   year, so a plant built late carries only the years the model covers. */
function annualisedCapital(sc, country, r){
  const inv = INV[country];
  if(!inv || r == null) return null;
  const ALL = S.years, n = ALL.length, i0 = costFromIdx();
  const nb = {}, pl = {}, missing = new Set();
  const add = (store, fam, v0, life, amt) => {
    if(!(amt > 0) || !(life > 0)) return;
    const a = amt * CRF(r, life);
    const arr = (store[fam] ||= new Array(n).fill(0));
    for(let i = v0; i < n && i < v0 + life; i++) arr[i] += a;
  };
  for(const [t, arr] of Object.entries(sc.techCapex || {})){
    const fam = TECH2FAM[t];
    if(!fam || fam === BACKSTOP_FAM) continue;     // the backstop's cost is a penalty
    const life = inv.life[t];
    if(!(life > 0)){ if((arr||[]).some(v=>v>0)) missing.add(t); continue; }
    for(let v = i0; v < n; v++) add(nb, fam, v, life, arr[v] || 0);
  }
  for(const [t, arr] of Object.entries(sc.stgcapex || {})){
    const fam = STO_FAM[t]; if(!fam) continue;
    const life = inv.life[t];
    if(!(life > 0)){ if((arr||[]).some(v=>v>0)) missing.add(t); continue; }
    for(let v = i0; v < n; v++) add(nb, fam, v, life, arr[v] || 0);
  }
  for(const p of inv.pipe){
    const fam = TECH2FAM[p.code];
    if(!fam || fam === BACKSTOP_FAM) continue;
    const v = ALL.indexOf(String(p.year));
    if(v < i0) continue;                           // sunk, or beyond the horizon
    if(!(p.capex > 0)){ missing.add(p.code + " capex"); continue; }
    add(pl, fam, v, p.life > 0 ? p.life : inv.life[p.code], p.mw / 1000 * p.capex);
  }
  return {nb, pl, missing:[...missing]};
}
/* A lighter shade of a family colour, for the pipeline half of the stack.
   Computed rather than written as color-mix() so the PNG export, which
   freezes computed colours, gets a plain value. */
function tintOf(hex, t){
  const bg = css("--surface") || "#ffffff";
  const rgb = x => { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(x).trim());
    return m ? [1,2,3].map(i => parseInt(m[i], 16)) : null; };
  const a = rgb(hex), b = rgb(bg);
  if(!a || !b) return hex;
  return "rgb(" + a.map((c, i) => Math.round(c * t + b[i] * (1 - t))).join(",") + ")";
}

/* The dashboard carries no sample and shows only what it reads. A page built by
   tools/make_demo_page.py carries one in a JSON tag, {note, files:[{path, text}]},
   and reads it as a linked folder would be read. Any read from a folder replaces it. */
async function loadSample(){
  S.C = {}; S.sel = null;
  S.selC = null; S.caseName = ""; S.years = []; S.scen = {}; S.order = [];
  S.sample = false;
  const tag = document.getElementById("osd-sample");
  if(!tag) return;
  try{
    const B = JSON.parse(tag.textContent);
    await ingestFiles(B.files.map(f => {
      const name = f.path.split("/").pop();
      return {name, path:f.path, file:new File([f.text], name, {lastModified:0})};
    }));
    if(S.readProblem) return;
    for(const c of Object.values(S.C)) for(const sc of Object.values(c.scen)) sc.src = "sample";
    S.sample = true; S.sampleNote = B.note || "";
    render();
  }catch(e){
    S.readProblem = "The sample inside this page could not be read: " + e.message;
    render();
  }
}

/* ============================ ingestion ============================ */
function blankScen(name){
  return {name, desc:"", dr:null, obj:null, aelim:null, cap:{}, act:{}, "new":{}, capex:{},
    fom:{}, vom:{}, emi:{}, fuel:{}, stgcap:{}, stgcapex:{},
    dem:null, peak:null, tsDem:null, tsGen:null, exp:null, runAt:null, solveMs:null, src:"file",
    techCap:{}, techAct:{}, dataAt:null, resAt:null, bind:[]};
}
function yIdx(y){ return S.years.indexOf(String(y)); }
function ensureYears(ys){
  const c = S.C[S.selC]; if(!c) return;
  const set = new Set(c.years.concat(ys.map(String)));
  const sorted = [...set].sort();
  c.years.length = 0; c.years.push(...sorted);   // mutate in place so references hold
  S.years = c.years;
}
function put(store, key, y, v){
  if(!isFinite(v) || v===0) return;
  const i = yIdx(y); if(i<0) return;
  const a = (store[key] ||= new Array(S.years.length).fill(0));
  while(a.length < S.years.length) a.push(0);
  a[i] += v;
}

/* Technologies that are the power half of a store. They run in two modes and
   TotalTechnologyAnnualActivity sums both, so the annual figure is pumping
   plus generating. Sheets "6.1 TTS" and "6.2 TFS" of the model workbooks give
   the convention: mode 1 charges the store, mode 2 draws from it. Only mode 2
   is electricity delivered to the grid. */

const RESVARS = new Set(["TotalCapacityAnnual","TotalTechnologyAnnualActivity","NewCapacity",
  "CapitalInvestment","AnnualFixedOperatingCost","AnnualVariableOperatingCost","AnnualTechnologyEmission",
  "AccumulatedNewStorageCapacity","CapitalInvestmentStorage"]);
const BINDROWS = {TCC1_TotalAnnualMaxCapacityConstraint:"capacity cap",
  TCC2_TotalAnnualMinCapacityConstraint:"minimum capacity",
  AAC2_TotalAnnualTechnologyActivityUpperLimit:"activity cap",
  AAC3_TotalAnnualTechnologyActivityLowerLimit:"activity floor",
  NCC1_TotalAnnualMaxNewCapacityConstraint:"build-rate cap",
  E8_AnnualEmissionsLimit:"emission cap",
  UDC1_UserDefinedConstraintInequality:"user constraint"};

/* Slice-level rates are kept for the demand technology and every mapped plant. */
function slicedTech(argstr){
  const t = String(argstr).split(",")[1];
  return t === DEMAND_TECH || !!TECH2FAM[t];
}
function parseResultsTxt(text, sc){
  const lines = text.split(/\r?\n/);
  const m0 = lines[0] && lines[0].match(/objective value\s+([-\d.eE+]+)/);
  if(m0) sc.obj = parseFloat(m0[1]);
  // first pass: collect years
  const ys = new Set(); const rows = [];
  const re = /^\s*\d+\s+([A-Za-z0-9_]+)\(([^)]*)\)\s+(\S+)\s+(\S+)\s*$/;
  for(let i=1;i<lines.length;i++){
    const m = re.exec(lines[i]); if(!m) continue;
    const name=m[1];
    if(!RESVARS.has(name) && !BINDROWS[name]
       && !(name === "RateOfTotalActivity" && slicedTech(m[2]))
       /* mode-resolved rows, read only for the two-mode store technologies */
       && !((name === "TotalAnnualTechnologyActivityByMode" || name === "RateOfActivity")
            && m[2].split(",").some(a => DISCHARGE_MODE[a]))) continue;
    const args=m[2].split(",");
    const y=args[args.length-1];
    if(/^\d{4}$/.test(y)) ys.add(y);
    rows.push([name,args,parseFloat(m[3]),parseFloat(m[4])]);
  }
  ensureYears([...ys]);
  for(const [name,args,val,dual] of rows){
    const y=args[args.length-1];
    if(BINDROWS[name]){
      if(Math.abs(dual)>1e-9) sc.bind.push({kind:BINDROWS[name],who:args[1]||"—",year:y,dual});
      continue;
    }
    const t=args[1]; const fam=TECH2FAM[t]; const fu=FUEL2[t];
    if(name==="AccumulatedNewStorageCapacity"){ put(sc.stgcap,t,y,val); continue; }
    if(name==="CapitalInvestmentStorage"){ put(sc.stgcapex,t,y,val); continue; }
    if(name==="AnnualTechnologyEmission"){ if(EF_LABEL[t]) put(sc.emi,t,y,val); continue; }
    if(name==="RateOfTotalActivity"){
      /* Slice-level rates. The whole year is kept for the demand technology and
         for every generator, because the slice that matters is not known until
         all of them have been read: it is the one where the load left over for
         dispatchable plant is largest. */
      const i = yIdx(y), ts = args[2];
      if(i<0 || !ts) continue;
      if(args[1]===DEMAND_TECH){
        (sc.peak ||= new Array(S.years.length).fill(0));
        if(val > sc.peak[i]) sc.peak[i] = val;
        (sc.tsDem ||= {}); ((sc.tsDem[ts] ||= new Array(S.years.length).fill(0)))[i] = val;
        continue;
      }
      const fam = TECH2FAM[args[1]];
      if(!fam || STORE_FAMS.has(fam)) continue;  // stores come from RateOfActivity
      /* RateOfTotalActivity sums the modes, so for a store technology it mixes
         pumping with generating. Those come from RateOfActivity instead. */
      if(DISCHARGE_MODE[args[1]]) continue;
      (sc.tsGen ||= {});
      const row = ((sc.tsGen[fam] ||= {})[ts] ||= new Array(S.years.length).fill(0));
      row[i] += val;
      continue;
    }
    if(name==="TotalAnnualTechnologyActivityByMode"){
      /* args: region, technology, mode, year */
      const md = DISCHARGE_MODE[t];
      /* The discharge is returned electricity, not new supply, so it is not
         added to the annual stacks. It is kept per technology for reference. */
      if(md && args[2]===md && fam) put(sc.storeOut ||= {}, fam, y, val);
      continue;
    }
    if(name==="RateOfActivity"){
      /* args: region, time slice, technology, mode, year */
      const tech = args[2], md = DISCHARGE_MODE[tech];
      if(!md || args[3]!==md) continue;
      const f2 = TECH2FAM[tech];
      if(!f2) continue;
      const i = yIdx(y), ts = args[1];
      if(i<0 || !ts) continue;
      (sc.tsGen ||= {});
      const row = ((sc.tsGen[f2] ||= {})[ts] ||= new Array(S.years.length).fill(0));
      row[i] += val;
      continue;
    }
    if(name==="TotalTechnologyAnnualActivity"){
      put(sc.techAct,t,y,val);
      if(t===DEMAND_TECH){ (sc.dem ||= new Array(S.years.length).fill(0))[yIdx(y)]=val; }
      if(t===EXPORT_TECH){ (sc.exp ||= new Array(S.years.length).fill(0))[yIdx(y)]=val; }
      /* A two-mode store technology is counted from its discharge mode above;
         this total would add the pumping load to supply. */
      if(fam && !STORE_FAMS.has(fam) && !DISCHARGE_MODE[t]) put(sc.act,fam,y,val);
      continue;
    }
    if(name==="AnnualVariableOperatingCost"){
      if(fu) put(sc.fuel,fu,y,val); else if(fam) put(sc.vom,fam,y,val);
      continue;
    }
    if(!fam) continue;
    if(name==="TotalCapacityAnnual"){ put(sc.cap,fam,y,val); put(sc.techCap,t,y,val); }
    else if(name==="NewCapacity") put(sc["new"],fam,y,val);
    else if(name==="CapitalInvestment"){
      put(sc.capex,fam,y,val);
      /* Kept per technology as well: the annualised charge needs each one's
         own life, and a family can hold technologies with different lives. */
      put(sc.techCapex ||= {}, t, y, val);
    }
    else if(name==="AnnualFixedOperatingCost") put(sc.fom,fam,y,val);
  }
}




/* Which files are results is set by the patterns in config/results.md, for
   example  results/*_{scenario}_{iso3}.txt . {iso3} and {scenario} match only
   the codes listed in countries.md and scenarios.md, longest first, so a code
   that contains an underscore is never split. A path inside an ignored
   folder (archive, old, ...) is never a results path: reading a superseded
   run beside the current one would merge the two into one scenario. */
let RESULT_PATS = [];
let ARCHIVE_RE = /(?:^|\/)(archive|archived|old|superseded)(?:\/|$)/i;
const reEsc = x => String(x).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function compilePattern(pat){
  const p = String(pat).trim().replace(/\\/g, "/").replace(/^\.?\//, "");
  const alt = keys => keys.slice().sort((a,b)=>b.length-a.length).map(reEsc).join("|");
  let src = "", g = 0, iso = -1, scen = -1;
  for(const t of p.split(/(\{iso3\}|\{scenario\}|\*\*\/|\*\*|\*)/i)){
    if(!t) continue;
    const lt = t.toLowerCase();
    if(lt === "{iso3}"){
      if(!Object.keys(ISO).length) throw new Error(`"${pat}": no countries are defined`);
      iso = ++g; src += "(" + alt(Object.keys(ISO)) + ")";
    } else if(lt === "{scenario}"){
      if(!Object.keys(SCEN).length) throw new Error(`"${pat}": no scenarios are defined`);
      scen = ++g; src += "(" + alt(Object.keys(SCEN)) + ")";
    } else if(t === "**/") src += "(?:[^/]+/)*";
    else if(t === "**") src += ".*";
    else if(t === "*") src += "[^/]*?";
    else src += reEsc(t);
  }
  if(iso < 0 || scen < 0) throw new Error(`"${pat}" needs both {iso3} and {scenario}`);
  return {src: pat, re: new RegExp("(?:^|/)" + src + "$", "i"), iso, scen};
}
/* Returns {iso, key} when this path is a results file, else null. */
function classify(path, name){
  const p = String(path || name || "").replace(/\\/g, "/");
  if(ARCHIVE_RE.test(p.replace(/[^/]*$/, ""))) return null;
  for(const r of RESULT_PATS){
    const m = r.re.exec(p);
    if(m) return {iso: m[r.iso].toUpperCase(), key: m[r.scen].toUpperCase()};
  }
  return null;
}

/* ---- reading config/*.md ----------------------------------------------------
   Plain markdown: a table is found by the heading above it, and its first row
   names the columns. Backticks around a cell are dropped. A cell cannot hold
   a literal "|". */
const CFG_RE = /(?:^|\/)config\/(dashboard|results|countries|scenarios|technologies|investment)\.md$/i;
const CFG_NEED = ["technologies", "countries", "scenarios", "results"];
const CFG = {ok:false, dir:null, files:[], problems:[]};
function mdTables(text){
  const out = []; let head = "";
  const lines = String(text || "").split(/\r?\n/);
  const cells = l => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|")
    .map(x => x.trim().replace(/^`(.*)`$/, "$1").trim());
  for(let i = 0; i < lines.length; i++){
    const h = /^\s{0,3}#{1,6}\s+(.*?)\s*#*\s*$/.exec(lines[i]);
    if(h){ head = h[1].trim(); continue; }
    if(/^\s*\|/.test(lines[i]) && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i+1])){
      const cols = cells(lines[i]).map(c => c.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""));
      const rows = [];
      for(i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++){
        const v = cells(lines[i]), o = {};
        cols.forEach((c, j) => o[c] = v[j] != null ? v[j] : "");
        rows.push(o);
      }
      i--; out.push({heading: head, rows});
    }
  }
  return out;
}
const tableOf = (tabs, re) => (tabs.find(t => re.test(t.heading)) || {}).rows || null;
const clearObj = o => { for(const k of Object.keys(o)) delete o[k]; };
const cfgYes = v => /^(yes|y|true|1|x)$/i.test(String(v || "").trim());
const cfgNum = v => { const x = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isFinite(x) ? x : null; };
const cfgHex = v => {
  let t = String(v || "").trim().replace(/^#/, "");
  if(/^[0-9a-f]{3}$/i.test(t)) t = t.split("").map(c => c + c).join("");
  return /^[0-9a-f]{6}$/i.test(t) ? "#" + t : null;
};
/* Family and fuel colours are written once as custom properties for both
   themes, so every chart keeps reading them with css(), and the PNG export
   still sees plain hex values. */
function paintConfigColours(list){
  let el = document.getElementById("cfgColours");
  if(!el){ el = document.createElement("style"); el.id = "cfgColours"; document.head.appendChild(el); }
  const L = list.map(([v, a]) => cfgHex(a) ? `${v}:${cfgHex(a)};` : "").join("");
  const D = list.map(([v, a, b]) => cfgHex(b || a) ? `${v}:${cfgHex(b || a)};` : "").join("");
  el.textContent = `:root{${L}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${D}}}:root[data-theme="dark"]{${D}}`;
}
const byOrder = rows => (rows || []).map((r, i) => ({r, o: cfgNum(r.order), i}))
  .sort((a, b) => (a.o ?? 1e9) - (b.o ?? 1e9) || a.i - b.i).map(x => x.r);

/* Fills every table from the text of the config files. Returns the problems
   found; a problem never stops the read, it is listed on Home instead. */
function applyConfig(T){
  const P = [];
  /* dashboard.md: optional */
  TITLE = "OSeMOSYS Result Dash"; EXPORT_PREFIX = "OSD"; CAU = 31.536; COST_FROM = "2025"; CMT_DIR = "_comments";
  for(const r of tableOf(mdTables(T.dashboard), /settings|dashboard/i) || []){
    const k = (r.key || "").toLowerCase(), v = (r.value || "").trim();
    if(!k) continue;
    if(k === "title" && v) TITLE = v;
    else if(k === "export_prefix" && v) EXPORT_PREFIX = v.replace(/[^A-Za-z0-9_-]+/g, "_");
    else if(k === "cost_from_year" && /^\d{4}$/.test(v)) COST_FROM = v;
    else if(k === "cau_pj_per_gw" && cfgNum(v) > 0) CAU = cfgNum(v);
    else if(k === "comments_folder" && v && !/[\\/]/.test(v)) CMT_DIR = v;
    else P.push(`dashboard.md: key "${r.key}" not recognised or value "${v}" not valid`);
  }
  document.title = TITLE;
  const ht = document.getElementById("dashTitle"); if(ht) ht.textContent = TITLE;

  /* technologies.md */
  const tt = mdTables(T.technologies);
  FAMS.length = 0; STORE_FAMS.clear(); IMPORT_FAMS.clear(); RENEW.clear(); FOSSIL.clear();
  VRE.length = 0; VRE_SET.clear(); clearObj(FAMVAR); BACKSTOP_FAM = "\u0000none";
  const colours = [];
  const fams = tableOf(tt, /^families$/i);
  if(!fams || !fams.length) P.push("technologies.md: no Families table");
  byOrder(fams).forEach(r => {
    const f = r.family; if(!f) return;
    if(FAMS.includes(f)){ P.push(`technologies.md: family "${f}" listed twice`); return; }
    const role = (r.role || "generation").toLowerCase();
    if(role === "storage") STORE_FAMS.add(f);
    else if(role === "import") IMPORT_FAMS.add(f);
    else if(role === "backstop"){
      if(BACKSTOP_FAM !== "\u0000none") P.push(`technologies.md: second backstop family "${f}" treated as generation`);
      else BACKSTOP_FAM = f;
    } else if(role !== "generation") P.push(`technologies.md: family "${f}" has unknown role "${r.role}"`);
    if(cfgYes(r.renewable)) RENEW.add(f);
    if(cfgYes(r.vre)){ VRE.push(f); VRE_SET.add(f); }
    if(cfgYes(r.fossil)) FOSSIL.add(f);
    if(!cfgHex(r.colour_light)) P.push(`technologies.md: family "${f}" has no valid colour_light`);
    const v = "--fam-" + FAMS.length; FAMVAR[f] = v; FAMS.push(f);
    colours.push([v, r.colour_light, r.colour_dark]);
  });
  GENFAMS.length = 0; GENFAMS.push(...FAMS.filter(f => !STORE_FAMS.has(f)));
  clearObj(TECH2FAM); clearObj(DISCHARGE_MODE);
  for(const r of tableOf(tt, /^technologies$/i) || []){
    const t = (r.tech || "").toUpperCase(); if(!t) continue;
    if(!FAMS.includes(r.family)){ P.push(`technologies.md: ${t} maps to unknown family "${r.family}"`); continue; }
    TECH2FAM[t] = r.family;
    if(r.discharge_mode) DISCHARGE_MODE[t] = String(r.discharge_mode).trim();
  }
  if(!Object.keys(TECH2FAM).length) P.push("technologies.md: no Technologies table");
  clearObj(STO_FAM); clearObj(STG_LABEL);
  for(const r of tableOf(tt, /^storage$/i) || []){
    const t = (r.storage || "").toUpperCase(); if(!t) continue;
    if(r.family && FAMS.includes(r.family)) STO_FAM[t] = r.family;
    else P.push(`technologies.md: storage ${t} maps to unknown family "${r.family}"`);
    STG_LABEL[t] = r.label || r.family || t;
  }
  clearObj(FUEL2); clearObj(EF_LABEL);
  for(const r of tableOf(tt, /^fuels$/i) || []){
    const t = (r.tech || "").toUpperCase(); if(!t || !r.fuel) continue;
    FUEL2[t] = r.fuel; if(cfgYes(r.emission)) EF_LABEL[t] = r.fuel;
  }
  FUELORDER.length = 0; clearObj(FUELVAR);
  byOrder(tableOf(tt, /^fuel colou?rs$/i)).forEach(r => {
    if(!r.fuel || FUELORDER.includes(r.fuel)) return;
    const v = "--fuel-" + FUELORDER.length; FUELVAR[r.fuel] = v; FUELORDER.push(r.fuel);
    colours.push([v, r.colour_light, r.colour_dark]);
  });
  for(const f of new Set(Object.values(FUEL2))) if(!FUELORDER.includes(f)){
    FUELORDER.push(f); P.push(`technologies.md: fuel "${f}" has no colour`);
  }
  DEMAND_TECH = EXPORT_TECH = null;
  for(const r of tableOf(tt, /^special/i) || []){
    const role = (r.role || "").toLowerCase(), t = (r.tech || "").toUpperCase();
    if(role === "demand") DEMAND_TECH = t; else if(role === "export") EXPORT_TECH = t;
  }
  if(!DEMAND_TECH) P.push("technologies.md: no demand technology, so demand and peak views are empty");
  paintConfigColours(colours);

  /* countries.md */
  clearObj(ISO); clearObj(NAME2ISO); clearObj(GEO); clearObj(PROFILE);
  const ct = mdTables(T.countries);
  for(const r of tableOf(ct, /^countries$/i) || []){
    const iso = (r.iso3 || "").toUpperCase(), name = (r.name || "").trim() || iso;
    if(!/^[A-Z0-9]{2,8}$/.test(iso)){ P.push(`countries.md: "${r.iso3}" is not a usable code`); continue; }
    if(ISO[iso]){ P.push(`countries.md: ${iso} listed twice`); continue; }
    ISO[iso] = name; NAME2ISO[name.toLowerCase()] = iso;
    const lat = cfgNum(r.lat), lon = cfgNum(r.lon);
    if(lat != null && lon != null && Math.abs(lat) <= 90 && Math.abs(lon) <= 180){
      const left = /^l/i.test(r.label || "");
      GEO[name] = [lat, lon, left ? "end" : "start", left ? -11 : 11, 4];
    } else P.push(`countries.md: ${iso} has no valid lat/lon, so it has no marker`);
  }
  if(!Object.keys(ISO).length) P.push("countries.md: no Countries table");
  for(const r of tableOf(ct, /^profiles?$/i) || []){
    const n = ISO[(r.iso3 || "").toUpperCase()];
    if(!n){ P.push(`countries.md: profile row for unknown code "${r.iso3}"`); continue; }
    if(!r.field) continue;
    const pr = (PROFILE[n] ||= {rows:[], mix:null});
    if(/^mix$/i.test(r.field)){
      const mix = String(r.value).split(",").map(seg => {
        const m = /^(.+?)\s+([\d.]+)\s*%?$/.exec(seg.trim());
        return m ? {f:m[1].trim(), v:parseFloat(m[2])} : null;
      }).filter(Boolean);
      pr.mix = mix.length ? mix : null;
    } else pr.rows.push([r.field, r.value]);
  }

  /* scenarios.md */
  clearObj(SCEN); clearObj(CASES); VARIANTS.length = 0; clearObj(VARLABEL); clearObj(DR_OVERRIDE);
  BASELINE = null;
  const st = mdTables(T.scenarios);
  for(const r of tableOf(st, /^cases$/i) || []) if(r.case)
    CASES[r.case.toUpperCase()] = {style:(r.style || "").toLowerCase(), cap:cfgYes(r.emission_cap), desc:r.description || ""};
  for(const r of tableOf(st, /^variants$/i) || []) if(r.variant){
    const v = r.variant.toUpperCase(); if(!VARIANTS.includes(v)) VARIANTS.push(v); VARLABEL[v] = r.label || v;
  }
  for(const r of tableOf(st, /^scenarios$/i) || []){
    const k = (r.code || "").toUpperCase(); if(!k) continue;
    if(SCEN[k]){ P.push(`scenarios.md: ${k} listed twice`); continue; }
    const cs = (r.case || k).toUpperCase(), va = (r.variant || "").toUpperCase() || null;
    SCEN[k] = {case:cs, variant:va, rate:cfgNum(r.discount_rate_pct), desc:r.description || ""};
    if(!CASES[cs]) CASES[cs] = {style:"", cap:false, desc:""};
    if(va && !VARIANTS.includes(va)){ VARIANTS.push(va); VARLABEL[va] = va; }
    if(cfgYes(r.base)){
      if(BASELINE) P.push(`scenarios.md: more than one base scenario; ${BASELINE} kept, ${k} ignored`);
      else BASELINE = k;
    }
  }
  if(!Object.keys(SCEN).length) P.push("scenarios.md: no Scenarios table");
  else if(!BASELINE) P.push("scenarios.md: no scenario is marked base = yes");
  for(const r of tableOf(st, /^country rates?$/i) || []){
    const n = ISO[(r.iso3 || "").toUpperCase()], v = cfgNum(r.discount_rate_pct), va = (r.variant || "").toUpperCase();
    if(!n || v == null || !va){ P.push(`scenarios.md: country rate row "${r.iso3} ${r.variant}" not usable`); continue; }
    (DR_OVERRIDE[n] ||= {})[va] = v;
  }

  /* results.md */
  RESULT_PATS = [];
  const rt = mdTables(T.results);
  for(const r of tableOf(rt, /^patterns?$/i) || []){
    if(!r.pattern) continue;
    try{ RESULT_PATS.push(compilePattern(r.pattern)); }catch(err){ P.push("results.md: " + err.message); }
  }
  if(!RESULT_PATS.length) P.push("results.md: no usable pattern");
  const ign = (tableOf(rt, /^ignored/i) || []).map(r => (r.folder || "").replace(/^\/|\/$/g, "")).filter(Boolean);
  ARCHIVE_RE = ign.length ? new RegExp("(?:^|/)(" + ign.map(reEsc).join("|") + ")(?:/|$)", "i") : /$^/;

  /* investment.md: optional */
  invReset();
  if(T.investment){
    const it = mdTables(T.investment), all = {}, own = {};
    for(const r of tableOf(it, /^operational life$/i) || []){
      const t = (r.tech || "").toUpperCase(), v = cfgNum(r.life_years), who = (r.iso3 || "*").trim();
      if(!t || !(v > 0)) continue;
      if(who === "*" || who === "") all[t] = v;
      else if(ISO[who.toUpperCase()]) (own[ISO[who.toUpperCase()]] ||= {})[t] = v;
      else P.push(`investment.md: life row for unknown code "${who}"`);
    }
    for(const n of Object.values(ISO)) INV[n] = {life:{...all, ...(own[n] || {})}, pipe:[], src:"config/investment.md"};
    for(const r of tableOf(it, /^committed pipeline$/i) || []){
      const n = ISO[(r.iso3 || "").toUpperCase()];
      if(!n){ P.push(`investment.md: pipeline row for unknown code "${r.iso3}"`); continue; }
      const yr = parseInt(r.year, 10), mw = cfgNum(r.capacity_mw);
      if(!(yr > 0) || !(mw > 0)){ P.push(`investment.md: pipeline row "${r.plant}" has no year or MW`); continue; }
      INV[n].pipe.push({code:(r.tech || "").toUpperCase(), name:r.plant || "", year:yr, mw,
                        capex:cfgNum(r.capex_musd_per_gw), life:cfgNum(r.life_years)});
    }
    INV_SRC = "config/investment.md";
  }
  CFG.ok = FAMS.length > 0 && Object.keys(ISO).length > 0 && Object.keys(SCEN).length > 0 && RESULT_PATS.length > 0;
  return P;
}
/* One copy of each config file is read: the shallowest, so a stray copy
   deeper in the tree never wins. Config inside an ignored folder is skipped. */
async function readConfig(list){
  const rej = [], by = {};
  const depth = e => (e.path || e.name).split("/").length;
  for(const e of list.slice().sort((a, b) => depth(a) - depth(b))){
    const p = e.path || e.name;
    if(/(?:^|\/)(archive|archived|old|superseded)\//i.test(p)) continue;
    const k = CFG_RE.exec(p)[1].toLowerCase();
    if(by[k]){ rej.push(`${p} (${by[k].path || by[k].name} used instead)`); continue; }
    by[k] = e;
  }
  const T = {};
  for(const [k, e] of Object.entries(by)) T[k] = await e.file.text();
  CFG.files = Object.values(by).map(e => e.path || e.name);
  CFG.dir = (CFG.files[0] || "").replace(/[^/]*$/, "") || "config/";
  const need = CFG_NEED.filter(k => T[k] == null);
  if(need.length){ CFG.ok = false; CFG.problems = need.map(k => `config/${k}.md is missing`); return rej; }
  CFG.problems = applyConfig(T);
  if(CFG.problems.length) console.warn("Config problems:\n" + CFG.problems.join("\n"));
  return rej;
}
function cfgMissingNote(){
  return "No usable configuration. The linked folder must hold config/technologies.md, " +
    "config/countries.md, config/scenarios.md and config/results.md; link the repository " +
    "folder itself, not results/." + (CFG.problems.length ? " " + CFG.problems.join("; ") + "." : "");
}


/* Hover-card profiles: the Profiles table of config/countries.md. */
const PROFILE = {};

/* The hover card: country, a few figures, the mix bar, and what is loaded. */
function profileTT(name){
  const c = S.C[name], k = c ? c.order.length : 0;
  const pr = (c && c.profile) || PROFILE[name];
  const head = `<div class="tt-h">${esc(name)}</div>`;
  const load = `<div class="tt-l">${k ? k+" scenario"+(k===1?"":"s")+" loaded" : "no results loaded yet"}</div>`;
  if(!pr) return head + load;
  const rows = pr.rows.slice(0,7).map(([a,b])=>
    `<div class="tt-p"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join("");
  let bar = "";
  if(pr.mix){
    const tot = pr.mix.reduce((a,x)=>a+x.v,0) || 1;
    bar = `<div class="tt-mix">`+pr.mix.map(x=>
        `<i style="width:${(100*x.v/tot).toFixed(1)}%;background:${famColor(x.f)}" title="${esc(x.f)}"></i>`).join("")+
      `</div><div class="tt-mixl">`+pr.mix.map(x=>
        `<span><i style="background:${famColor(x.f)}"></i>${esc(x.f)}</span>`).join("")+`</div>`;
  }
  return head + rows + bar + load;
}

async function ingestFiles(entries){
  const note = document.getElementById("loadNote");
  note.textContent = "Reading " + entries.length + " file(s)…";
  busySay("Parsing " + entries.length + " file" + (entries.length===1?"":"s") + "…");
  await new Promise(r=>setTimeout(r,16));

  const accepted = [], rejected = [], profiles = {}, drFiles = [];
  /* Configuration first: which files are results, and what the codes in
     their names mean, is known only once config/ has been read. */
  const cfgList = entries.filter(e => CFG_RE.test(e.path || e.name));
  if(cfgList.length) rejected.push(...await readConfig(cfgList));
  else { CFG.ok = false; CFG.problems = ["no config/ folder under the linked folder"]; }
  S.readProblem = null;
  if(!CFG.ok){
    note.textContent = cfgMissingNote();
    S.readProblem = cfgMissingNote();
    S.rejected = (S.preSkipped||[]).concat(rejected); S.preSkipped = null;
    render(); return;
  }
  if(CFG.files.length) drFiles.push(CFG.dir);
  for(const e of entries){
    const p = e.path || e.name;
    if(CFG_RE.test(p)) continue;                    // read above
    const cm = CMT_RE.exec(e.name);
    if(cm){
      const iso = cm[1].toUpperCase();
      if(ISO[iso]){
        /* The file on disk wins: it is the shared record, and this browser's
           copy is only a cache of it. */
        const got = cmtFromMd(await e.file.text());
        if(Object.keys(got).length) CMT[ISO[iso]] = got; else delete CMT[ISO[iso]];
        cmtSave();
      } else rejected.push(e.name + " (unknown country code " + iso + ")");
      continue;
    }
    const c = classify(p, e.name);
    if(!c){ rejected.push(p); continue; }
    accepted.push({e, country: ISO[c.iso], key: c.key});
  }

  if(!accepted.length){
    note.textContent = `Configuration read from ${CFG.dir}, but no file matched the patterns in config/results.md` +
      (rejected.length ? ` (${rejected.length} .txt file${rejected.length===1?"":"s"} did not match).` : ".");
    S.readProblem = note.textContent;
    S.rejected = (S.preSkipped||[]).concat(rejected); S.preSkipped = null;
    render(); return;
  }

  if(S.sample){ S.C = {}; S.sample = false; S.sel = null; S.selC = null; }
  const wasSel = S.selC;          // the parse loop below overwrites S.selC
  let firstCountry = null;
  /* put() accumulates, which is correct for several technologies landing in
     one family and wrong for the same technology read twice. A scenario
     therefore takes exactly one file; a second is refused and named, never
     added on top of the first. */
  const dup = [];
  for(const {e, country, key} of accepted){
    if(!S.C[country]) S.C[country] = newCountry(country, country);
    if(!firstCountry) firstCountry = country;
    const c = S.C[country];
    useCountry(country);
    const seen = c.scen[key];
    if(seen && seen.files && seen.files.length){
      dup.push(`${country} ${key}: ${e.path||e.name} (already read from ${seen.files[0].path})`);
      rejected.push(`${e.path||e.name} — ${country} ${key} was already read from ${seen.files[0].path}`);
      continue;
    }
    const sc = c.scen[key] ||= (c.order.push(key), blankScen(key));
    (sc.files ||= []).push({path: e.path||e.name, bytes: e.file.size, at: e.file.lastModified});
    sc.resAt = e.file.lastModified;
    parseResultsTxt(await e.file.text(), sc);
  }
  S.dupFiles = dup;

  for(const [n,pr] of Object.entries(profiles)){
    if(!S.C[n]) S.C[n] = newCountry(n, n);
    S.C[n].profile = pr;
  }
  for(const c of Object.values(S.C)){
    c.order = Object.keys(c.scen).sort();
    for(const [k,sc] of Object.entries(c.scen)){
      /* Re-read every time: a rate that changed in config/scenarios.md has to
         reach a scenario that was already stamped on an earlier pass. */
      const d = drFor(c.name, k);
      if(d!=null){ sc.dr = d; sc.drSrc = drSrcFor(c.name, k); }
      if(!sc.desc){
        const s = SCEN[k], cs = s && CASES[s.case];
        sc.desc = (s && s.desc) || [(cs && cs.desc) || (s ? s.case : k),
                   s && s.variant ? (VARLABEL[s.variant] || s.variant).toLowerCase() : ""]
                   .filter(Boolean).join(" \u2014 ");
      }
    }
  }

  /* Opening a country for the reader is justified only when the choice is
     unambiguous: the country they already had open, or the single country in
     this read. With several, picking one is an arbitrary default, which is
     the thing this version removes. */
  const withRuns = Object.keys(S.C).filter(k => S.C[k].order.length);
  const pick = (wasSel && S.C[wasSel] && S.C[wasSel].order.length) ? wasSel
             : (withRuns.length === 1 ? withRuns[0] : null);
  if(pick) useCountry(pick);
  else { S.selC = null; S.caseName = ""; S.years = []; S.scen = {}; S.order = []; S.sel = null; }
  const nS = Object.values(S.C).reduce((a,c)=>a+c.order.length,0);
  const names = Object.entries(S.C).filter(([,c])=>c.order.length).map(([n,c])=>`${n} (${c.order.length})`);
  S.rejected = (S.preSkipped||[]).concat(rejected); S.preSkipped = null;
  if(S.dupFiles && S.dupFiles.length){
    console.warn("Duplicate scenario files ignored:\n" + S.dupFiles.join("\n"));
  }
  const ig = S.rejected.length;
  const nP = Object.values(S.C).filter(c=>c.profile).length;
  note.textContent = `${nS} scenario${nS===1?"":"s"}: ` + names.join(", ") +
    (nP ? ` \u00b7 ${nP} profile${nP===1?"":"s"}` : "") +
    (drFiles.length ? ` \u00b7 config from ${drFiles[0]}` : "") +
    (CFG.problems.length ? ` \u00b7 ${CFG.problems.length} config warning${CFG.problems.length===1?"":"s"} (Home, Files read)` : "") +
    (ig ? ` \u00b7 ${ig} other file${ig===1?"":"s"} ignored` : "");
  render();
}

/* ---- linked folder: pick the folder once, then Refresh re-reads it --------
   Chrome and Edge expose the File System Access API, which hands back a handle
   the page can keep. The handle survives a reload in IndexedDB, so Refresh
   re-reads the folder without a second file dialog. A browser cannot watch a
   folder on its own, so a re-read is always driven by the Refresh button.
   Where the API is missing (Firefox, Safari), the buttons fall back to a
   directory picker, which re-reads correctly but asks each time. */
const linkBtn = document.getElementById("linkBtn");
const refreshBtn = document.getElementById("refreshBtn");
const linkNote = document.getElementById("linkNote");
const dirIn = document.getElementById("dirIn");
const HAS_FSA = typeof window.showDirectoryPicker === "function";
const STRUCT_NOTE = 'Link the dashboard folder once, then Refresh re-reads it. ' +
  'It must hold <span class="mono">config/</span> (what to read) and the results files that ' +
  '<span class="mono">config/results.md</span> describes, for example ' +
  '<span class="mono">results/results_REF_LDR_XAA.txt</span>.';
let ROOT = null;

function idb(){
  return new Promise((res,rej)=>{
    /* Not the CVF dash's "moya-desk": file:// pages share one storage origin,
       so a shared name made each dashboard re-read the other's folder. */
    const r = indexedDB.open("osemosys-dash",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("h");
    r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error);
  });
}
async function saveRoot(h){ try{ const db=await idb();
  await new Promise(r=>{ const t=db.transaction("h","readwrite"); t.objectStore("h").put(h,"root"); t.oncomplete=r; t.onerror=r; });
}catch(e){} }
async function loadRoot(){ try{ const db=await idb();
  return await new Promise(r=>{ const t=db.transaction("h","readonly"); const q=t.objectStore("h").get("root");
    q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); });
}catch(e){ return null; } }

/* The walk keeps the config files, the review comments the dashboard writes
   back, and every .txt; which .txt are results is decided after config/ has
   been read. Nothing else is opened. */
const WANTED = (n, path) => CFG_RE.test(path || n) || CMT_RE.test(n) || /\.txt$/i.test(n);
/* The country a file speaks for: from its ISO3 code, or failing that from the
   folder it sits in. Used to scope a refresh to the country on screen. */
function countryOfFile(name, path){
  const c = classify(path || name, name);
  if(c && ISO[c.iso]) return ISO[c.iso];
  const m = CMT_RE.exec(name);
  if(m && ISO[m[1].toUpperCase()]) return ISO[m[1].toUpperCase()];
  return null;
}
async function walkDir(dir, prefix, out, skipped, depth=0){
  if(depth > 4) return;
  for await (const [name, h] of dir.entries()){
    if(name.startsWith("~$") || name.startsWith(".")) continue;
    if(h.kind === "file"){
      if(!WANTED(name, prefix + name)){ skipped.push(prefix + name); continue; }
      out.push({name, path: prefix + name, file: await h.getFile()});
    } else await walkDir(h, prefix + name + "/", out, skipped, depth+1);
  }
}
async function scanRoot(){
  if(!ROOT) return;
  try{ await scanRootInner(); } finally { busyOff(); }
}
async function scanRootInner(){
  const perm = await ROOT.queryPermission({mode:"read"});
  if(perm !== "granted"){
    const ask = await ROOT.requestPermission({mode:"read"});
    if(ask !== "granted"){ linkNote.textContent = "Folder access was declined. Click Link to choose the folder again.";
      S.readProblem = "Folder access was declined."; render(); return; }
  }
  linkNote.textContent = "Reading " + ROOT.name + "…";
  busyOn("Reading " + ROOT.name, "Walking the folder…");
  const out = [], skipped = [];
  await walkDir(ROOT, "", out, skipped);
  S.preSkipped = skipped;
  // A refresh re-reads the folder; it is not a reason to move the reader. Hold
  // the open country, scenario and tab, and restore them if they still exist.
  const keep = {c:S.selC, s:S.sel, tab:S.tab};
  /* Scope: refreshing with a country open re-reads that country alone — the
     common case after one new model run, and much less parsing.
     Refreshing from the landing view re-reads everything. */
  const only = (S.tab !== "home" && S.selC && !S.sample) ? S.selC : null;
  let list = out;
  if(only){
    /* Config belongs to no country, so it rides along with every scoped
       refresh; a change to it applies at once. */
    list = out.filter(e => CFG_RE.test(e.path || e.name) || countryOfFile(e.name, e.path) === only);
    if(!list.length){
      busyOff();
      linkNote.textContent = `No files for ${only} under ${ROOT.name}. Open Home and refresh to re-read every country.`;
      return;
    }
    busySay(`${only} only — ${list.length} file${list.length===1?"":"s"}`);
    delete S.C[only];                 // replace this country, keep the others
    S.sample = false; S.sel = null;
  } else {
    busySay(out.length + " file" + (out.length===1?"":"s") + " to parse");
    S.C = {}; S.sample = false; S.sel = null;   // a full refresh replaces
  }
  // config/ is re-read with every read, so a removed row stops applying at once
  await ingestFiles(list);
  if(keep.c && S.C[keep.c] && S.C[keep.c].order.length){
    S.sel = (keep.s && S.C[keep.c].scen[keep.s]) ? keep.s : null;
    useCountry(keep.c);
    if(keep.tab && keep.tab!=="home") S.tab = keep.tab;
    render();
  }
  linkNote.textContent = `Linked to ${ROOT.name} · ${only ? only+" re-read" : "all countries read"} ${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;
  busyOff();
}
linkBtn.onclick = async ()=>{
  if(!HAS_FSA){ dirIn.click(); return; }
  try{
    ROOT = await window.showDirectoryPicker({mode:"read"});
    await saveRoot(ROOT);
    refreshBtn.disabled = false;
    await scanRoot();
  }catch(e){ if(e && e.name !== "AbortError") linkNote.textContent = "Could not open that folder: " + e.message; }
};
refreshBtn.onclick = async ()=>{
  if(!HAS_FSA || !ROOT){ dirIn.click(); return; }
  refreshBtn.disabled = true; try{ await scanRoot(); } finally { refreshBtn.disabled = false; }
};
dirIn.addEventListener("change", e=>{
  const keep = {c:S.selC, s:S.sel, tab:S.tab};
  busyOn("Reading folder", "Parsing results…");
  S.C = {}; S.sample = false; S.sel = null;
  linkNote.textContent = "Folder read " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) +
    ". This browser cannot keep the folder, so Refresh will ask for it again.";
  refreshBtn.disabled = false;
  const picked = [...e.target.files];
  const rel = f => f.webkitRelativePath || f.name;
  S.preSkipped = picked.filter(f=>!WANTED(f.name, rel(f))).map(rel);
  ingestFiles(picked.filter(f=>WANTED(f.name, rel(f)))
    .map(f=>({name:f.name, path:f.webkitRelativePath||f.name, file:f})))
    .then(()=>{   // same rule as Refresh: re-reading is not a reason to move the reader
      if(keep.c && S.C[keep.c] && S.C[keep.c].order.length){
        S.sel = (keep.s && S.C[keep.c].scen[keep.s]) ? keep.s : null;
        useCountry(keep.c);
        if(keep.tab && keep.tab!=="home") S.tab = keep.tab;
        render();
      }
    })
    .finally(busyOff);
});
async function restoreLink(){
  if(!HAS_FSA){ linkNote.innerHTML = STRUCT_NOTE + ' This browser cannot keep the folder between reloads; Chrome and Edge can.'; return; }
  const h = await loadRoot();
  if(!h){ linkNote.innerHTML = STRUCT_NOTE; return; }
  ROOT = h; refreshBtn.disabled = false;
  const perm = await h.queryPermission({mode:"read"});
  if(perm === "granted") scanRoot();
  else{
    linkNote.textContent = `${h.name} is linked. Click Refresh to re-read it — the browser asks for permission once per session.`;
    if(S.tab === "home") render();        // queued until the opening ends, if it is still playing
  }
}

/* ============================ derivations ============================ */
const U = () => S.unit==="TWh" ? PJ2TWh : 1;
const UL = () => S.unit;
/* Power unit. Several of these systems peak under a gigawatt, where a GW axis
   rounds the whole fleet to zero, so the unit follows the country by default
   and the switch in the bar overrides it for the rest of the session. */
/* Share mode normalises a family stack to 100 % of its own year, for reading
   the mix rather than the volume. It applies only to charts that opt in. */
const SHARE = () => S.share === true;
function toShare(sers){
  const n = S.years.length;
  const tot = S.years.map((_,i)=> sers.reduce((a,x)=>a+(x.data[i]||0),0));
  return sers.map(x=>({...x, data:x.data.map((v,i)=> tot[i]>0 ? 100*(v||0)/tot[i] : 0)}));
}
const PW = () => S.pwr==="MW" ? 1000 : 1;
const PL = () => S.pwr;
const PD = (d) => S.pwr==="MW" ? Math.max(0, d-2) : d;   // fewer decimals once scaled
function autoPwr(c){
  let peak=0;
  for(const k of (c.order||[])){
    const cap=((c.scen||{})[k]||{}).cap||{};
    for(let i=0;i<(c.years||[]).length;i++){
      let t=0; for(const f in cap) t+=(cap[f][i]||0);
      if(t>peak) peak=t;
    }
  }
  return (peak>0 && peak<2) ? "MW" : "GW";
}
function sum(a){ return (a||[]).reduce((x,y)=>x+(y||0),0); }
function series(sc, block, fam){ return (sc[block]||{})[fam] || new Array(S.years.length).fill(0); }
function totalRow(sc, block, fams=FAMS){
  return S.years.map((_,i)=> fams.reduce((a,f)=> a + (series(sc,block,f)[i]||0), 0));
}
/* Years where the backstop ran, with the worst of them. */
function backstop(sc){
  const d = series(sc,"act",BACKSTOP_FAM);
  const hit = [];
  d.forEach((v,i)=>{ if((v||0) > 1e-6) hit.push({y:S.years[i], i, v}); });
  if(!hit.length) return null;
  const peak = hit.reduce((a,b)=> b.v>a.v ? b : a, hit[0]);
  return {hit, peak, total: hit.reduce((a,b)=>a+b.v,0)};
}
function genTotal(sc){ return totalRow(sc,"act",GENFAMS.filter(f=>!IMPORT_FAMS.has(f))); }
function busbar(sc){ return totalRow(sc,"act",GENFAMS); }
function keySeries(sc, block, order, varmap){
  const keys = order ? order.filter(k=>sum((sc[block]||{})[k])>0)
                     : Object.keys(sc[block]||{}).filter(k=>sum(sc[block][k])>0);
  return keys.map((k,i)=>({label:k, color: varmap&&varmap[k] ? css(varmap[k]) : css(["--c5","--c3","--c8","--c2","--c6","--c9","--c1"][i%7]),
    data:(sc[block]||{})[k]||[]}));
}
function emisTotal(sc){
  const n=S.years.length; const out=new Array(n).fill(0);
  for(const arr of Object.values(sc.emi||{})) arr.forEach((v,i)=>out[i]+=v||0);
  return out;
}
function intensity(sc, denomKey){
  const e = emisTotal(sc);
  const d = denomKey==="dom" ? genTotal(sc) : denomKey==="dem" ? (sc.dem||[]) : busbar(sc);
  return S.years.map((_,i)=>{ const gwh = (d[i]||0)*1000/3.6; return gwh>0 ? e[i]*1e6/gwh : null; });
}
/* The share plotted is the variable renewables only (vre = yes in
   config/technologies.md), not every renewable family. */
const VRE_FAMS = VRE;               // config/technologies.md, vre = yes
function vreShare(sc){
  const b = busbar(sc);
  return S.years.map((_,i)=>{
    const d = b[i] || 0;
    if(!(d > 0)) return 0;
    return VRE_FAMS.reduce((a,f)=>a+(series(sc,"act",f)[i]||0), 0) / d * 100;
  });
}
function costRows(sc){
  const cap = totalRow(sc,"capex"), fo = totalRow(sc,"fom"), vo = totalRow(sc,"vom");
  return {cap, fo, vo};
}

/* ============================ chart engine ============================ */
const TT = document.getElementById("tt");
function showTT(html, x, y){ TT.innerHTML=html; TT.classList.add("on");
  const r=TT.getBoundingClientRect();
  TT.style.left = Math.min(x+14, innerWidth-r.width-8)+"px";
  TT.style.top  = Math.min(y+14, innerHeight-r.height-8)+"px"; }
function hideTT(){ TT.classList.remove("on"); }

function axisLabel(unit, P, H){
  if(!unit) return "";
  const mid = (P.t + (H - P.b)) / 2;
  return `<text class="axl" transform="translate(15 ${mid}) rotate(-90)" text-anchor="middle">${esc(unit)}</text>`;
}
/* Decimals for an axis tick: enough that consecutive ticks cannot print the
   same number. The step, not the maximum, is what sets this. */
function axDec(max){
  const step = Math.abs(max) / 4;
  return step >= 10 ? 0 : step >= 1 ? 1 : step >= 0.1 ? 2 : 3;
}
function niceMax(v){
  if(!(v>0)) return 1;
  const e=Math.pow(10,Math.floor(Math.log10(v))), n=v/e;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*e;
}
/* Marked years carry their stack total above the column, so the headline
   numbers can be read off the chart without hovering: 2020 as the calibrated
   starting point, 2025 as the anchor the net-zero path descends from, then
   each decade. */
const MILES = new Set(["2020","2026","2030","2035","2040","2045","2050"]);
/* One set everywhere, so a figure read off one chart can be lined up against
   the same year on any other. */
const MILES_EMIS = MILES, MILES_RE = MILES;
/* A red triangle over every year the backstop ran, above the stack so it is
   the first thing the eye meets. */
function shortfallMarks(sers, X, top, scale){
  const bs = sers.find(s=>s.label===BACKSTOP_FAM);
  if(!bs) return "";
  let o="";
  bs.data.forEach((v,i)=>{
    if(!((v||0) > 1e-6)) return;
    const val=(v||0)*(scale||1);
    const tip = `<div class="tt-h">${S.years[i]} · supply shortfall</div>`+
      `<div class="tt-r"><span>Unserved demand</span><b>${fmt(val, val<1?2:1)}</b></div>`+
      `<div class="tt-r">The backstop ran, so the system could not meet demand in this year.</div>`;
    o += `<g class="bkmark" data-tt="${esc(tip)}">`+
         `<path d="M${(X(i)-5).toFixed(1)},${top+9} L${X(i).toFixed(1)},${top} L${(X(i)+5).toFixed(1)},${top+9} Z"/>`+
         `<text x="${X(i).toFixed(1)}" y="${top+7.6}" text-anchor="middle">!</text></g>`;
  });
  return o;
}
function milestoneTotals(tot, X, Y, scale, top, years){
  if(years === null) return "";     // share mode: every total is 100
  const M = years || MILES;
  let o="";
  S.years.forEach((y,i)=>{
    if(!M.has(String(y))) return;
    const v=(tot[i]||0)*(scale||1); if(!isFinite(v)||v<=0) return;
    // A value under one rounds to zero at no decimals, which reads as "none"
    // rather than "small" — the difference matters on an emission path.
    const d = v<1 ? 2 : v<10 ? 1 : 0;
    o += `<text class="mt" x="${X(i)}" y="${Math.max(top-1, Y(tot[i])-7)}" text-anchor="middle">${fmt(v,d)}</text>`;
  });
  return o;
}
function svgEl(w,h){ return `<svg viewBox="0 0 ${w} ${h}" role="img" preserveAspectRatio="xMidYMid meet">`; }

/** Stacked area over years. sers = [{label,color,data[]}] */
function stackedArea(sers, opts={}){
  if(S.form==="bars") return stackedBars(sers, opts);
  sers = visible(sers);
  if(opts.share && SHARE()){ sers = toShare(sers); opts = {...opts, unit:"% of total", scale:1, miles:null, max:100}; }
  const W=760, H=opts.h||272, P={l:68,r:16,t:12,b:28};
  const n=S.years.length; if(!n) return "";
  const tot = S.years.map((_,i)=> sers.reduce((a,s)=>a+(s.data[i]||0),0));
  const max = opts.max!=null ? opts.max : (niceMax(Math.max(...tot,0)) || 1);
  const X=i=> P.l + (W-P.l-P.r)*(n>1? i/(n-1):0.5);
  const Y=v=> H-P.b - (H-P.t-P.b)*(v/max);
  let out = svgEl(W,H);
  for(let g=0; g<=4; g++){
    const v=max*g/4, y=Y(v);
    out += `<line class="gl" x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}"/>`;
    out += `<text class="ax" x="${P.l-7}" y="${y+3.5}" text-anchor="end">${fmt(v*(opts.scale||1),axDec(max*(opts.scale||1)))}</text>`;
  }
  const base = new Array(n).fill(0);
  sers.forEach(s=>{
    const top = base.map((b,i)=> b + (s.data[i]||0));
    let d = `M ${X(0)} ${Y(base[0])}`;
    for(let i=0;i<n;i++) d += ` L ${X(i)} ${Y(top[i])}`;
    for(let i=n-1;i>=0;i--) d += ` L ${X(i)} ${Y(base[i])}`;
    d += " Z";
    out += `<path class="mk-area" d="${d}" fill="${s.color}" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>`;
    for(let i=0;i<n;i++) base[i]=top[i];
  });
  // x labels every 5 years
  S.years.forEach((y,i)=>{ if(i%5===0||i===n-1)
    out += `<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${y}</text>`; });
  out += milestoneTotals(tot, X, Y, opts.scale, P.t, opts.miles);
  out += shortfallMarks(sers, X, P.t-9, opts.scale);
  out += axisLabel(opts.unit, P, H);
  // hover columns
  for(let i=0;i<n;i++){
    const rows = sers.filter(s=>(s.data[i]||0)>0.0005).reverse()
      .map(s=>`<div class="tt-r"><span><i style="background:${s.color}"></i>${esc(s.label)}</span><b>${fmt((s.data[i])*(opts.scale||1),1)}</b></div>`).join("");
    const html = `<div class="tt-h">${S.years[i]} &middot; total ${fmt(tot[i]*(opts.scale||1),1)} ${esc(opts.unit||"")}</div>${rows||'<div class="tt-r">no output</div>'}`;
    const w=(W-P.l-P.r)/Math.max(n-1,1);
    out += `<rect x="${X(i)-w/2}" y="${P.t}" width="${w}" height="${H-P.t-P.b}" fill="transparent"
      data-tt="${esc(html).replace(/"/g,'&quot;')}"/>`;
  }
  return out+"</svg>";
}

/** Multi-line chart. sers=[{label,color,data[],dash}] */
function lineChart(sers, opts={}){
  sers = visible(sers);
  const W=760,H=opts.h||272,P={l:68,r:16,t:12,b:28};
  const n=S.years.length; if(!n) return "";
  let max=0,min=0;
  sers.forEach(s=>s.data.forEach(v=>{ if(v==null)return; if(v>max)max=v; if(v<min)min=v; }));
  max = opts.max!=null?opts.max:niceMax(max)||1;
  const X=i=>P.l+(W-P.l-P.r)*(n>1?i/(n-1):0.5), Y=v=>H-P.b-(H-P.t-P.b)*((v-min)/(max-min||1));
  let out=svgEl(W,H);
  for(let g=0;g<=4;g++){ const v=min+(max-min)*g/4,y=Y(v);
    out+=`<line class="gl" x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}"/>`;
    out+=`<text class="ax" x="${P.l-7}" y="${y+3.5}" text-anchor="end">${fmt(v,v<10?1:0)}</text>`; }
  sers.forEach(s=>{
    let d="",open=false;
    s.data.forEach((v,i)=>{ if(v==null){open=false;return;} d += (open?" L ":" M ")+X(i)+" "+Y(v); open=true; });
    /* pathLength normalises the line to 1 so one dash rule draws any of them. */
    /* pathLength normalises a solid line to 1 so one rule draws any of them.
       It must NOT go on a dashed line: pathLength rescales the units the dash
       pattern is measured in, so a 7-unit dash becomes seven times the whole
       path and the line renders solid. Dashed series fade in instead. */
    if(d) out+=`<path class="${s.dash?"mk-dash":"mk-line"}"${s.dash?"":' pathLength="1"'} d="${d.trim()}" fill="none"
      stroke="${s.color}" stroke-width="${s.dash?2.2:2}"
      stroke-linecap="${s.dash?"butt":"round"}" stroke-linejoin="round"${s.dash?' stroke-dasharray="7 5.5"':''}/>`;
    const last=[...s.data].map((v,i)=>[v,i]).filter(a=>a[0]!=null).pop();
    if(last) out+=`<circle cx="${X(last[1])}" cy="${Y(last[0])}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  S.years.forEach((y,i)=>{ if(i%5===0||i===n-1)
    out+=`<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${y}</text>`; });
  /* Only the leading solid series is annotated: labelling every line at four
     years turns a comparison chart into a table. */
  if(opts.miles){
    const lead = sers.find(s=>!s.dash) || sers[0];
    if(lead) out += milestoneTotals(lead.data, X, Y, 1, P.t, opts.miles);
  }
  out += axisLabel(opts.unit, P, H);
  for(let i=0;i<n;i++){
    const rows=sers.map(s=>s.data[i]==null?"":`<div class="tt-r"><span><i style="background:${s.color}"></i>${esc(s.label)}</span><b>${fmt(s.data[i],1)}</b></div>`).join("");
    const html=`<div class="tt-h">${S.years[i]}</div>${rows}`;
    const w=(W-P.l-P.r)/Math.max(n-1,1);
    out+=`<rect x="${X(i)-w/2}" y="${P.t}" width="${w}" height="${H-P.t-P.b}" fill="transparent"
      data-tt="${esc(html).replace(/"/g,'&quot;')}"/>`;
  }
  return out+"</svg>";
}

/** Stacked column chart over years */
function stackedBars(sers, opts={}){
  sers = visible(sers);
  if(opts.share && SHARE()){ sers = toShare(sers); opts = {...opts, unit:"% of total", scale:1, miles:null, max:100}; }
  const W=760,H=opts.h||272,P={l:68,r:16,t:12,b:28};
  const n=S.years.length; if(!n) return "";
  const tot=S.years.map((_,i)=>sers.reduce((a,s)=>a+(s.data[i]||0),0));
  const max=opts.max!=null ? opts.max : (niceMax(Math.max(...tot,0))||1);
  const bw=Math.max(2,(W-P.l-P.r)/n*0.68);
  const X=i=>P.l+(W-P.l-P.r)*((i+0.5)/n), Y=v=>H-P.b-(H-P.t-P.b)*(v/max);
  let out=svgEl(W,H);
  for(let g=0;g<=4;g++){ const v=max*g/4,y=Y(v);
    out+=`<line class="gl" x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}"/>`;
    out+=`<text class="ax" x="${P.l-7}" y="${y+3.5}" text-anchor="end">${fmt(v,axDec(max))}</text>`; }
  const base=new Array(n).fill(0);
  sers.forEach(s=>{
    s.data.forEach((v,i)=>{ v=v||0; if(v<=0) return;
      const y0=Y(base[i]+v), y1=Y(base[i]), h=Math.max(1,y1-y0);
      out+=`<rect class="mk-bar" style="--bi:${Math.min(i,26)}" x="${X(i)-bw/2}" y="${y0}"
        width="${bw}" height="${h}" rx="1.5" fill="${s.color}"
        stroke="var(--surface)" stroke-width="1"/>`;

}

/* Series selection is global to the view: isolating Solar isolates it on every
   chart on the page, which is what makes cross-chart reading possible. Click
   isolates, a second click on the same entry restores, Ctrl or Cmd click hides
   one series at a time. */
function visible(sers){
  let out = sers;
  if(S.iso!=null && sers.some(s=>s.label===S.iso)) out = out.filter(s=>s.label===S.iso);
  if(S.hidden.size) out = out.filter(s=>!S.hidden.has(s.label));
  return out.length ? out : sers;
}
function legend(sers){
  return `<div class="legend">`+sers.map(s=>{
    const off = (S.iso!=null && sers.some(x=>x.label===S.iso) && s.label!==S.iso) || S.hidden.has(s.label);
    return `<button class="lgb${off?" off":""}" data-ser="${esc(s.label)}"
      aria-pressed="${!off}" title="Click to isolate &middot; Ctrl-click to hide">
      <i style="background:${s.color}"></i>${esc(s.label)}</button>`;
  }).join("")+`</div>`;
}
function famSeries(sc, block, scale=1){
  return FAMS.filter(f=>sum(series(sc,block,f))>0)
    .map(f=>({label:f, color:famColor(f), data:series(sc,block,f).map(v=>v*scale)}));
}

/* Tryout: country names set vertically, reading upward from the marker, the
   way a narrow feature is labelled on a printed map. Flip to false for the
   horizontal placement, which uses each entry's anchor and offsets instead. */
const MAP_LABEL_VERTICAL = true;
/* Marker positions from config/countries.md: name -> [lat, lon, anchor, dx, dy]. */
const GEO = {};const COUNTRY_ART = {};          /* no silhouettes: a generic marker is drawn instead */

const mapX = lon => (lon+180)/360*MAPW, mapY = lat => (90-lat)/180*MAPH;

/* Every scenario in memory with the file it came from. This is the audit trail:
   if a country shows more scenarios than expected, the duplicate filenames are
   visible here. */
function manifest(){
  const rows = [];
  for(const [n,c] of Object.entries(S.C))
    for(const k of c.order)
      for(const f of (S.C[n].scen[k].files || [{path:"(built-in sample)",bytes:null,at:null}]))
        rows.push([n,k,f.path,f.bytes,f.at]);
  const ign = (S.rejected||[]).length;
  const cfgP = CFG.problems.length ? `<div class="card wide"><h3 data-noscen>Configuration warnings</h3>
    <ul class="note">${CFG.problems.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>` : "";
  if(!rows.length) return cfgP + (ign ? `<div class="card wide"><h3 data-noscen>Nothing read</h3>
    <p class="note">${ign} file${ign===1?"":"s"} under the root were ignored. Results are read only where
    a path matches a pattern in <span class="mono">config/results.md</span>.</p></div>` : "");
  const dup = {};
  rows.forEach(r=>{ dup[r[0]+"|"+r[1]] = (dup[r[0]+"|"+r[1]]||0)+1; });
  const many = Object.values(dup).some(v=>v>1);
  return cfgP + `<div class="card wide"><details><summary>Files read &mdash; ${rows.length}${ign?` \u00b7 ${ign} ignored`:""}</summary>
    <div class="scroll" style="margin-top:10px"><table><thead><tr><th>Country</th><th>Scenario</th><th>File</th><th>Size</th><th>Modified</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="mono">${esc(r[1])}</td><td class="mono">${esc(r[2])}</td>
      <td class="mono">${r[3]!=null?(r[3]/1048576).toFixed(1)+" MB":"\u2013"}</td>
      <td class="mono">${r[4]?new Date(r[4]).toLocaleString(undefined,{dateStyle:"short",timeStyle:"short"}):"\u2013"}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note">One row per file. A scenario counted twice means two files resolved to the same
    country and scenario code${many?" \u2014 which is happening here, see the repeated codes above":""}.
    ${ign?`${ign} other file${ign===1?"":"s"} under the root were ignored, which is expected: documentation, scripts and model
    inputs are not results. `:""}Only files matching a pattern in <span class="mono">config/results.md</span> are read.</p></details></div>`;
}

function vHome(){
  const loaded = Object.entries(S.C).filter(([,c])=>c.order.length);
  const nS = loaded.reduce((a,[,c])=>a+c.order.length,0);
  const lightOrder = Object.keys(GEO).sort((a,b)=> GEO[b][0] - GEO[a][0]);
  const dots = Object.entries(GEO).map(([n,[lat,lon,anc,dx,dy]])=>{
    const c = S.C[n], k = c ? c.order.length : 0;
    const x = mapX(lon), y = mapY(lat);
    const tip = k ? n + ": " + k + " scenario" + (k===1?"":"s") + " loaded" : n + ": nothing loaded yet";
    const card = profileTT(n);   // esc() at the attribute does the quoting
    const cls = (k ? "on" : "off") + (n===S.selC && k ? " sel" : "");
    // The hover card hangs off the whole group, so pointing at the name works
    // as well as pointing at the dot; the label is what the eye lands on.
    return `<g class="pin ${cls}" data-country="${esc(n)}" tabindex="0" role="button"
      style="--i:${lightOrder.indexOf(n)}"
      aria-label="${esc(tip)}" data-tt="${esc(card)}">
      ${k?`<circle class="halo" cx="${x}" cy="${y}" r="10"/>`:""}
      <circle cx="${x}" cy="${y}" r="${k?4:2.4}"/>
      ${MAP_LABEL_VERTICAL
        ? `<text transform="translate(${x+(anc==="end"?-6:6)},${y-7}) rotate(-90)" text-anchor="start">${esc(n.toUpperCase())}</text>`
        : `<text x="${x+dx}" y="${y+dy}" text-anchor="${anc}">${esc(n.toUpperCase())}</text>`}
      <circle class="hit" cx="${x}" cy="${y}" r="13"></circle></g>`;
  }).join("");
  /* Until something is read, the page asks for that first; "click a country"
     only makes sense once there is something to open. */
  const realData = loaded.length > 0 && !S.readProblem;
  const ask = realData ? null : !HAS_FSA ? "drop" : ROOT ? "refresh" : "link";
  const loadCall = !ask ? "" : `<button class="callout loadcall" id="loadCall" type="button"
       data-act="${ask==="refresh" && !S.readProblem ? "refresh" : "link"}">
       <span class="led" aria-hidden="true"></span>
       <span>${S.readProblem ? "Nothing read from " + esc(ROOT ? ROOT.name : "that folder")
             : ask==="refresh" ? "Refresh to read " + esc(ROOT.name)
             : ask==="drop" ? "Choose your results folder"
             : "Connect your results folder"}
         <span class="sub">${S.readProblem ? esc(S.readProblem) + " Click to choose another folder."
             : ask==="refresh" ? "The browser asks for access once per session."
             : ask==="drop" ? "This browser cannot keep the folder linked; Chrome and Edge can."
             : "Results load from it, and Refresh re-reads it after each run."}</span></span></button>`;
  const hint = (S.hintOff || !realData) ? "" :
    `<div class="callout" id="mapHint">
       <span class="led" aria-hidden="true"></span>
       <span>${S.sample ? esc(S.sampleNote) + " " : ""}Click a country to explore its results.</span>
       <button class="x" id="hintX" aria-label="Dismiss">&times;</button></div>`;
  const pc = v => v.toFixed(2) + " %";
  const P = S.homePanel;
  const TABS_H = [["map","Reading the map"],["scen","Scenarios"],
                  ["files","Files read"],["load","Loading results"]];
  /* Rates as the charts use them: from config/scenarios.md, with the open
     country's own rates where it has any. Never typed here. */
  const scenRows = Object.entries(SCEN).map(([k,sv])=>{
    const r = S.selC ? drFor(S.selC, k) : (sv.rate != null ? sv.rate/100 : null);
    return `<tr><td class="mono">${esc(k)}${k===BASELINE?" (base)":""}</td><td>${esc(sv.case)}</td>
      <td>${esc(VARLABEL[sv.variant] || sv.variant || "")}</td><td class="mono">${r!=null?pc(r*100):"–"}</td></tr>`;
  }).join("");
  const panelScen = `
      <div class="scen2">${Object.entries(CASES).map(([k,c])=>`
        <div><div class="sh">${esc(k)}</div><p class="note">${esc(c.desc || "No description in config/scenarios.md.")}</p></div>`).join("")}
      </div>
      <table><thead><tr><th>Code</th><th>Case</th><th>Variant</th><th>Discount rate${S.selC ? " for " + esc(S.selC) : ""}</th></tr></thead><tbody>
        ${scenRows || `<tr><td colspan="4">No configuration read yet.</td></tr>`}
      </tbody></table>
      <p class="note">Read from <span class="mono">config/scenarios.md</span>. A results file does not record
      its own discount rate, so the scenario code in its name is what identifies it. A country rate there
      overrides the scenario rate${S.selC ? "" : "; open a country to see its own rates"}.</p>`;
  const panelMap = `<p class="note">A name in bold with a lit marker means results are loaded for that
      country; the brightest marker is the one currently open. Names in light type are countries listed in
      <span class="mono">config/countries.md</span> with nothing read yet. Click any marker to open it.
      Positions are the coordinates in that file, on an equirectangular grid.</p>`;
  const panelLoad = `<p class="note">Link the dashboard folder once; Refresh re-reads it after each model run.
      The folder must hold <span class="mono">config/</span>. Results are the <span class="mono">.txt</span>
      files whose path matches one of these patterns from <span class="mono">config/results.md</span>:
      ${RESULT_PATS.length ? RESULT_PATS.map(r=>`<span class="mono">${esc(r.src)}</span>`).join(", ")
        : "none read yet"}. One file per country and scenario.</p>`;
  const panel = P==="files" ? manifest()
    : P ? `<div class="card wide">${P==="map"?panelMap:P==="scen"?panelScen:panelLoad}</div>` : "";

  return `<div class="grid">
    <div class="mapfull${WORKING ? " working" : ""}">${hint}${loadCall}
      <div class="mapctl">
        <button class="ovl gico${ask && ask!=="refresh" ? " callme" : ""}" data-act="link" aria-label="Connect results root"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 13.6a4.3 4.3 0 0 0 6.1 0l2.9-2.9a4.3 4.3 0 1 0-6.1-6.1l-1.4 1.4"/><path d="M14.4 10.4a4.3 4.3 0 0 0-6.1 0l-2.9 2.9a4.3 4.3 0 1 0 6.1 6.1l1.4-1.4"/></svg><span class="gl">Connect results root</span></button>
        <button class="ovl gico${ask==="refresh" ? " callme" : ""}" data-act="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 11.4a8.2 8.2 0 1 0-.7 4.6"/><path d="M20.6 5.6v5.8h-5.8"/></svg><span class="gl">Refresh</span></button><span class="workdots"${WORKING?"":" hidden"} role="status" aria-label="Reading results"><i></i><i></i><i></i></span>
        <button class="ovl more" id="moreBtn" aria-expanded="${!!S.more}">${S.more?"Less":"More"}</button>
        <span class="ovl-note" id="ovlNote">${loaded.length} of ${Object.keys(ISO).length} loaded &middot; ${nS} scenario${nS===1?"":"s"}${S.sample?" &middot; sample":""}</span>
      </div>
      <canvas id="globe" class="globe" aria-hidden="true"></canvas>
      <svg id="worldMap" viewBox="-8 70 982 290" role="img" style="overflow:hidden;max-height:none"
           aria-label="World map with the study countries marked">
        <rect x="-8" y="0" width="982" height="480" fill="var(--surface-2)"/>
        <path d="${LAND}" fill="var(--line)" fill-opacity="0.5" stroke="var(--ink-3)"
              stroke-width="0.35" stroke-opacity="0.2"/>
        ${dots}
      </svg>
    </div>

    ${S.more ? `<div class="homebar">${TABS_H.map(([k,l])=>
        `<button class="hbtn" data-panel="${k}" aria-expanded="${P===k}">${l}</button>`).join("")}</div>` : ""}
    ${S.more ? panel : ""}
  </div>`;
}

const TABS = [["home","Home"],["overview","Overview"],["generation","Generation"],["capacity","Capacity"],
  ["techresp","Tech Response"],
  ["costs","Costs"],["emissions","Emissions"]];

/* How to read each chart. Keyed on the heading text up to the first comma, with
   a trailing year stripped, so a heading that interpolates a unit or a year
   still resolves. Kept to what the reader must do with their eyes: which
   direction carries the claim, and what a shape means. */
const CHART_INFO = {
"Response of each technology to the discount rate":
 "One panel per family, and the horizontal axis is the rate itself rather than the run's name, so the runs become points on a response curve. Read the shape: a straight line is a proportional response, a bend means the technology crosses a threshold somewhere in that range, and a flat line means the discount rate does not reach this family at all. The panels are ordered by how much each one moves, so anything worth looking at is first. A family whose capacity is fixed by a bound will read as flat however sensitive its economics are — flat here means unmoved, not insensitive.",
"Sensitivity to the discount rate":
 "The bar is the capacity at the highest rate minus the capacity at the lowest, so right means the technology is built more when capital is dearer and left means less. Judge the bars against each other, not against the ring of families: a family missing from this chart moved by less than five megawatts. The percentage in the margin is that change against the low-rate run, so a large percentage on a small technology can still be a small number of megawatts.",
