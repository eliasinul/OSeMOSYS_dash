function tile(label, value, unit, detail){
  return `<div class="tile"><span class="t-l">${esc(label)}</span>
    <span class="t-v mono">${value}</span><span class="t-u">${esc(unit||"")}</span>
    ${detail?`<span class="t-d">${detail}</span>`:""}</div>`;
}

/* ---- the tightest slice --------------------------------------------------
   A system is not tested at the moment demand is highest; it is tested at the
   moment the demand left over for dispatchable plant is highest. In a solar
   system those are rarely the same slice: demand can peak in a
   daytime slice where most of the solar is running and the batteries are
   charging. The slice picked below is the one with the largest residual load,
   demand minus the output of solar and wind, which is where adequacy is
   actually decided. */
const VARFAM = VRE_SET;
function tightSlice(sc){
  if(!sc || !sc.tsDem || !sc.tsGen) return null;
  const slices = Object.keys(sc.tsDem);
  if(!slices.length) return null;
  const n = S.years.length;
  const pick = new Array(n).fill(null), dem = new Array(n).fill(0), res = new Array(n).fill(0);
  for(let i=0;i<n;i++){
    let best = null, bestRes = -Infinity;
    for(const ts of slices){
      const d = sc.tsDem[ts][i] || 0;
      if(d <= 0) continue;
      let vre = 0;
      for(const f of VARFAM){ const g = sc.tsGen[f]; if(g && g[ts]) vre += g[ts][i] || 0; }
      const r = d - vre;
      if(r > bestRes){ bestRes = r; best = ts; }
    }
    if(best){ pick[i] = best; dem[i] = sc.tsDem[best][i] || 0; res[i] = Math.max(bestRes, 0); }
  }
  return {slices, pick, dem, res};
}
/* What ran, family by family, in that slice of each year. */
function tightStack(sc, T, scale){
  const n = S.years.length, out = [];
  for(const f of FAMS){
    /* The stores stay in here: at the tightest slice what matters is what was
       serving load, and discharge is part of that answer. */
    const g = sc.tsGen[f]; if(!g) continue;
    const data = new Array(n).fill(0);
    let any = false;
    for(let i=0;i<n;i++){
      const ts = T.pick[i]; if(!ts || !g[ts]) continue;
      const v = (g[ts][i] || 0) * scale;
      data[i] = v; if(v > 1e-9) any = true;
    }
    if(any) out.push({label:f, color:famColor(f), data});
  }
  return out;
}

/* Stacked columns with a line laid over them. The overlay is the demand the
   stack has to reach, so the two must share one scale and one chart. */
function stackVsLine(sers, line, opts={}){
  sers = visible(sers);
  const W=760, H=opts.h||286, P={l:68,r:16,t:16,b:30};
  const n=S.years.length; if(!n) return "";
  const tot = S.years.map((_,i)=> sers.reduce((a,s)=>a+(s.data[i]||0),0));
  const max = niceMax(Math.max(...tot, ...line.map(v=>v||0), 0)) || 1;
  const X=i=> P.l + (W-P.l-P.r)*(n>1? i/(n-1):0.5);
  const Y=v=> H-P.b - (H-P.t-P.b)*(v/max);
  const bw = Math.max(2.5, Math.min(14, (W-P.l-P.r)/Math.max(n,1) - 2.2));
  let out = svgEl(W,H);
  for(let g=0; g<=4; g++){
    const v=max*g/4, y=Y(v);
    out += `<line class="gl" x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}"/>`;
    out += `<text class="ax" x="${P.l-7}" y="${y+3.5}" text-anchor="end">${fmt(v,max<4?1:0)}</text>`;
  }
  const base = new Array(n).fill(0);
  sers.forEach(sr=>{
    sr.data.forEach((v,i)=>{ v=v||0; if(v<=0) return;
      const y0=Y(base[i]+v), y1=Y(base[i]), h=Math.max(1,y1-y0);
      out += `<rect class="mk-bar" style="--bi:${Math.min(i,26)}" x="${(X(i)-bw/2).toFixed(1)}" y="${y0.toFixed(1)}"
        width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${sr.color}"
        stroke="var(--surface)" stroke-width="1"/>`;
      base[i]+=v; });
  });
  let d = "";
  line.forEach((v,i)=>{ if(v==null) return; d += (d?" L ":"M ")+X(i).toFixed(1)+" "+Y(v).toFixed(1); });
  /* mk-dash fades in rather than drawing itself: the draw-in animation sets a
     dash pattern of its own, which would overwrite this one. */
  if(d) out += `<path class="mk-dash" d="${d}" fill="none" stroke="${opts.lineColor||css("--ink")}"
    stroke-width="2.2" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="7 5.5"/>`;
  S.years.forEach((y,i)=>{ if(i%5===0||i===n-1)
    out += `<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${y}</text>`; });
  out += axisLabel(opts.unit, P, H);
  for(let i=0;i<n;i++){
    const rows = sers.filter(sr=>(sr.data[i]||0)>0.0005).reverse()
      .map(sr=>`<div class="tt-r"><span><i style="background:${sr.color}"></i>${esc(sr.label)}</span><b>${fmt(sr.data[i],2)}</b></div>`).join("");
    const head = `<div class="tt-h">${S.years[i]}${opts.slice&&opts.slice[i]?" &middot; slice "+esc(opts.slice[i]):""}</div>`;
    const foot = `<div class="tt-r"><span>${esc(opts.lineLabel||"demand")}</span><b>${fmt(line[i]||0,2)}</b></div>`;
    const w=(W-P.l-P.r)/Math.max(n-1,1);
    out += `<rect x="${(X(i)-w/2).toFixed(1)}" y="${P.t}" width="${w.toFixed(1)}" height="${H-P.t-P.b}" fill="transparent"
      data-tt="${esc(head+rows+foot).replace(/"/g,'&quot;')}"/>`;
  }
  return out+"</svg>";
}

/* One ring. Segments are stroked arcs on a single circle, which keeps the
   whole chart to one path per family and needs no arc geometry: the dash
   pattern does the work, and the year sits in the middle where the eye
   already is. */
function donut(parts, year, sub){
  const tot = parts.reduce((a,p)=>a+p.v, 0);
  const R = 32, SW = 14;
  if(!(tot > 0)) return `<svg class="dring" viewBox="0 0 100 100" role="img"
    aria-label="No data for ${year}"><circle cx="50" cy="50" r="${R}" fill="none"
    stroke="var(--line)" stroke-width="${SW}"/><text x="50" y="53" text-anchor="middle"
    class="yr" font-size="17">${year}</text></svg>`;
  const C = 2*Math.PI*R;
  /* A wedge worth a per cent of the ring is two pixels of arc: true, and
     invisible. Rather than widen it, which would make the picture lie about
     the share, the small wedges are lifted out of the ring along their own
     mid-angle and given a spoke that reaches into the margin. The angle still
     carries the quantity; the offset only says where to look. */
  const MINOR = 0.045;
  const nMinor = parts.filter(p=>p.v/tot < MINOR).length;
  /* Every label sits on one circle outside the longest spoke, so no spoke can
     cross the text of the wedge below it. */
  const maxOff = 3.8 + Math.min(Math.max(nMinor-1,0), 4)*2.8;
  const labR = R + SW/2 + maxOff + 5.8;
  let at = 0, k = 0;                       // k counts the lifted wedges
  const segs = [], marks = [];
  for(const p of parts){
    const len = p.v/tot*C;
    const share = p.v/tot;
    const mid = (at + len/2)/C * 2*Math.PI - Math.PI/2;   // screen angle of the wedge
    const minor = share < MINOR;
    /* Small wedges sit next to each other, since the ring is ordered by size,
       so lifting them all by the same amount would only stack them on one
       another. Each successive one is lifted a little further, which fans them
       into separate ticks without touching any angle. */
    const mi = minor ? k++ : -1;                    // this wedge's place in the fan
    let off = minor ? 3.8 + Math.min(mi, 4)*2.8 : 0;
    /* A family picked in the legend is the one being asked about, so it comes
       out of the ring whatever its size, and the rest of the ring steps back.
       The ring is never re-based on the selection: a mix that changed its
       hundred per cent when a legend item was clicked would be telling a
       different story each time. */
    const picked = (S.iso != null && S.iso === p.label);
    if(picked) off += 7;
    const dx = Math.cos(mid)*off, dy = Math.sin(mid)*off;
    const gap = Math.min(0.7, len*0.3);
    const tip = esc(p.label + " \u2014 " + fmt(share*100, share<0.01?2:1) + "% (" +
                    fmt(p.v, p.v<10?2:0) + " " + p.unit + ")");
    const dimmed = (S.iso != null && S.iso !== p.label) || S.hidden.has(p.label);
    segs.push(`<circle class="seg${minor?" minor":""}${picked?" pick":""}${dimmed?" dim":""}"
      cx="50" cy="50" r="${R}" fill="none"
      stroke="${p.color}" stroke-width="${SW}"
      style="color:${p.color};--len:${(len-gap).toFixed(2)};--rest:${(C-len+gap).toFixed(2)};--C:${C.toFixed(2)};--si:${Math.min(segs.length,9)}"
      stroke-dasharray="${(len-gap).toFixed(2)} ${(C-len+gap).toFixed(2)}"
      stroke-dashoffset="${(-at).toFixed(2)}"
      transform="translate(${dx.toFixed(2)} ${dy.toFixed(2)}) rotate(-90 50 50)"
      data-tt="${tip}"></circle>`);
    /* A lifted wedge, or the one picked in the legend, gets a spoke into the
       margin with its share written at the end of it. The number is what the
       reader wanted when they went looking for a sliver; making them hover for
       it would only move the problem. */
    if(minor || picked){
      const r0 = R + SW/2 + off - 1, r1 = R + SW/2 + off + 3.4;
      /* The lifted wedges sit at almost the same bearing, so their labels
         would land on top of one another. Alternate ones are pushed sideways
         along the tangent, which separates the text without moving the spoke
         it belongs to. */
      /* The labels are laid out as one evenly spaced row on that circle, in
         the order the wedges appear, rather than alternating sides: alternating
         put the first and third label within a few units of each other, which
         is less than the width of the text they carry. */
      /* The row is spaced by the width of the text it carries, not by the
         number of wedges, so four labels are pushed further apart than two. */
      const nLab = Math.min(nMinor, 4);
      const step = nLab <= 2 ? 17 : nLab === 3 ? 15 : 13;
      const side = minor ? (mi - (nLab-1)/2) * step : 0;
      const lr = minor ? labR : r1 + 2.2;
      const lx = 50 + Math.cos(mid)*lr - Math.sin(mid)*side;
      const ly = 50 + Math.sin(mid)*lr + Math.cos(mid)*side;
      const right = minor ? side >= 0 : Math.cos(mid) >= 0;
      /* Past five lifted wedges the row of numbers becomes a smear; the rest
         keep their spoke and their hover, which is where the detail lives. */
      const lab = (minor && mi > 3) ? "" : fmt(share*100, share < 0.01 ? 2 : 1) + "%";
      marks.push(`<g class="mk${picked?" on":""}" data-tt="${tip}">
        <line x1="${(50+Math.cos(mid)*r0).toFixed(2)}" y1="${(50+Math.sin(mid)*r0).toFixed(2)}"
              x2="${(50+Math.cos(mid)*r1).toFixed(2)}" y2="${(50+Math.sin(mid)*r1).toFixed(2)}"
              stroke="${p.color}" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="${(50+Math.cos(mid)*r1).toFixed(2)}" cy="${(50+Math.sin(mid)*r1).toFixed(2)}"
                r="1.7" fill="${p.color}"/>
        <text class="mkl" x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" fill="${p.color}"
              text-anchor="${minor ? "middle" : (right?"start":"end")}" dominant-baseline="middle"
              font-size="${picked ? 5.6 : 4.4}">${lab}</text></g>`);
    }
    at += len;
  }
  const nm = marks.length;
  return `<svg class="dring" viewBox="0 0 100 100" role="img"
    aria-label="${esc(year + " mix: " + parts.slice(0,3).map(p=>p.label+" "+fmt(p.v/tot*100,0)+"%").join(", ") +
                 (nm ? "; " + nm + " share" + (nm===1?"":"s") + " under 5% marked outside the ring" : ""))}">
    ${segs.join("")}${marks.join("")}
    <text x="50" y="52" text-anchor="middle" class="yr" font-size="19">${year}</text>
    <text x="50" y="62" text-anchor="middle" class="sub">${esc(sub||"")}</text></svg>`;
}

/* The two middle years are chosen from their own halves of the horizon, so the
   four rings always read left to right in time however they are set. */
function mixYears(){
  /* The year axis is carried as strings elsewhere in this file; everything
     below compares numerically and hands a number back, which the caller
     turns into a string again to index the series. */
  const ys = S.years.map(Number);
  if(!ys.length) return null;
  const pick = (want, lo, hi) => {
    const band = ys.filter(y=>y>=lo && y<=hi);
    if(!band.length) return null;
    return band.includes(want) ? want : band.reduce((a,y)=>Math.abs(y-want)<Math.abs(a-want)?y:a, band[0]);
  };
  const first = ys.includes(2025) ? 2025 : ys[0];
  const last  = ys.includes(2050) ? 2050 : ys[ys.length-1];
  const m1 = pick(S.donY[0], 2026, 2035), m2 = pick(S.donY[1], 2036, 2049);
  return {first, last, m1, m2,
          band1: ys.filter(y=>y>=2026 && y<=2035),
          band2: ys.filter(y=>y>=2036 && y<=2049)};
}

function mixRow(sc, block, title, unit, scale, fams){
  const M = mixYears();
  if(!M) return "";
  const yi = y => S.years.indexOf(String(y));
  const cell = (y, ctrl) => {
    if(y == null || yi(y) < 0) return `<div class="dcell"><div class="dy">${ctrl}</div>
      <p class="note">no year in range</p></div>`;
    const i = yi(y);
    /* Wedges below a twentieth of a per cent are dropped: they cannot be seen,
       and each one still takes a hairline out of its neighbours. */
    const tot0 = fams.reduce((a,f)=>a+(series(sc,block,f)[i]||0), 0);
    const parts = fams.filter(f=>(series(sc,block,f)[i]||0) > tot0*0.0005)
      .map(f=>({label:f, color:famColor(f), v:series(sc,block,f)[i]*scale, unit}))
      .sort((a,b)=>b.v-a.v);
    const tot = parts.reduce((a,p)=>a+p.v,0);
    return `<div class="dcell"><div class="dy">${ctrl}</div>
      ${donut(parts, y, fmt(tot, tot<10?1:0) + " " + unit)}</div>`;
  };
  const sel = (which, band, cur) => band.length
    ? `<select data-don="${which}">${band.map(y=>`<option value="${y}"${y===cur?" selected":""}>${y}</option>`).join("")}</select>`
    : `<span class="lock">–</span>`;
  const parts0 = fams.filter(f=>sum(series(sc,block,f))>0).map(f=>({label:f,color:famColor(f)}));
  return `<div class="card wide mixrow">
    <h3><span class="hl">${title}</span></h3>
    ${legend(parts0)}
    <div class="donuts">
      ${cell(M.first, `<span class="lock">${M.first}</span>`)}
      ${cell(M.m1, sel(block+"1", M.band1, M.m1))}
      ${cell(M.m2, sel(block+"2", M.band2, M.m2))}
      ${cell(M.last, `<span class="lock">${M.last}</span>`)}
    </div></div>`;
}

  const sers=famSeries(sc,"act",u);
  const tiles = [
    tile("Supply "+S.years[last], fmt(bb[last]*u,0), ul+" supplied", "incl. imports"),
    tile("Capacity "+S.years[last], fmt(capT[last]*PW(),0), PL()+" installed"),
    tile("CO₂ emissions "+S.years[last], fmt(em[last],1), "Mt"),
    tile("Intensity "+S.years[last], fmt(it[last],0), "gCO₂/kWh", "per unit supplied"),
    tile("Solar and wind share", fmt(rs[last],0)+"%", "of supply "+S.years[last]),
    tile("Total discounted costs", sc.obj!=null?fmt(sc.obj,0):"–", "M USD"),

  const emSers=[{label:"Emissions",color:css("--c4"),data:em}];

  return `<div class="tiles">${tiles}</div>

    <div class="card wide cmt-card"><h3 data-noscen>Country review</h3>
      <p class="note">A note on ${esc(S.selC||"this country")} as a whole — assumptions to revisit,
      results to question, anything the next reader should know. Saved to
      <span class="mono">${CMT_DIR}/&lt;ISO&gt;_comments.md</span> under the results root.</p></div>
    <div class="card wide"><h3>Electricity supply by fuel family</h3>
      ${legend(sers)}${stackedArea(sers,{unit:ul,share:true})}
      <p class="note">Domestic generation plus imports, before transmission losses and exports.</p></div>
    <div class="card"><h3>CO₂ emissions</h3>
      ${legend(emSers)}${lineChart(emSers,{unit:"Mt CO₂",miles:MILES_EMIS})}
      <p class="note">Emissions are attached to fuel supply technologies, not to power plants. A dashed cap that the solid line touches is a binding constraint.</p></div>
    <div class="card"><h3>Solar and wind share of supply</h3>
      ${lineChart([{label:"Solar and wind share",color:css("--c8"),data:rs}],{unit:"%",max:100,miles:MILES_RE})}
      <p class="note">Hydro, wind, solar, biomass and geothermal as a share of domestic generation plus imports. Waste is excluded, since municipal waste is only partly biomass and carries a CO₂ factor in the model. Imports count as neither renewable nor fossil.</p></div>
  </div>`;
}

function vGeneration(sc){
  const u=U(), ul=UL();
  const sers=famSeries(sc,"act",u);
  // realised capacity factor
  const cfSers = GENFAMS.filter(f=>!IMPORT_FAMS.has(f) && sum(series(sc,"cap",f))>0).map(f=>({
    label:f, color:famColor(f),
    data:S.years.map((_,i)=>{ const c=series(sc,"cap",f)[i]||0, a=series(sc,"act",f)[i]||0;
      return c>0.01 ? Math.min(110, 100*a/(c*CAU)) : null; })
  }));
  const rows = FAMS.filter(f=>sum(series(sc,"act",f))>0).map(f=>{
    const d=series(sc,"act",f);
    return `<tr><td><span class="legend" style="display:inline-flex"><i style="background:${famColor(f)}"></i>${f}</span></td>`+
      [0,5,10,15,20,25,30].map(i=>`<td class="mono">${fmt((d[i]||0)*u,1)}</td>`).join("")+`</tr>`;
  }).join("");
  return `<div class="grid">
    <div class="card wide"><h3>Generation by fuel family</h3>${legend(sers)}${stackedArea(sers,{unit:ul,share:true})}</div>
    <div class="card wide"><h3>Generation at five-year steps, ${ul}</h3>
      <div class="scroll"><table><thead><tr><th>Fuel family</th>${[0,5,10,15,20,25,30].map(i=>`<th>${S.years[i]||""}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></div>
  </div>`;
}

function vCapacity(sc){
  const pw=PW(), pl=PL();
  const sers=famSeries(sc,"cap",pw);
  const add=famSeries(sc,"new",pw);
  // biggest single-year build
  let big={v:0};
  FAMS.forEach(f=>series(sc,"new",f).forEach((v,i)=>{ if(v>big.v) big={v,f,y:S.years[i]}; }));
  const capT=totalRow(sc,"cap");
  const idle = GENFAMS.filter(f=>!IMPORT_FAMS.has(f)).map(f=>{
    const c=series(sc,"cap",f), a=series(sc,"act",f), fo=series(sc,"fom",f);
    const n=S.years.length-1;
    return (c[n]>0.01 && (a[n]||0)<1e-4) ? {f, gw:c[n], fom:fo[n]||0} : null;
  }).filter(Boolean);
  /* Storage energy is reported in PJ, where a battery fleet rounds to zero on
     a PJ axis. Rescale to GWh, or MWh when even that is under one unit. */
  /* The model's technology codes are not reading matter: labels come from
     the Storage table of config/technologies.md. */
  const stgRaw = keySeries(sc,"stgcap").map(x=>({...x, label: STG_LABEL[x.label] || x.label}));
  const stgMax = Math.max(0, ...stgRaw.map(s=>Math.max(...s.data.map(v=>v||0))));
  const stgU = (stgMax*277.778 < 1) ? ["MWh", 277777.8] : ["GWh", 277.778];
  const stg = stgRaw.map(s=>({...s, data:s.data.map(v=>(v||0)*stgU[1])}));
  return `<div class="grid">
    <div class="card wide"><h3>Installed capacity by fuel family</h3>${legend(sers)}${stackedArea(sers,{unit:pl,share:true})}
      <p class="note">Hydro (pumped) is the pump-turbine unit and Battery storage the battery inverter:
      power ratings of the two stores, not generating plant. Neither appears in the generation or supply
      charts, because what they return to the grid was already counted when it was first generated.</p></div>
    ${stg.length?`<div class="card wide"><h3>New storage energy capacity</h3>${legend(stg)}
      ${stackedArea(stg,{unit:stgU[0]+" stored"})}
      <p class="note">Storage the model builds. A reservoir that already existed in the base year is not
      in this variable and so is not drawn; where one exists, read the duration from the model inputs
      instead. Distinct from the power rating of the machine that charges it — Battery storage and
      Hydro (pumped) on the chart above.
      The model reports this in PJ; it is shown here in ${stgU[0]} (1 PJ = 277.8 GWh), since a battery
      fleet rounds to zero on a PJ axis.</p></div>`:""}
    <div class="card wide"><h3>Capacity added each year</h3>${legend(add)}${stackedBars(add,{unit:pl+" added"})}
      <p class="note">Largest single-year addition: <b class="mono">${big.v?fmt(big.v*pw,PD(1))+" "+pl+" of "+big.f+" in "+big.y:"none"}</b>.
      Compare against what the supply chain can physically deliver. With no <span class="mono">TotalAnnualMaxCapacityInvestment</span> set, nothing in the model prevents a decade of building landing in one year.</p></div>
    <div class="card wide"><h3>Installed capacity at five-year steps, ${pl}</h3>
      <div class="scroll"><table><thead><tr><th>Fuel family</th>${[0,5,10,15,20,25,30].map(i=>`<th>${S.years[i]||""}</th>`).join("")}</tr></thead>
        <tbody>${FAMS.filter(f=>sum(series(sc,"cap",f))>0).map(f=>{
          const d=series(sc,"cap",f);
          return `<tr><td><span class="legend" style="display:inline-flex"><i style="background:${famColor(f)}"></i>${f}</span></td>`+
            [0,5,10,15,20,25,30].map(i=>`<td class="mono">${fmt((d[i]||0)*pw, PD(2))}</td>`).join("")+`</tr>`;
        }).join("")}</tbody></table></div></div>
    ${(()=>{
      /* Adequacy is a question about the peak, not the mean: a fleet that
         covers average load can still fail on the evening it is asked for its
         maximum. The peak comes from the demand technology's own rate in the
         busiest slice of each year. */
      const hasPk = Array.isArray(sc.peak) && sc.peak.some(v=>v>0);
      const demLine = hasPk ? sc.peak.map(v=>v/31.536*pw)
                            : (sc.dem||[]).map(v=>v/31.536*pw);
      const lbl = hasPk ? `Peak demand (${pl})` : `Average load (${pl})`;
      /* The reference line has to be legible against the fleet it is compared
         with; the muted grey disappeared on a dark background. */
      const demCol = css("--ink-2");
      const n = S.years.length-1;
      const capL = capT[n]*pw, demL = demLine[n]||0;
      const marg = demL>0 ? (capL/demL - 1)*100 : null;
      const lf = (hasPk && sc.peak[n]>0) ? (sc.dem&&sc.dem[n] ? sc.dem[n]/sc.peak[n]*100 : null) : null;
      return `<div class="card"><h3>Total capacity against peak demand</h3>
      ${legend([{label:`Capacity (${pl})`,color:css("--c5")},{label:lbl,color:demCol}])}
      ${lineChart([{label:`Capacity (${pl})`,color:css("--c5"),data:capT.map(v=>v*pw)},
        {label:lbl,color:demCol,data:demLine,dash:true}],{unit:pl})}
      <p class="note">${hasPk
        ? `Peak demand is the highest rate the load reaches in any time slice of the year, read from
           <span class="mono">RateOfTotalActivity</span> for <span class="mono">${esc(DEMAND_TECH||"")}</span>.
           ${marg!=null?`In ${S.years[n]} installed capacity is ${fmt(marg,0)}% above peak`:""}${
             lf!=null?`, and the load factor is ${fmt(lf,0)}%`:""}.
           The margin shown is nameplate, not firm: variable renewables contribute far less than their
           rating at the moment of peak, so a wide gap here is not by itself a comfortable reserve.`
        : `This run carries no time-slice detail, so the dashed line is final demand spread evenly over
           the year. Re-read the results file to get peak demand — it needs the
           <span class="mono">RateOfTotalActivity</span> rows.`}</p></div>`;
    })()}
    ${(()=>{
      const T = tightSlice(sc);
      if(!T || !T.pick.some(Boolean)) return "";
      const sers = tightStack(sc, T, pw/31.536);
      if(!sers.length) return "";
      const dem = T.dem.map(v=>v/31.536*pw);
      const n = S.years.length-1;
      const sup = sers.reduce((a,sr)=>a+(sr.data[n]||0), 0);
      const gap = sup - (dem[n]||0);
      const vre = sers.filter(sr=>VARFAM.has(sr.label)).reduce((a,sr)=>a+(sr.data[n]||0),0);
      const capN = capT[n]*pw;
      return `<div class="card wide"><h3>Supply in the tightest slice</h3>
        ${legend(sers.concat([{label:`Demand in that slice (${pl})`,color:css("--ink")}]))}
        ${stackVsLine(sers, dem, {unit:pl, lineLabel:`Demand (${pl})`, slice:T.pick})}
        <p class="note">For each year the dashed line is demand in the slice where the load left to
        dispatchable plant is largest \u2014 demand minus solar and wind \u2014 and the columns are what the
        solver actually ran in that same slice. In ${S.years[n]} that slice is
        <span class="mono">${esc(T.pick[n]||"")}</span>: ${fmt(dem[n],2)} ${pl} of demand met by
        ${fmt(sup,2)} ${pl} of generation${vre>0.005?`, of which ${fmt(vre,2)} ${pl} is solar and wind`:""}.
        ${gap>0.005?`The ${fmt(gap,2)} ${pl} above the line charges storage or is curtailed`
                   :gap<-0.005?`The ${fmt(-gap,2)} ${pl} below the line comes from storage discharge`
                   :"Generation meets the load exactly"}.
        Installed capacity in that year is ${fmt(capN,1)} ${pl}, so ${fmt(sup/capN*100,0)}% of the fleet
        is producing when the system is most stretched.</p></div>`;
    })()}
  </div>`;
}

/* ---- the cost window ------------------------------------------------------
   Costs are shown from 2025 onwards. The first model years are calibration:
   money committed before the period under question is not a result anyone is
   deciding on, and leaving it in lets the early years dominate every cost
   chart. Only this tab is windowed. A stock or an emission path is read from
   its start, so capacity, generation and emissions keep the whole horizon. */
let COST_FROM = "2025";           // config/dashboard.md, cost_from_year
function costFromIdx(){
  const i = S.years.indexOf(COST_FROM);
  return i > 0 ? i : 0;        // a run that starts at or after 2025 loses nothing
}

function vCosts(sc){
  const i0 = costFromIdx(), ALL = S.years;
  const w  = a => (a || []).slice(i0);              // one series, windowed
  const ws = a => sum(w(a));
  const win   = ss => ss.map(x => ({...x, data: w(x.data)}));
  const winNZ = ss => win(ss).filter(x => sum(x.data) > 0);
  const span  = ALL[i0] + "–" + ALL[ALL.length-1];

  /* Everything is built against the full-length arrays first, because the
     chart helpers read S.years and that is swapped for the window below. */
  const {cap,fo,vo} = costRows(sc);
  const fuelS0  = keySeries(sc,"fuel",FUELORDER,FUELVAR);
  const fuelTot = ALL.map((_,i)=> fuelS0.reduce((a,x)=>a+(x.data[i]||0),0));
  const capexF0 = famSeries(sc,"capex");
  const omF0    = FAMS.map(f=>({label:f, color:famColor(f),
    data: ALL.map((_,i)=>(series(sc,"fom",f)[i]||0)+(series(sc,"vom",f)[i]||0))}));
  const stgC0   = keySeries(sc,"stgcapex");

  const sers    = win([{label:"Capital",color:css("--c5"),data:cap},
                       {label:"Fixed O&M",color:css("--c3"),data:fo},
                       {label:"Fuel",color:css("--c1"),data:fuelTot}]);
  const capexF  = winNZ(capexF0);
  const omF     = winNZ(omF0);
  const fuelS   = winNZ(fuelS0);
  const stgCapex= winNZ(stgC0);

  /* Annualised capital charge, at this run's own rate. */
  const AC = annualisedCapital(sc, S.selC, sc.dr);
  let acSers = [];
  if(AC){
    const fams = FAMS.filter(f => f !== BACKSTOP_FAM);
    const pipeS = fams.filter(f => AC.pl[f]).map(f => ({label: f + " \u00b7 pipeline",
      color: tintOf(famColor(f), 0.45), data: AC.pl[f]}));
    const newS  = fams.filter(f => AC.nb[f]).map(f => ({label: f + " \u00b7 new build",
      color: famColor(f), data: AC.nb[f]}));
    acSers = winNZ(pipeS.concat(newS));          // committed base, then the model's additions
  }
  const acTot = s2 => Object.values(s2 || {}).reduce((a, arr) => a + ws(arr), 0);
  /* The same case at each of its discount rates. */
  const acRuns = AC ? drRuns(sc).map(R => {
    const A = annualisedCapital(R.sc, S.selC, R.rate/100);
    return {key:R.key, tag:R.tag, rate:R.rate, nb:A ? acTot(A.nb) : 0, pl:A ? acTot(A.pl) : 0};
  }) : [];
  const acMax = Math.max(1, ...acRuns.map(x => x.nb + x.pl));
  const acRows = acRuns.map(x => `<div style="display:flex;align-items:center;gap:10px;margin:5px 0">
      <span class="mono" style="width:150px;font-size:12px;${x.key===sc.name?"font-weight:600":"color:var(--ink-2)"}">${esc(x.tag)} &middot; ${x.rate.toFixed(2)}%</span>
      <span style="flex:1;display:flex;height:17px;border-radius:3px;overflow:hidden;background:var(--surface-2)">
        ${x.pl>0?`<i title="Pipeline: ${fmt(x.pl,0)} M USD" style="width:${100*x.pl/acMax}%;background:${tintOf(css("--c5"),0.45)};display:block"></i>`:""}
        ${x.nb>0?`<i title="New build: ${fmt(x.nb,0)} M USD" style="width:${100*x.nb/acMax}%;background:${css("--c5")};display:block"></i>`:""}
      </span>
      <span class="mono" style="width:112px;text-align:right;font-size:12px">${fmt(x.nb+x.pl,0)} M USD</span></div>`).join("");
  const tot     = [ws(cap), ws(fo), ws(vo), ws(fuelTot)];

  /* The cross-scenario bars are summed over the same window, so a scenario is
     never compared on a different period from the charts below it. */
  const cmp = S.order.map(k=>{ const s2 = S.scen[k], r = costRows(s2);
    const ft = ALL.map((_,i)=>Object.values(s2.fuel||{}).reduce((a,d)=>a+(d[i]||0),0));
    return {k, cap:ws(r.cap), fo:ws(r.fo), vo:ws(r.vo), fu:ws(ft)}; });
  const cmpMax = Math.max(...cmp.map(c=>c.cap+c.fo+c.vo+c.fu), 1);
  const cmpRows = cmp.map(c=>{
    const parts=[["Capital",c.cap,"--c5"],["Fixed O&M",c.fo,"--c3"],["Fuel",c.fu,"--c1"]];
    const t=c.cap+c.fo+c.vo+c.fu;
    return `<div style="display:flex;align-items:center;gap:10px;margin:5px 0">
      <span class="mono" style="width:86px;font-size:12px;${c.k===sc.name?"font-weight:600":"color:var(--ink-2)"}">${esc(c.k)}</span>
      <span style="flex:1;display:flex;height:17px;border-radius:3px;overflow:hidden;background:var(--surface-2)">
        ${parts.map(([l,v,cv])=>v>0?`<i title="${l}: ${fmt(v,0)}" style="width:${100*v/cmpMax}%;background:${css(cv)};display:block"></i>`:"").join("")}
      </span>
      <span class="mono" style="width:78px;text-align:right;font-size:12px">${fmt(t,0)}</span></div>`;
  }).join("");

  /* The charts and their tooltips take their x axis from S.years, so the
     window is handed to them the same way the data was. Restored in finally,
     because every other tab reads the full horizon from the same variable. */
  S.years = ALL.slice(i0);
  try{
    return `<div class="tiles">
    ${tile("Capital "+span, fmt(tot[0],0), "M USD", '<span class="undisc">undiscounted</span>')}
    ${tile("Fixed O&M "+span, fmt(tot[1],0), "M USD", '<span class="undisc">undiscounted</span>')}
    ${tile("Fuel "+span, fmt(tot[3],0), "M USD", '<span class="undisc">undiscounted</span>')}
    ${tile("Total discounted costs", sc.obj!=null?fmt(sc.obj,0):"–", "M USD", "whole horizon "+ALL[0]+"–"+ALL[ALL.length-1])}
  </div>
  <div class="grid">
    <div class="card wide"><h3 data-noscen>Total cost, all loaded scenarios<span class="undisc">undiscounted</span></h3>
      ${legend([{label:"Capital",color:css("--c5")},{label:"Fixed O&M",color:css("--c3")},
                {label:"Fuel",color:css("--c1")}])}
      <div>${cmpRows}</div>
      <p class="note"><span class="undisc">Undiscounted</span> totals over ${span}, bars to a common scale. Every figure on this tab
      is summed over that window; the objective value in the tile above is not, because the solver
      minimised it over the whole horizon and a results file cannot be re-based.</p></div>
    <div class="card wide"><h3>Annual system cost</h3>${legend(sers)}${stackedBars(sers,{unit:"M USD per year"})}
      <p class="note"><span class="undisc">Undiscounted</span> annual flows from ${ALL[i0]}. The objective value is the discounted total the solver minimised over the whole horizon, so it will not equal the sum of these bars.</p></div>
    ${AC ? `<div class="card wide"><h3>Annualised capital charge, new build and committed pipeline</h3>${legend(acSers)}
      ${stackedBars(acSers,{unit:"M USD per year"})}
      <p class="note">Capital as a yearly payment at ${(sc.dr*100).toFixed(2)}% over each plant's life, from ${ALL[i0]}.
      ${isDark() ? "Darker" : "Lighter"} shades are the committed pipeline, full shades what the model built. Whether each pipeline
      project has already secured financing at a locked-in rate is not sufficiently documented in public reports,
      so the pipeline is charged at the scenario rate.${AC.missing.length
        ? ` Not costed for want of an input: <span class="mono">${AC.missing.map(esc).join(", ")}</span>.` : ""}</p></div>`
    : `<div class="card wide"><h3 data-noscen>Annualised capital charge</h3>
      <p class="note">Needs <span class="mono">config/investment.md</span>, which carries plant lives and the
      committed pipeline with its capex. Add it to the linked folder, then press Refresh.${sc.dr==null?" This run also has no discount rate.":""}</p></div>`}
    ${acRuns.length>1 ? `<div class="card wide"><h3 data-noscen>Annualised capital charge by discount rate<span class="undisc">undiscounted</span></h3>
      ${legend([{label:"Committed pipeline",color:tintOf(css("--c5"),0.45)},{label:"New build",color:css("--c5")}])}
      <div>${acRows}</div>
      <p class="note">Each bar sums one run's annual capital payments over ${span}, <span class="undisc">undiscounted</span>. The pipeline is the
      same fleet in every run, so its change is the discount rate alone. Totals in M USD.
      Public reports do not document well enough whether each committed pipeline project has already secured
      financing at a locked-in rate; where it has, its real charge does not move with the scenario rate, and
      the pipeline segment overstates the effect of the rate.</p></div>` : ""}
    <div class="card wide"><h3>Capital investment by fuel family</h3>${legend(capexF)}${stackedBars(capexF,{unit:"M USD"})}
      <p class="note">Commitment year, not service life. Spending before ${ALL[i0]} is not shown.</p></div>
    ${stgCapex.length?`<div class="card wide"><h3>Capital investment in storage</h3>${legend(stgCapex)}
      ${stackedBars(stgCapex,{unit:"M USD"})}</div>`:""}
    <div class="card wide"><h3>Operating cost by fuel family</h3>${legend(omF)}${stackedBars(omF,{unit:"M USD per year"})}
      <p class="note">Fixed plus variable operating cost on the power plants. Fuel purchase is charged to the mining and import technologies and is shown separately below.</p></div>
    ${fuelS.length?`<div class="card wide"><h3>Fuel cost by fuel</h3>${legend(fuelS)}${stackedBars(fuelS,{unit:"M USD per year"})}</div>`:""}
  </div>`;
  } finally { S.years = ALL; }
}

function vEmissions(sc){
  const em=emisTotal(sc);
  const bySrc=Object.entries(sc.emi||{}).map(([t,d],k)=>({label:EF_LABEL[t]||t,
    color:css(FUELVAR[FUEL2[t]] || ["--c1","--c3","--c4","--c7","--c2"][k%5]),data:d}));
  const emSers=[{label:"Emissions",color:css("--c4"),data:em}];
  if(sc.aelim && sc.aelim.some(v=>v!=null)) emSers.push({label:"Annual cap",color:css("--ink-3"),data:sc.aelim,dash:true});
  const dens=[["bus","Busbar supply incl. imports"],["dom","Domestic generation only"],["dem","Final demand"]];
  const iSers=dens.map(([k,l],i)=>({label:l,color:[css("--c4"),css("--c5"),css("--c8")][i],data:intensity(sc,k)}));
  const last=S.years.length-1;
  const bind = sc.aelim ? S.years.map((_,i)=> sc.aelim[i]!=null && em[i] >= sc.aelim[i]*0.999) : [];
  const firstBind = bind.findIndex(Boolean);
  return `<div class="tiles">
    ${tile("CO₂ emissions "+S.years[last], fmt(em[last],2), "Mt")}
    ${tile("Peak CO₂", fmt(Math.max(...em),1), "Mt in "+S.years[em.indexOf(Math.max(...em))])}
    ${tile("Intensity "+S.years[last], fmt(intensity(sc,"bus")[last],0), "gCO₂/kWh supplied")}
  </div>
  <div class="grid">
    <div class="card wide"><h3>Emissions by fuel source</h3>${legend(bySrc)}${stackedArea(bySrc,{unit:"Mt CO₂",miles:MILES_EMIS})}
      <p class="note">Emission factors sit on the mining and import technologies, so this is a fuel-supply view. Electricity imports carry no factor, which is consistent with territorial accounting but means imported power is counted as zero-carbon.</p></div>

  </div>`;
}

/* The runs of one case differ only in the discount rate they were solved at.
   A country rate can fall below a shared one, so these charts are drawn
   against the rate, never against the order of the names. */
function drRuns(sc){
  const me = splitScen(sc.name);
  const out = [];
  if(!me) return out;
  for(const k of S.order){
    const m = splitScen(k);
    if(!m || m.case !== me.case || !m.variant) continue;
    const r = drFor(S.selC, k);
    if(r == null) continue;
    out.push({key:k, tag:m.variant, rate:r*100, sc:S.scen[k]});
  }
  return out.sort((a,b)=>a.rate-b.rate);
}
/* Capacity by family at one year, for each run, with the families that are zero
   everywhere dropped. */
function drTable(runs, block, yi, scale){
  const fams = (block === "cap" ? FAMS.filter(f=>!IMPORT_FAMS.has(f)) : GENFAMS);
  const rows = [];
  for(const f of fams){
    const v = runs.map(r => (series(r.sc, block, f)[yi]||0) * scale);
    if(v.every(x=>Math.abs(x) < 1e-6)) continue;
    const lo = v[0], hi = v[v.length-1];
    rows.push({f, v, lo, hi, d:hi-lo, span:Math.max(...v)-Math.min(...v)});
  }
  return rows;
}

/* A — one small panel per family, the rate on the horizontal axis. */
function drCurves(runs, rows, unit){
  /* A number with no unit beside it is not a reading. The scale top carries it
     and so does the change, so neither the panel nor a screenshot of it can be
     read as the wrong quantity. */
  const W=164, H=106, P={l:42,r:11,t:22,b:19};
  const r0 = runs[0].rate, r1 = runs[runs.length-1].rate, dr = (r1-r0) || 1;
  return `<div class="trsm">` + rows.map(row=>{
    const max = Math.max(...row.v)*1.18 || 1;
    const X = r => P.l + (r-r0)/dr*(W-P.l-P.r);
    const Y = v => H-P.b - v/max*(H-P.t-P.b);
    const col = famColor(row.f);
    const flat = row.span < Math.max(max*0.012, 1e-4);
    const pts = runs.map((r,i)=>[X(r.rate), Y(row.v[i])]);
    return `<div class="p${flat?" flat":""}"><svg viewBox="0 0 ${W} ${H}" role="img"
        aria-label="${esc(row.f)}: ${runs.map((r,i)=>r.tag+" "+fmt(row.v[i],2)).join(", ")} ${esc(unit)}">
      <line x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}" stroke="var(--line)" stroke-width="1"/>
      <line class="gl" x1="${P.l}" y1="${P.t}" x2="${W-P.r}" y2="${P.t}"/>
      <text class="ax" x="${P.l-4}" y="${P.t+3}" text-anchor="end">${fmt(max, max<2?1:0)} ${esc(unit)}</text>
      <text class="ax" x="${P.l-4}" y="${H-P.b}" text-anchor="end">0</text>
      <text class="trt" x="1" y="9">${esc(row.f)}</text>
      <polyline fill="none" stroke="${col}" stroke-width="${flat?1.2:2}" stroke-linejoin="round"
        points="${pts.map(q=>q.map(n=>n.toFixed(1)).join(",")).join(" ")}"/>
      ${pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3" fill="${col}"
         stroke="var(--surface-2)" stroke-width="1.2"
         data-tt="${esc(runs[i].key + " — " + runs[i].rate.toFixed(2) + "% DR · " + fmt(row.v[i],2) + " " + unit)}"/>`).join("")}
      <text class="ax" x="${P.l}" y="${H-6}">${r0.toFixed(2)}</text>
      <text class="ax" x="${W-P.r}" y="${H-6}" text-anchor="end">${r1.toFixed(2)}</text>
      <text class="trv" x="${W-P.r}" y="${9}" text-anchor="end">${flat?"flat":(row.d>0?"+":"")+fmt(row.d,2)+" "+esc(unit)}</text>
    </svg></div>`;
  }).join("") + `</div>`;
}

/* B — what the rate moves, and by how much. */
function drTornado(runs, rows, unit){
  const live = rows.filter(r=>Math.abs(r.d) > 0.005).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  const r0 = runs[0].rate.toFixed(2), r1 = runs[runs.length-1].rate.toFixed(2);
  if(!live.length) return `<p class="note">No family changes by more than 0.005 ${esc(unit)} between
    ${r0}% and ${r1}%. On this measure the build is insensitive to the discount rate.</p>`;
  const rowH=25, W=880, P={l:96,r:150,t:24,b:26}, H=P.t+P.b+live.length*rowH;
  const m = Math.max(...live.map(r=>Math.abs(r.d)))*1.08 || 1;
  const mid = (P.l + W - P.r)/2;
  const X = v => mid + v/m*((W-P.l-P.r)/2);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Change in capacity between the lowest and highest discount rate">
    ${live.map((r,i)=>{
      const yy=P.t+i*rowH, col=famColor(r.f);
      const x0=Math.min(mid, X(r.d)), w=Math.max(Math.abs(X(r.d)-mid), 1.5);
      const pct = r.lo > 1e-4 ? r.d/r.lo*100 : null;
      return `<g><text class="trt" x="${P.l-11}" y="${yy+15}" text-anchor="end">${esc(r.f)}</text>
        <rect class="mk-tor" style="--bi:${Math.min(i,14)};--ox:${(r.d>=0?x0:x0+w).toFixed(1)}px"
          x="${x0.toFixed(1)}" y="${yy+4}" width="${w.toFixed(1)}" height="14" rx="2.5" fill="${col}"
          data-tt="${esc(r.f + ": " + fmt(r.lo,2) + " → " + fmt(r.hi,2) + " " + unit)}"/>
        <text class="trv" x="${W-P.r+10}" y="${yy+15}">${(r.d>0?"+":"")+fmt(r.d,2)} ${esc(unit)}${
          pct!=null?" ("+(pct>0?"+":"")+fmt(pct,0)+"%)":""}</text></g>`;
    }).join("")}
    <line x1="${mid}" y1="${P.t-6}" x2="${mid}" y2="${H-P.b+2}" stroke="var(--line)" stroke-width="1"/>
    <text class="ax" x="${mid}" y="${P.t-10}" text-anchor="middle">no change</text>
    <text class="ax" x="${P.l}" y="${H-8}">&#8592; less at ${r1}%</text>
    <text class="ax" x="${W-P.r}" y="${H-8}" text-anchor="end">more at ${r1}% &#8594;</text>
  </svg>`;
}

/* C — where each family sits, and how far the rate moves it. */
function drDumbbell(runs, rows, unit){
  const live = rows.slice().sort((a,b)=> b.span-a.span || Math.max(...b.v)-Math.max(...a.v));
  const rowH=23, W=880, P={l:96,r:128,t:22,b:28}, H=P.t+P.b+live.length*rowH;
  const max = Math.max(...live.map(r=>Math.max(...r.v)))*1.06 || 1;
  const X = v => P.l + v/max*(W-P.l-P.r);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Capacity by family at each discount rate">
    ${[0,.25,.5,.75,1].map(t=>`<line class="gl" x1="${X(t*max).toFixed(1)}" y1="${P.t-6}"
        x2="${X(t*max).toFixed(1)}" y2="${H-P.b}"/>
      <text class="ax" x="${X(t*max).toFixed(1)}" y="${H-12}" text-anchor="middle">${fmt(t*max, max<4?1:0)}</text>`).join("")}
    <text class="ax" x="${W-P.r+8}" y="${H-12}">${esc(unit)}</text>
    <text class="ax" x="${W-P.r+8}" y="${P.t-4}">spread</text>
    ${live.map((r,i)=>{
      const yy=P.t+i*rowH+7, col=famColor(r.f);
      const lo=Math.min(...r.v), hi=Math.max(...r.v), moved = hi-lo > 1e-4;
      return `<g><text class="trt" x="${P.l-11}" y="${yy+4}" text-anchor="end">${esc(r.f)}</text>
        ${moved?`<line x1="${X(lo).toFixed(1)}" y1="${yy}" x2="${X(hi).toFixed(1)}" y2="${yy}"
          stroke="${col}" stroke-width="3.5" opacity=".38" stroke-linecap="round"/>`:""}
        ${r.v.map((v,j)=>`<circle cx="${X(v).toFixed(1)}" cy="${yy}" r="${j===0?4.5:3.5}"
          fill="${j===0?col:"var(--surface)"}" stroke="${col}" stroke-width="1.8"
          data-tt="${esc(runs[j].key + " — " + runs[j].rate.toFixed(2) + "% DR · " + fmt(v,2) + " " + unit)}"/>`).join("")}
        <text class="trv" x="${W-P.r+8}" y="${yy+4}">${moved?fmt(hi-lo,2)+" "+esc(unit):"—"}</text></g>`;
    }).join("")}
  </svg>
  <p class="note">Filled dot: the lowest rate, ${runs[0].rate.toFixed(2)}%. Hollow dots:
  ${runs.slice(1).map(r=>r.tag+" "+r.rate.toFixed(2)+"%").join(", ")}. The figure in the right margin is the spread.</p>`;
}

function vTechResp(sc){
  const runs = drRuns(sc);
  const base = (splitScen(sc.name) || {case:String(sc.name||"")}).case;
  const want = Object.keys(SCEN).filter(k => SCEN[k].case === base && SCEN[k].variant);
  if(runs.length < 2) return `<div class="grid"><div class="card wide">
    <h3 data-noscen>Technology response to the discount rate</h3>
    <p class="note">This view compares the runs of one case that differ only in their discount rate.
    ${runs.length===1 ? `Only <span class="mono">${esc(runs[0].key)}</span> is loaded for ${esc(base)}.`
      : `No run of ${esc(base)} with a known discount rate is loaded.`}
    ${want.length > 1 ? `Load at least two of ${want.map(k=>`<span class="mono">${esc(k)}</span>`).join(", ")}
    and they will be compared here.` : `<span class="mono">config/scenarios.md</span> lists fewer than two
    variants of ${esc(base)}, so there is nothing to compare.`}</p></div></div>`;

  const yrs = S.years;
  let y = S.trYear!=null && yrs.indexOf(String(S.trYear))>=0 ? String(S.trYear) : yrs[yrs.length-1];
  const yi = yrs.indexOf(y);
  const block = S.trBlock === "act" ? "act" : "cap";
  const scale = block === "cap" ? PW() : U();
  const unit  = block === "cap" ? PL() : UL();
  const rows  = drTable(runs, block, yi, scale);
  const movers = rows.filter(r=>r.span > 1e-4).length;

  return `<div class="grid">
    <div class="trbar">
      <span class="cpill">${esc(S.selC||"")}</span>
      <span class="trcase">${esc(base)} &middot; ${runs.length} runs</span>
      <label for="trY">Year</label>
      <select id="trY" data-tr="y">${yrs.map(v=>`<option value="${v}"${v===y?" selected":""}>${v}</option>`).join("")}</select>
      <label for="trB">Measure</label>
      <select id="trB" data-tr="b">
        <option value="cap"${block==="cap"?" selected":""}>Installed capacity</option>
        <option value="act"${block==="act"?" selected":""}>Annual output</option>
      </select>
      <span class="rates">${runs.map(r=>`<b>${esc(r.tag)}</b> ${r.rate.toFixed(2)}%`).join(" &middot; ")}</span>
    </div>

    <div class="card wide"><h3 data-noscen>Response of each technology to the discount rate</h3>
      ${drCurves(runs, rows.slice().sort((a,b)=>
        (b.span/(Math.max(...b.v)||1)) - (a.span/(Math.max(...a.v)||1))), unit)}
      <p class="note">${base} in ${y}, ${runs.length} run${runs.length===1?"":"s"};
      ${movers} of ${rows.length} famil${rows.length===1?"y":"ies"} move at all. The horizontal axis is the
      rate itself, spaced by this country's own values: ${runs.map(r=>r.tag+" "+r.rate.toFixed(2)+"%").join(", ")}.</p></div>

    <div class="card wide"><h3 data-noscen>Sensitivity to the discount rate</h3>
      ${drTornado(runs, rows, unit)}
      <p class="note">Change between the lowest and the highest rate loaded. A family that moves by less
      than 0.005 ${esc(unit)} is left out rather than drawn as a hairline.</p></div>

    <div class="card wide"><h3 data-noscen>Level and spread across the discount rates</h3>
      ${drDumbbell(runs, rows, unit)}
      <p class="note">A technology can be large and unmoved, or small and highly sensitive; this chart is
      the one that separates the two.</p></div>
  </div>`;
}

function vDiagnostics(sc){
  const F=[];
  const n=S.years.length-1;
  const bb=busbar(sc), dem=sc.dem||[], exp=sc.exp||[];
  // 1. energy balance
  const need = (dem[n]||0), got = bb[n]-(exp[n]||0);
  const gap = need>0 ? 100*(got-need*1.0)/need : 0;
  F.push({s: Math.abs(gap)<20?"ok":"wn", t:"Energy balance, "+S.years[n],
    b:`Busbar supply ${fmt(bb[n],1)} PJ, exports ${fmt(exp[n]||0,1)} PJ, final demand ${fmt(need,1)} PJ. The residual is transmission and distribution loss, which should be roughly 5 to 12 per cent of supply. Here it is ${fmt(100*(bb[n]-(exp[n]||0)-need)/Math.max(bb[n],1e-9),1)} per cent.`});
  // 2. spurious exports in calibration years
  const eEarly = sum((exp||[]).slice(0,6));
  if(eEarly>0.5) F.push({s:"cr", t:"Exports in the calibration years",
    b:`The model exports ${fmt(eEarly,1)} PJ over ${S.years[0]}–${S.years[5]}. If the country does not export electricity, this is surplus escaping through an unconstrained <span class="mono">${esc(EXPORT_TECH||"")}</span>. It usually means the historical generation floors and the demand series are mutually inconsistent.`});
  // 3. capacity pinned at a flat ceiling — the "the cap produced the answer" signature
  FAMS.forEach(f=>{
    const d=series(sc,"cap",f); if(!sum(d)) return;
    const peak=Math.max(...d); if(!(peak>1)) return;
    let flat=0; for(let i=n;i>=0 && Math.abs(d[i]-peak)<Math.max(1e-6,peak*1e-5);i--) flat++;
    if(flat<3) return;
    const tidy = Math.abs(peak-Math.round(peak))<1e-6;   // lands on a whole number
    F.push({s:"wn", t:`${f} capacity sits at ${fmt(peak*PW(), tidy?0:PD(2))} ${PL()} for ${flat} years`,
      b:`Flat at the series maximum from ${S.years[n-flat+1]} to ${S.years[n]}${tidy?", on a whole number":""}. That is the signature of a binding <span class="mono">TotalAnnualMaxCapacity</span>: the cap produced the answer, not the economics. Check where that cap value came from and whether it is a technical potential rather than a deployment limit.`});
  });
  // 3b. activity pinned at a ceiling
  FAMS.forEach(f=>{
    const a=series(sc,"act",f); if(!sum(a)) return;
    const peak=Math.max(...a); if(!(peak>1)) return;
    let flat=0; for(let i=n;i>=0 && Math.abs(a[i]-peak)<Math.max(1e-6,peak*1e-5);i--) flat++;
    if(flat>=4 && Math.abs(series(sc,"cap",f)[n]-Math.max(...series(sc,"cap",f)))>1e-6)
      F.push({s:"wn", t:`${f} output flat at ${fmt(peak,1)} PJ for ${flat} years`,
        b:`Output stops growing while capacity still changes. Usually a binding <span class="mono">TotalTechnologyAnnualActivityUpperLimit</span> or an exhausted resource, not an economic choice.`});
  });
  // 4. instantaneous build
  let big={v:0}; FAMS.forEach(f=>series(sc,"new",f).forEach((v,i)=>{ if(v>big.v) big={v,f,y:S.years[i]}; }));
  const capPrev = big.f ? (series(sc,"cap",big.f)[S.years.indexOf(big.y)-1]||0) : 0;
  if(big.v>0 && big.v > Math.max(2, capPrev))
    F.push({s:"cr", t:`${fmt(big.v*PW(),PD(1))} ${PL()} of ${big.f} built in ${big.y}`,
      b:`That single year exceeds the entire ${big.f} fleet standing the year before (${fmt(capPrev*PW(),PD(1))} ${PL()}). Without <span class="mono">TotalAnnualMaxCapacityInvestment</span> the model has no build-rate limit and no construction lead time.`});
  // 5. terminal-year build
  const lastAdds = FAMS.map(f=>({f,v:series(sc,"new",f)[n]||0})).filter(x=>x.v>1);
  if(lastAdds.length) F.push({s:"wn", t:"Capacity added in the final year",
    b:lastAdds.map(x=>`${fmt(x.v*PW(),PD(1))} ${PL()} of ${x.f}`).join(", ")+`. Building in the terminal year is often an artefact: salvage value returns most of the capital, so a plant bought in ${S.years[n]} is nearly free to the objective.`});
  // 6. binding constraints from duals
  if(sc.bind && sc.bind.length){
    const byKind={}; sc.bind.forEach(b=>{ (byKind[b.kind] ||= new Set()).add(b.who); });
    F.push({s:"ok", t:"Binding constraints detected from the LP marginals",
      b:Object.entries(byKind).map(([k,v])=>`<b>${k}</b>: ${[...v].slice(0,8).join(", ")}`).join("<br>")+
      `<br>A non-zero shadow price means that constraint, not cost, set the result.`});
  } else if(sc.src!=="sample") F.push({s:"ok", t:"No binding constraints found",
      b:"Either the run is genuinely unconstrained, or the file loaded was a csv export, which does not carry the marginals. Load <span class='mono'>results.txt</span> to get them."});
  // 6b. unserved demand
  const bsD = backstop(sc);
  if(bsD) F.push({s:"cr", t:`Supply shortfall: the backstop ran in ${bsD.hit.length} year${bsD.hit.length===1?"":"s"}`,
    b:`Peak ${fmt(bsD.peak.v,2)} PJ in ${bsD.peak.y}, ${fmt(bsD.total,2)} PJ over the horizon. <span class="mono">BACKSTOP</span> is a dummy technology at a prohibitive price, so the solver reached for it only because capacity, imports and storage together could not meet demand. Until that is resolved, cost and emission totals for this run describe a system that does not serve its load.`});
  // 7. idle plant
  const idleGw = GENFAMS.filter(f=>!IMPORT_FAMS.has(f)).reduce((a,f)=>{
    const c=series(sc,"cap",f)[n]||0, act=series(sc,"act",f)[n]||0; return a + ((c>0.01&&act<1e-4)?c:0); },0);
  if(idleGw>0.01) F.push({s:"wn", t:`${fmt(idleGw*PW(),PD(1))} ${PL()} idle in ${S.years[n]}`,
    b:"Capacity standing with zero output while fixed O&M is still charged. Check whether the residual capacity profile retires plant on a realistic operational life."});

  return `<div class="banner">These checks read the loaded results only. They flag patterns that usually indicate a modelling artefact rather than a finding. Each one is a prompt to look, not a verdict.</div>
  <div class="grid"><div class="card wide"><h3>Automated checks</h3><div class="stack">`+
    F.map(f=>`<div class="find ${f.s}"><div class="sev"></div><div><div class="ft">${f.t}</div><div class="fb">${f.b}</div></div></div>`).join("")+
  `</div></div></div>`;
}

function vData(sc){
  const u=U(), ul=UL();
  const blocks=[["act","Generation ("+ul+")"],["cap","Capacity ("+PL()+")"],["new","Additions ("+PL()+")"],
    ["capex","Capital (M USD)"],["fom","Fixed O&M (M USD)"]];
  let html = `<div class="card wide"><h3 data-noscen>Colour convention</h3>
    <p class="note">Fuel colours follow the Ember / IEA electricity convention, adjusted so that every adjacent pair stays separable under the three common forms of colour vision deficiency. The same hue means the same fuel on every plot and in every country.</p>
    ${legend(FAMS.map(f=>({label:f,color:famColor(f)})))}
    ${legend(Object.keys(FUELVAR).map(f=>({label:f,color:css(FUELVAR[f])})))}
  </div>
  <div class="card wide"><h3>All series, ${esc(sc.name)}</h3>
    <button class="btn" id="copyBtn" style="align-self:flex-start">Copy as TSV</button>
    <div class="scroll"><table id="dataTbl"><thead><tr><th>Block</th><th>Series</th>`+
    S.years.map(y=>`<th>${y}</th>`).join("")+`</tr></thead><tbody>`;
  for(const [b,lab] of blocks){
    const scale = b==="act" ? u : (b==="cap"||b==="new") ? PW() : 1;
    FAMS.filter(f=>sum(series(sc,b,f))>0).forEach(f=>{
      html += `<tr><td>${esc(lab)}</td><td><span class="legend" style="display:inline-flex"><i style="background:${famColor(f)}"></i>${f}</span></td>`+
        series(sc,b,f).map(v=>`<td class="mono">${v?fmt(v*scale,2):""}</td>`).join("")+`</tr>`;
    });
  }
  Object.entries(sc.emi||{}).forEach(([t,d])=>{
    html += `<tr><td>Emissions (Mt CO₂)</td><td class="mono">${esc(t)}</td>`+
      d.map(v=>`<td class="mono">${v?fmt(v,3):""}</td>`).join("")+`</tr>`;
  });
  if(sc.dem) html += `<tr><td>Demand (PJ)</td><td>Final demand</td>`+sc.dem.map(v=>`<td class="mono">${v?fmt(v,2):""}</td>`).join("")+`</tr>`;
  html += `</tbody></table></div></div>`;
  return `<div class="grid">${html}</div>`;
}

/* ============================ render ============================ */
/* The outline the rail already draws, at button size. */
function countryMark(n, cls){
  const a = COUNTRY_ART[n];
  if(!a) return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/>
    <circle cx="12" cy="10" r="2.3"/></svg>`;
  return `<svg class="${cls}" viewBox="-2 -2 ${a.w+4} ${a.h+4}" preserveAspectRatio="xMidYMid meet"
    aria-hidden="true"><path d="${a.d}"/></svg>`;
}
/* Shown on the country switch before anything is chosen. A globe, not the
   silhouette of whichever country happens to sort first. */
const CPICK_ANY = '<svg class="art" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
  + 'stroke-width="1.7" stroke-linecap="round" aria-hidden="true">'
  + '<circle cx="12" cy="12" r="8.4"/><path d="M3.6 12h16.8"/>'
  + '<path d="M12 3.6a13 13 0 0 1 0 16.8a13 13 0 0 1 0-16.8"/></svg>';
const CPICK_CV = '<svg class="cv" width="12" height="12" viewBox="0 0 24 24" fill="none" '
  + 'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" '
  + 'aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function goCountry(n){
  if(S.C[n] && S.C[n].order.length){ S.sel=null; useCountry(n); }
  else { S.selC=n; S.caseName=""; S.years=[]; S.scen={}; S.order=[]; S.sel=null; }
  render();
}
function renderRail(){
  /* Country switch: every country in config/countries.md, every time, with
     the ones that have results lit. */
  const pb=document.getElementById("cPickB"), pp=document.getElementById("cPickP");
  const all=[...new Set([...Object.values(ISO), ...Object.keys(S.C)])].sort();
  pb.innerHTML = (S.selC ? countryMark(S.selC, "art") : CPICK_ANY)
    + `<span class="nm">${esc(S.selC || "Choose a country")}</span>` + CPICK_CV;
  pp.innerHTML = all.map(n=>{
    const c=S.C[n], loaded=!!(c && c.order.length);
    return `<button class="cpick-i${n===S.selC?" on":""}${loaded?"":" off"}" role="menuitem"
      data-c="${esc(n)}" title="${esc(n + (loaded ? "" : " — nothing read yet"))}">
      ${countryMark(n,"art")}<span class="lab">${esc(n)}</span><span class="led"></span></button>`;
  }).join("");
  const closeP = ()=>{ pp.classList.remove("open"); pb.setAttribute("aria-expanded","false"); };
  pb.onclick = e=>{
    e.stopPropagation();
    const open = !pp.classList.contains("open");
    pp.classList.toggle("open", open);
    pb.setAttribute("aria-expanded", open);
    if(open){ const cur = pp.querySelector(".cpick-i.on") || pp.querySelector(".cpick-i"); if(cur) cur.focus(); }
  };
  pp.querySelectorAll("[data-c]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); closeP(); goCountry(b.dataset.c);
  });
  if(!CPICK_WIRED){
    CPICK_WIRED = true;
    addEventListener("click", ()=>{ const q=document.getElementById("cPickP");
      if(q){ q.classList.remove("open");
        const t=document.getElementById("cPickB"); if(t) t.setAttribute("aria-expanded","false"); } });
    addEventListener("keydown", e=>{ if(e.key!=="Escape") return;
      const q=document.getElementById("cPickP");
      if(q && q.classList.contains("open")){ q.classList.remove("open");
        const t=document.getElementById("cPickB"); if(t){ t.setAttribute("aria-expanded","false"); t.focus(); } } });
  }
  const rs=document.getElementById("refreshScope");
  if(rs) rs.textContent = (S.tab!=="home" && S.selC && !S.sample) ? `re-reads ${S.selC} only` :
                          (ROOT ? "re-reads every country" : "");
  const loadedCount=Object.values(S.C).filter(c=>c.order.length).length;
  document.getElementById("countryNote").textContent =
    `${loadedCount} of ${Object.keys(ISO).length} loaded`;

  /* A run is a case solved at a discount rate, so the switch is built that way:
     one card per case, the rates inside it. On the tech response tab the rate is
     not a choice — that view reads all of them — so the rates go grey there and
     only the case stays live. */
  const list=document.getElementById("scList");
  const DRORD = VARIANTS;                // config/scenarios.md, Variants table
  const cases = [];                      // in the order the runs were loaded
  const loose = [];
  for(const k of S.order){
    const m = splitScen(k);
    if(!m || !m.variant){ loose.push(k); continue; }
    let c = cases.find(x=>x.name===m.case);
    if(!c) cases.push(c = {name:m.case, runs:{}});
    c.runs[m.variant] = k;
  }
  /* The colour of a case card: style = reference or policy in config/scenarios.md. */
  const famOf = n => { const cs = CASES[(splitScen(n) || {case:n}).case] || CASES[n];
    return !cs ? "" : cs.style === "policy" ? "nze" : cs.style === "reference" ? "ref" : ""; };
  const lock = S.tab === "techresp";     // the rate is read, not chosen, on that tab
  list.className = "sclist-h" + (lock ? " drlock" : "");
  const openCase = (()=>{ const m=splitScen(S.sel); return m && m.variant ? m.case : null; })();
  list.innerHTML = cases.map(c=>{
    const here = c.name === openCase;
    const rates = DRORD.filter(d=>c.runs[d]).map(d=>{
      const k = c.runs[d], rate = drFor(S.selC, k);
      const cls = (k===S.sel?" on":"") + (k===BASELINE?" base":"") + (backstop(S.scen[k])?" bk":"");
      return `<button class="drb${cls}" data-sc="${esc(k)}" aria-current="${k===S.sel}"
        ${lock?'tabindex="-1"':""}
        title="${esc(k + (rate!=null ? " — " + (rate*100).toFixed(2) + "% discount rate" : "") +
                (k===BASELINE ? " · base case" : ""))}">${d}</button>`;
    }).join("");
    return `<div class="sccard ${famOf(c.name)}${here?" here":""}">
      <button class="cs-n" data-case="${esc(c.name)}" aria-current="${here}"
        title="${esc(c.name)} — ${Object.keys(c.runs).length} variant${Object.keys(c.runs).length===1?"":"s"} loaded">
        <span class="dot"></span>${esc(c.name)}</button>
      <span class="cs-drs">${rates}</span></div>`;
  }).join("") + loose.map(k=>
    `<button class="scb ${famOf(k)}${k===S.sel?" on":""}" data-sc="${esc(k)}"
      aria-current="${k===S.sel}"><span class="dot"></span>${esc(k)}</button>`).join("")
  || `<span class="note" style="color:var(--ink-3);font-size:12px;padding:4px 8px">No scenarios loaded</span>`;
  list.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{
    if(lock && b.classList.contains("drb")) return;
    S.sel=b.dataset.sc; render();
  });
  /* Clicking the case keeps the rate you were on where that run exists, so
     moving between cases is a like-for-like comparison. */
  list.querySelectorAll("[data-case]").forEach(b=>b.onclick=()=>{
    const c = cases.find(x=>x.name===b.dataset.case); if(!c) return;
    const cur = (splitScen(S.sel) || {}).variant;
    S.sel = (cur && c.runs[cur]) || VARIANTS.map(v=>c.runs[v]).find(Boolean);
    render();
  });

  const art=document.getElementById("railArt"), a=COUNTRY_ART[S.selC];
  art.innerHTML = a ? `<svg viewBox="-2 -2 ${a.w+4} ${a.h+4}" preserveAspectRatio="xMidYMid meet"
      style="aspect-ratio:${(a.w+4)/(a.h+4)}"><path d="${a.d}"/></svg>
    <span class="cn">${esc(S.selC)}</span>` : "";

  const sc=S.scen[S.sel]; const d=document.getElementById("dossier");
  if(!sc){ d.innerHTML=""; return; }
  const n=S.years.length-1;
  const cap = sc.aelim && sc.aelim.some(v=>v!=null);
  const runAt = sc.runAt ? new Date(sc.runAt) : (sc.resAt ? new Date(sc.resAt) : null);
  d.innerHTML = `<div class="dt">${esc(sc.name)}</div>
    <div class="dd">${esc(sc.desc||"No description in config/scenarios.md.")}</div>
    ${(()=>{ const b=backstop(sc); return b
       ? `<div><span class="pill cr">Supply shortfall &middot; ${b.hit.length} yr${b.hit.length===1?"":"s"}</span></div>` : ""; })()}
    <div>${sc.name===BASELINE?'<span class="pill wn" style="text-decoration:underline;text-underline-offset:2px">Base case</span> ':""}
      ${sc.dr!=null?`<span class="pill wn" title="${esc(sc.drSrc||"")}">${(sc.dr*100).toFixed(2)}% discount</span>`:`<span class="pill wn">discount rate unknown</span>`}</div>
    ${sc.dr!=null&&sc.drSrc?(sc.drSrc==="country"
      ? `<div class="dd">Country rate from <span class="mono">config/scenarios.md</span>; the results file does not carry it.</div>`
      : `<div class="dd">Rate from <span class="mono">config/scenarios.md</span>; the results file does not carry it.</div>`):""}
    ${(!cap && ((CASES[(splitScen(sc.name)||{}).case]||{}).cap))?`<div class="dd">No annual cap line is drawn. <span class="mono">AnnualEmissionLimit</span> is a model input, and a results file carries only what the solver wrote, so the cap itself is not in the file.</div>`:""}
    ${sc.dr==null?`<div class="dd">No discount rate for this scenario in <span class="mono">config/scenarios.md</span>.</div>`:""}
    <dl class="kv">
      <dt>Total discounted costs</dt><dd class="mono">${sc.obj!=null?fmt(sc.obj,0):"–"}</dd>
      <dt>Years</dt><dd class="mono">${S.years[0]}–${S.years[n]}</dd>
      <dt>Run at</dt><dd class="mono">${runAt?runAt.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}):"–"}</dd>
      <dt>Solve time</dt><dd class="mono">${sc.solveMs?Math.round(sc.solveMs/1000)+" s":"–"}</dd>
      <dt>Source</dt><dd>${sc.src==="sample"?"sample":"loaded file"}</dd>
    </dl>`;
}
